<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privasi dalam Perspektif Hadis · Tematik</title>
    <base target="_self" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f6f0;
            color: #1e2b3a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        :root {
            --primary: #2b4f8c;
            --gold: #c9a84c;
            --gold-light: #e0c66e;
            --gold-dark: #a8892f;
            --bg-body: #f8f6f0;
            --bg-card: #ffffff;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 300px;
            --header-height: 72px;
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: var(--header-height);
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 12px rgba(43, 79, 140, 0.25);
        }
        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-header .brand img {
            height: 44px;
            width: auto;
            border-radius: 6px;
            background: #fff;
            padding: 4px;
            object-fit: contain;
        }
        .app-header .brand .title-group {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .app-header .brand .title-group h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .app-header .brand .title-group .author {
            font-size: 0.8rem;
            color: var(--gold-light);
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .app-header .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 4px;
            border-radius: 6px;
        }
        .app-header .hamburger:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .app-header .hamburger span {
            display: block;
            width: 26px;
            height: 2.5px;
            background: #fff;
            border-radius: 4px;
        }

        .app-layout {
            display: flex;
            flex: 1;
            position: relative;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-left: 1px solid rgba(43, 79, 140, 0.10);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.04);
            height: calc(100vh - var(--header-height));
            position: sticky;
            top: var(--header-height);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 10px 30px;
            flex-shrink: 0;
            transition: transform var(--transition);
            z-index: 900;
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: #f0ede7;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 8px;
        }

        .menu-section {
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(43, 79, 140, 0.06);
        }
        .menu-section:last-of-type {
            border-bottom: none;
        }

        .menu-head {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 14px;
            background: transparent;
            border: none;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
        }
        .menu-head:hover {
            background: rgba(43, 79, 140, 0.06);
        }
        .menu-head .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            fill: var(--primary);
        }
        .menu-head .arrow {
            margin-left: auto;
            font-size: 0.7rem;
            transition: transform var(--transition);
            color: var(--gold-dark);
        }
        .menu-head.open .arrow {
            transform: rotate(90deg);
        }

        .sub-menu {
            list-style: none;
            padding: 0;
            margin: 0 0 6px 0;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s ease, opacity 0.25s ease;
            opacity: 0;
        }
        .sub-menu.open {
            max-height: 1200px;
            opacity: 1;
        }
        .sub-menu li {
            margin: 0;
        }
        .sub-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px 8px 38px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 450;
            color: #2d3f54;
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .sub-link:hover {
            background: rgba(43, 79, 140, 0.07);
            color: var(--primary);
        }
        .sub-link.active {
            background: var(--primary);
            color: #fff;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(43, 79, 140, 0.25);
        }
        .sub-link .sub-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            fill: #2d3f54;
            opacity: 0.8;
        }
        .sub-link:hover .sub-icon {
            fill: var(--primary);
        }
        .sub-link.active .sub-icon {
            fill: #fff;
            opacity: 1;
        }

        .extra-menu {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 2px solid rgba(43, 79, 140, 0.08);
        }
        .extra-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--primary);
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .extra-link:hover {
            background: rgba(43, 79, 140, 0.06);
        }
        .extra-link.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(43, 79, 140, 0.25);
        }
        .extra-link .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            fill: var(--primary);
        }
        .extra-link.active .icon {
            fill: #fff;
        }

        .main-content {
            flex: 1;
            padding: 32px 40px 60px;
            min-width: 0;
            background: var(--bg-body);
        }
        .content-panel {
            display: none;
            animation: fadeUp 0.35s ease;
        }
        .content-panel.active {
            display: block;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            border-bottom: 3px solid var(--gold);
            padding-bottom: 10px;
            display: inline-block;
        }
        .panel-sub {
            font-size: 0.95rem;
            color: #5e6f82;
            margin-bottom: 24px;
        }

        .hadith-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin: 18px 0 22px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--gold);
        }
        .hadith-box .arabic {
            font-size: 1.15rem;
            line-height: 1.9;
            color: #1e2b3a;
            direction: rtl;
            font-family: 'Times New Roman', 'Traditional Arabic', serif;
            margin-bottom: 12px;
            padding: 6px 0;
            word-wrap: break-word;
        }
        .hadith-box .translation {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #2d3f54;
            border-top: 1px dashed rgba(43, 79, 140, 0.12);
            padding-top: 12px;
        }
        .hadith-box .source {
            display: block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--gold-dark);
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .sub-section {
            margin-top: 28px;
        }
        .sub-section h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .sub-section p {
            line-height: 1.7;
            color: #2d3f54;
            margin-bottom: 10px;
        }

        .bibliography {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 2px solid rgba(43, 79, 140, 0.10);
        }
        .bibliography h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 14px;
        }
        .bibliography ul {
            list-style: none;
            padding: 0;
        }
        .bibliography ul li {
            padding: 6px 0 6px 20px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #2d3f54;
            border-bottom: 1px solid rgba(43, 79, 140, 0.05);
            text-indent: -20px;
            padding-left: 30px;
        }
        .bibliography ul li::before {
            content: "•";
            color: var(--gold);
            font-weight: 700;
            margin-right: 8px;
        }

        .profile-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 28px 32px;
            box-shadow: var(--shadow);
            border-top: 4px solid var(--gold);
            margin-top: 12px;
        }
        .profile-card .name {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 4px;
        }
        .profile-card .role {
            font-size: 0.9rem;
            color: var(--gold-dark);
            font-weight: 500;
            margin-bottom: 12px;
        }
        .profile-card p {
            line-height: 1.7;
            color: #2d3f54;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .overlay.active {
            display: block;
        }

        @media (max-width: 991px) {
            .app-header .hamburger {
                display: flex;
            }
            .sidebar {
                position: fixed;
                top: var(--header-height);
                right: 0;
                height: calc(100vh - var(--header-height));
                transform: translateX(100%);
                box-shadow: -8px 0 30px rgba(0, 0, 0, 0.10);
                border-left: none;
                width: 290px;
                padding: 12px 8px 30px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                padding: 20px 18px 40px;
            }
            .panel-title {
                font-size: 1.5rem;
            }
            .app-header .brand .title-group h1 {
                font-size: 1rem;
            }
            .app-header .brand img {
                height: 36px;
            }
            .hadith-box {
                padding: 16px 18px;
            }
            .hadith-box .arabic {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            :root {
                --header-height: 64px;
            }
            .app-header {
                padding: 0 14px;
            }
            .app-header .brand .title-group h1 {
                font-size: 0.85rem;
            }
            .app-header .brand .title-group .author {
                font-size: 0.7rem;
            }
            .sidebar {
                width: 265px;
            }
            .main-content {
                padding: 14px 12px 30px;
            }
            .panel-title {
                font-size: 1.25rem;
            }
            .sub-link {
                padding: 7px 10px 7px 28px;
                font-size: 0.8rem;
            }
            .menu-head {
                padding: 10px 12px;
                font-size: 0.85rem;
            }
            .profile-card {
                padding: 20px 18px;
            }
            .profile-card .name {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <img src="logo-pshd.jpg" alt="Logo" />
            <div class="title-group">
                <h1>Privasi dalam Perspektif Hadis</h1>
                <span class="author">Penyusun: Akhsa Alpar Mubarok</span>
            </div>
        </div>
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="app-layout">
        <div class="overlay" id="overlay"></div>

        <nav class="sidebar" id="sidebar" role="navigation" aria-label="Daftar isi">
            <div class="top-menu" id="topMenu"></div>
            <div id="menuContainer"></div>
            <div class="extra-menu" id="extraMenu"></div>
        </nav>

        <main class="main-content" id="mainContent">
            <div id="panelContainer"></div>
        </main>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== SVG Icons =====
            const svgIcons = {

                lock: '<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>',
                user: '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
                eye: '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>',
                home: '<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>',
                talk: '<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>',
                secret: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8 0-.59.08-1.16.23-1.7l5.57 5.57c.3.3.71.44 1.13.44h1.48c.71 0 1.3-.57 1.3-1.28v-.89l2.35-2.35c.6.81.94 1.78.94 2.81 0 4.41-3.59 8-8 8zm6.83-12.83L12.7 9.3c-.3-.3-.71-.44-1.13-.44h-1.48c-.71 0-1.3.57-1.3 1.28v.89L5.83 12.3C5.23 11.49 4.89 10.52 4.89 9.5c0-4.41 3.59-8 8-8 2.96 0 5.54 1.61 6.94 4.17z"/></svg>',

                folder: '<svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>',

            // ===== DATA =====
            const topMenuData = [{
                id: 'kata-pengantar',
                label: 'Kata Pengantar',
                icon: svgIcons.book,
                content: `
                        <h2 class="panel-title">Kata Pengantar</h2>
                        <p style="line-height:1.8; font-size:1rem; color:#2d3f54; margin-bottom:16px;">
                            Alhamdulillāh, segala puji bagi Allah Swt. atas segala rahmat, taufik, dan hidayah-Nya sehingga buku yang berjudul <strong>“Privasi dalam Perspektif Hadis: Studi Hadis Tematik”</strong> ini dapat diselesaikan dengan baik. Shalawat serta salam semoga senantiasa tercurah kepada Nabi Muhammad saw., keluarga, sahabat, dan seluruh umat Islam yang istiqamah mengikuti sunnah beliau hingga akhir zaman.
                        </p>
                        <p style="line-height:1.8; font-size:1rem; color:#2d3f54; margin-bottom:16px;">
                            Buku ini disusun sebagai bentuk upaya menghimpun hadis-hadis Nabi yang berkaitan dengan privasi dalam perspektif Islam, khususnya mengenai perlindungan kehormatan diri, etika meminta izin, menjaga rahasia, serta penghormatan terhadap ruang pribadi dalam kehidupan sosial. Penulisan buku ini dilatarbelakangi oleh pentingnya menghadirkan pemahaman hadis yang lebih utuh, sistematis, dan proporsional terhadap isu privasi, mengingat pembahasan mengenai privasi dalam kehidupan modern semakin relevan di tengah perkembangan teknologi informasi dan media sosial yang sering kali mengaburkan batas-batas privasi individu.
                        </p>
                        <p style="line-height:1.8; font-size:1rem; color:#2d3f54; margin-bottom:16px;">

                    items.forEach(item => {
                        if (item.children) {
                            collectPanels(item.children);
                        } else {
                            html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                        }
                    });
                }
                collectPanels(menuData);
                extraData.forEach(item => {
                    html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                });
                panelContainer.innerHTML = html;
            }

            function showPanel(panelId, fromSubLink = true) {
                document.querySelectorAll('.content-panel').forEach(el => el.classList.remove('active'));
                const panel = document.getElementById('panel-' + panelId);
                if (panel) panel.classList.add('active');

                document.querySelectorAll('.sub-link, .extra-link').forEach(el => el.classList.remove('active'));
                const link = document.querySelector(`.sub-link[data-panel="${panelId}"], .extra-link[data-panel="${panelId}"]`);
                if (link) link.classList.add('active');

                if (window.innerWidth <= 991 && fromSubLink) closeSidebar();
            }

            function toggleSection(btn) {
                const sub = btn.nextElementSibling;
                if (!sub) return;
                const isOpen = sub.classList.contains('open');
                if (isOpen) {
                    sub.classList.remove('open');
                    btn.classList.remove('open');
                    btn.setAttribute('aria-expanded', 'false');
                } else {
                    sub.classList.add('open');
                    btn.classList.add('open');
                    btn.setAttribute('aria-expanded', 'true');
                }
            }

            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function toggleSidebar() {
                if (sidebar.classList.contains('open')) closeSidebar();
                else openSidebar();
            }

            function init() {
                renderPanels();
                renderTopMenu();
                renderMenu();
                renderExtraMenu();

                topMenuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                    }
                });

                menuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('menu-head')) {
                        e.stopPropagation();
                        toggleSection(target);
                        return;
                    }
                    if (target.classList.contains('sub-link')) {
                        e.preventDefault();
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                        return;
                    }
                });

                extraMenuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                    }
                });

                // Default: tampilkan kata pengantar
                if (topMenuData.length > 0) {
                    showPanel(topMenuData[0].id, false);
                }

                hamburger.addEventListener('click', toggleSidebar);
                overlay.addEventListener('click', closeSidebar);
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 991) closeSidebar();
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
                });
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
</body>
</html>
