<!DOCTYPE html>
<html lang="id">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f6f0;
            color: #1e2b3a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        :root {
            --primary: #2b4f8c;
            --gold: #c9a84c;
            --gold-light: #e0c66e;
            --gold-dark: #a8892f;
            --bg-body: #f8f6f0;
            --bg-card: #ffffff;
            --shadow: 0 8px 30px rgba(0,0,0,0.08);

        }
        .app-header {

            top: 0;
            z-index: 1000;

            background: var(--primary);

        }

        }
        .app-header .brand .title-group h1 {

            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .app-header .brand .title-group .author {

        }
        .app-header .hamburger {

            flex-direction: column;

            padding: 6px 4px;

        }

        .app-header .hamburger span {
            display: block;
            width: 26px;
            height: 2.5px;
            background: #fff;
            border-radius: 4px;
        }
        .app-layout { display: flex; flex: 1; position: relative; }
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-left: 1px solid rgba(43,79,140,0.10);
            box-shadow: -4px 0 20px rgba(0,0,0,0.04);
            height: calc(100vh - var(--header-height));
            position: sticky;
            top: var(--header-height);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 10px 30px;
            flex-shrink: 0;
            transition: transform var(--transition);
            z-index: 900;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: #f0ede7; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 8px; }

        .menu-section { margin-bottom: 4px; border-bottom: 1px solid rgba(43,79,140,0.06); }
        .menu-section:last-of-type { border-bottom: none; }
        .menu-head {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 14px;
            background: transparent;
            border: none;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
        }
        .menu-head:hover { background: rgba(43,79,140,0.06); }
        .menu-head .icon { 
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            fill: var(--primary);
        }
        .menu-head .arrow {
            margin-left: auto;
            font-size: 0.7rem;
            transition: transform var(--transition);
            color: var(--gold-dark);
        }
        .menu-head.open .arrow { transform: rotate(90deg); }

        .sub-menu {
            list-style: none;
            padding: 0;
            margin: 0 0 6px 0;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s ease, opacity 0.25s ease;
            opacity: 0;
        }
        .sub-menu.open { max-height: 1200px; opacity: 1; }
        .sub-menu li { margin: 0; }
        .sub-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px 8px 38px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 450;
            color: #2d3f54;
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .sub-link:hover { background: rgba(43,79,140,0.07); color: var(--primary); }
        .sub-link.active {
            background: var(--primary);
            color: #fff;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(43,79,140,0.25);
        }
        .sub-link .sub-icon { 
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            fill: #2d3f54;
            opacity: 0.8; 
        }
        .sub-link:hover .sub-icon { fill: var(--primary); }
        .sub-link.active .sub-icon { fill: #fff; opacity: 1; }

        .extra-menu {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 2px solid rgba(43,79,140,0.08);
        }
        .extra-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--primary);
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .extra-link:hover { background: rgba(43,79,140,0.06); }
        .extra-link.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(43,79,140,0.25);
        }
        .extra-link .icon { 
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            fill: var(--primary);
        }
        .extra-link.active .icon { fill: #fff; }

        .top-menu {
            margin-bottom: 6px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(43,79,140,0.08);
        }
        .top-menu .extra-link {
            font-weight: 600;
            color: var(--gold-dark);
        }
        .top-menu .extra-link:hover { background: rgba(201,168,76,0.08); }
        .top-menu .extra-link.active {
            background: var(--gold);
            color: #1e2b3a;
        }
        .top-menu .extra-link.active .icon { fill: #1e2b3a; }

        .main-content {

            padding: 32px 40px 60px;

            background: var(--bg-body);

        .content-panel { display: none; animation: fadeUp 0.35s ease; }
        .content-panel.active { display: block; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 700;

            margin-bottom: 8px;

            padding-bottom: 10px;
            display: inline-block;
        }

        .hadith-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin: 18px 0 22px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--gold);

        .hadith-box .arabic {
            font-size: 1.15rem;
            line-height: 1.9;
            color: #1e2b3a;
            direction: rtl;
            font-family: 'Times New Roman', 'Traditional Arabic', serif;
            margin-bottom: 12px;
            padding: 6px 0;
            word-wrap: break-word;
        }
        .hadith-box .translation {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #2d3f54;
            border-top: 1px dashed rgba(43,79,140,0.12);
            padding-top: 12px;
        }
        .hadith-box .source {
            display: block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--gold-dark);
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .sub-section { margin-top: 28px; }
        .sub-section h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .sub-section p { line-height: 1.7; color: #2d3f54; margin-bottom: 10px; }

        .bibliography {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 2px solid rgba(43,79,140,0.10);
        }
        .bibliography h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 14px;
        }
        .bibliography ul { list-style: none; padding: 0; }
        .bibliography ul li {
            padding: 6px 0 6px 20px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #2d3f54;
            border-bottom: 1px solid rgba(43,79,140,0.05);
            text-indent: -20px;
            padding-left: 30px;
        }
        .bibliography ul li::before {
            content: "•";
            color: var(--gold);
            font-weight: 700;
            margin-right: 8px;
        }
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .overlay.active { display: block; }

        @media (max-width: 991px) {
            .app-header .hamburger { display: flex; }
            .sidebar {
                position: fixed;
                top: var(--header-height);
                right: 0;
                height: calc(100vh - var(--header-height));
                transform: translateX(100%);
                box-shadow: -8px 0 30px rgba(0,0,0,0.10);
                border-left: none;
                width: 290px;
                padding: 12px 8px 30px;
            }
            .sidebar.open { transform: translateX(0); }
            .main-content { padding: 20px 18px 40px; }
            .panel-title { font-size: 1.5rem; }
            .app-header .brand .title-group h1 { font-size: 1rem; }
            .app-header .brand img { height: 36px; }
            .hadith-box { padding: 16px 18px; }
            .hadith-box .arabic { font-size: 1rem; }
        }
        @media (max-width: 480px) {
            :root { --header-height: 64px; }
            .app-header { padding: 0 14px; }
            .app-header .brand .title-group h1 { font-size: 0.85rem; }
            .app-header .brand .title-group .author { font-size: 0.7rem; }
            .sidebar { width: 265px; }
            .main-content { padding: 14px 12px 30px; }
            .panel-title { font-size: 1.25rem; }
            .sub-link { padding: 7px 10px 7px 28px; font-size: 0.8rem; }
            .menu-head { padding: 10px 12px; font-size: 0.85rem; }
        }
    </style>
</head>

        (function() {

            const svgIcons = {

                users: '<svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V17h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V17h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>',

                scale: '<svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l4-2.18L12 3zm6.82 9L12 15.72 5.18 12 12 8.28l6.82 3.72zM5 16.5v-3.55L12 17l7-4.05v3.55L12 20.28 5 16.5z"/></svg>',
                check: '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>',
                alert: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>',
                book: '<svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>',
                books: '<svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>',

            // ===== MENU DATA =====
            const menuData = [{
                id: 'bab1',
                label: '1. Definition and Urgency of Friendship Circles',
                icon: svgIcons.target,
                children: [{
                    id: '1a',
                    label: 'a. Definition',
                    icon: svgIcons.users,
                    content: `
                        <h2 class="panel-title">1. Definition and Urgency of Friendship Circles</h2>
                        <h3 style="font-family:'Playfair Display',serif; color:var(--primary); margin:16px 0 8px; font-size:1.3rem;">a. Definition</h3>
                        <p style="line-height:1.7; color:#2d3f54; margin-bottom:12px;">Friendship (ṣuḥbah or ṣadāqah) in Islam is a sacred bond built on mutual love, trust, and sincerity for the sake of Allah. It is not merely a social relationship, but a spiritual and moral commitment that shapes one's character and faith.</p>
                        <div class="hadith-box">
                            <div class="arabic">حَدَّث َنَا أَبُو بَكْرِ بْنُ أَِبِ شَي ْبَةَ. حَدَّث َنَا أَبُو مُعَاوِيَةَ وَوَكِيعٌ عَنِ اَلَعْمَشِ ، عَنْ أِب صاحل، عن أِب هر يرة؛ قال: قال رسول هللا صلى هللا عليه وسلم " َل َتَدْخُلُون َاْلَْنَّة َّحََّت ت ُؤْمِنُوا. وََلَ ت ُؤْمِنُوا حََّتَّ حتََابُّوا. أَوََلَ أَدُلُّكُمْ عَلَى شَيْءٍ إِذَا ف َعَلْتُمُوهُ حتاببتم؟ أفشوا السالم بي نكم</div>
                            <div class="translation">From Abu Hurairah he said, "The Messenger of Allah (peace and blessings of Allaah be upon him) said: "For the sake of the One whose soul is in His hands, you will not enter Paradise until you believe, and you will not believe until you love one another. Will you show me something that if you practice it, you will love each other? Spread greetings among you."</div>
                            <span class="source">— Shahih Muslim 73</span>
                        </div>
                        <div class="hadith-box">
                            <div class="arabic">عن عبد هللا ابن عمرو بن العاصي عن رسول هللا- صلي هللا عليه وسلم- " :أنه قال ُخري اَلصحاب عند هللا خريهم لصاحبه، وخري اْلريان عند هللا خريُهم ْلاره</div>
                            <div class="translation">From Abdillah bin Amr from the Prophet PBUH said: The best friend in the sight of Allah is the best among them towards his friend. And the best neighbor in the sight of Allah is the best among them to his neighbor.</div>
                            <span class="source">— Sunan At-Tirmidzi 333, Sunan Ad-Darimi 1583</span>
                        </div>
                    `
                }, {
                    id: '1b',
                    label: 'b. Urgency',
                    icon: svgIcons.alert,
                    content: `
                        <h2 class="panel-title">1. Definition and Urgency of Friendship Circles</h2>
                        <h3 style="font-family:'Playfair Display',serif; color:var(--primary); margin:16px 0 8px; font-size:1.3rem;">b. Urgency</h3>
                        <p style="line-height:1.7; color:#2d3f54; margin-bottom:12px;">Friendship is not a luxury but a necessity in Islam. It is a means to strengthen faith, gain righteous company, and attain Allah's pleasure. The Prophet ﷺ emphasized the importance of choosing good companions and maintaining brotherhood.</p>
                        <div class="hadith-box">

                        <h2 class="panel-title">3. Principles of the Friendship Circle</h2>
                        <p style="line-height:1.7; color:#2d3f54; margin-bottom:12px;">Islam outlines clear principles for friendship: mutual love, sincerity, patience, honesty, and compassion. Friends should be reflections of one another, helping and protecting each other in times of need.</p>

                            <div class="translation">Muhammad bin 'Abdillah bin Numairin, narrated to us his father, narrated to us Zakariya, from Shu'bi, from Nu'man bin Yashir, said: The Prophet PBUH said: The parable of the brotherhood of Muslims in love and affection between them is like one body. If one body or limb is sick, it causes the whole body to become feverish and unable to sleep.</div>

                        </div>
                        <div class="hadith-box">
                            <div class="arabic">َحَدَّث َنَا َيََْيَ بْنُ بُكَريٍْ، حَدَّث َنَا اللَّيْثُ، عَنْ جَعْفَرِ بْنِ رَبِيعَةَ، عَنِ اَلَْعْرَجِ، قَالَ: قَالَ أَبُو هُرَي ْر ةَ: َيَْث ُرُ عَنِ النَّبِيِ صلى هللا عليه وسلم قال ْإَِّيَّكُم َّوَالظَّنَّ، فَإِنَّ الظَّن ًأَكْذَبُ احلَْدِيثِ ، وََلَ َتََسَّسُوا وََلَ حتََسَّسُوا، وََلَ ت َبَاغَضُوا وَكُونُوا إِخْوَاَن</div>
                            <div class="translation">Narrated to us Yahya ibn Bukair, narrated to us al-Laiṣ from Jaʻfar ibn Rabīʻah from al-Aʻraj, he said Abu Hurairah narrated from the Prophet (peace be upon him), he said: Stay away from prejudice, indeed prejudice is the most lies. Do not seek disgrace on one another, silence one another, and hate one another. Be your brothers.</div>
                            <span class="source">— Shahih Bukhari 19</span>
                        </div>
                    `
                }]
            }];

            // ===== TOP MENU & EXTRA MENU =====
            const topMenuData = [{
                id: 'foreword',
                label: 'Foreword',
                icon: svgIcons.book,
                content: `
                    <h2 class="panel-title">Foreword</h2>
                    <p style="line-height:1.8; font-size:1rem; color:#2d3f54; margin-bottom:16px;">Praise be to Allah SWT, the Lord of the universe, for His overflow of grace and grace so that this book can be completed properly. Prayers and greetings are always poured out to the Prophet Muhammad SAW, along with his family, friends, and followers until the end of time.</p>
                    <p style="line-height:1.8; font-size:1rem; color:#2d3f54; margin-bottom:16px;">This e-book is titled <strong>Friendship Circle in Hadith Perspective</strong>. It is present as a guide for readers to understand how Islam views and regulates friendship relationships in daily life. Friendship is one of the important aspects of human life. Through friendship, humans can share stories, experiences, and knowledge with each other. Positive friendships can provide many benefits, such as improving happiness, mental health, and motivation.</p>
                    <p style="line-height:1.8; font-size:1rem; color:#2d3f54; margin-bottom:16px;">The purpose of writing this book is to provide an overview of the concept of friendship in Islam. Provides guidance for readers to build and maintain positive friendships. Invite readers to stay away from negative friendships. The author's hope is that this book can be useful for readers, especially for young Muslims, in building and maintaining positive friendships in accordance with Islamic teachings. The author hopes to receive criticism and suggestions from this book, because the author believes in the shortcomings and limitations of both the author's time and ability in compiling this E-book. May we all get guidance and forgiveness from Allah SWT.</p>
                `
            }];

            const extraData = [{
                id: 'reference',
                label: 'Reference',
                icon: svgIcons.books,
                content: `
                    <h2 class="panel-title">Reference</h2>
                    <div class="bibliography">
                        <ul>
                            <li>Abū Dāwud, Sulaimān ibn al-Asyʻaṣ ibn Isḥāq ibn Basyīr ibn Syidād ibn ʻAmru al-Azdiy al-Sijistāniy. <em>Sunan Abī Dāwud</em>. Edited by Syuʻaib al-Arna’ūṭ and Muḥammad Kāmil Qurah Balaliy. Vol. 1–7. Dār al-Risālah al-ʻĀlamiyah, 2009. https://shamela.ws/book/117359.</li>
                            <li>Al-Bukhāriy, Abū ʻAbdillāh Muḥammad ibn Ismāʻīl ibn Ibrāhīm ibn al-Mugīrah al-Juʻfiy. <em>Al-Jāmiʻ Al-Musnad Al-Ṣaḥīḥ Al-Mukhtaṣar Min Umūr Rasūl Allāh Ṣallā Allāh ʻalaih Wasallam Wa Sunanih Wa Ayyāmih</em>. Edited by Muḥammad Zuhair ibn Nāṣir al-Nāṣir. Vol. 1–9. Dār Ṭauq al-Najāt, 1422.</li>
                            <li>Al-Bustiy, Abū Ḥātim Muḥammad ibn Ḥibbān ibn Aḥmad al-Tamīmiy. <em>Ṣaḥīḥ Ibn Ḥibbān</em>. Bairūt: Dār ibn Ḥazm, 2012.</li>
                            <li>Al-Ṭabarāniy, Abū al-Qāsim Sulaimān ibn Aḥmad. <em>Al-Muʻjam Al-Ausaṭ</em>. al-Qāhirah: Dār al-Ḥaramain, 1995.</li>
                            <li>Dārimiy, Abū Muḥammad ʻAbdi ibn ʻAbd al-Raḥmān ibn al-Faḍl ibn Bahrām ibn ʻAbd al-Ṣamad. <em>Al-Musnad Al-Jāmiʻ Al-Maʻrūf Bi Sunan Al-Dārimiy</em>. Edited by Ḥusain Salīm Asad Al-Dārāniy. Vol. 1–4. Dār al-Mugnī, 2000.</li>
                            <li>Hākim, Abū ‘Abd Allāh Muḥammad ibn ‘Abd Allāh. <em>Al-Mustadrak ‘alā Al-Ṣaḥīhain</em>. Edited by Muṣṭafā ‘Abd al-Qādir ‘Atā. Vol. 1–4. Dār al-Kutub al-‘Ilmiyyah, 1990.</li>
                            <li>Ibn al-Ḥajjāj, Muslim. <em>Al-Musnad Al-Ṣaḥīḥ Al-Mukhtaṣar Bi Naql Al-‘Adl ‘an Al-‘Adl Ilā Rasūl Allāh Ṣallā Allāh ‘alaih Wasallam</em>. Edited by Muḥammad Fu‘ād ‘Abd al-Bāqī. Vol. 1–5. Dār Iḥyā‘ al-Turās al-‘Arabiy, 1955.</li>
                            <li>Ibn Ḥanbal, Aḥmad. <em>Musnad Al-Imām Aḥmad Ibn Ḥanbal</em>. Edited by Aḥmad Muḥammad Syākir. Vol. 1–20. Dār al-Ḥadīṡ PP - Kairo, 1995.</li>
                            <li>Ibn Mājah, Abū ‘Abdillāh Muḥammad ibn Yazīd. <em>Sunan Ibn Mājah</em>. Edited by Muḥammad Fu‘ād ‘Abd al-Bāqī. Vol. 1–2. Dār Iḥyā‘ al-Kutub al-‘Arabiyyah, n.d. https://shamela.ws/book/1198.</li>
                            <li>Tirmīziy, Abū ‘Īsā Muḥammad ibn ‘Īsā ibn Saurah ibn Mūsā al-Daḥḥak. <em>Sunan Al-Tirmīziy</em>. Edited by Aḥmad Muḥammad Syākir, Muḥammad Fu‘ād ‘Abd al-Baqī, and Ibrāhīm ‘Utwah ‘Aud. Vol. 1–5. Muṣṭafā al-Bābī al-Halabiy PP - Mesir, 1975.</li>
                        </ul>
                    </div>
                `
            }];

            // ===== RENDER =====
            const topMenuContainer = document.getElementById('topMenu');
            const menuContainer = document.getElementById('menuContainer');
            const extraMenuContainer = document.getElementById('extraMenu');
            const panelContainer = document.getElementById('panelContainer');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const hamburger = document.getElementById('hamburgerBtn');

            let activePanelId = null;

            function renderTopMenu() {
                let html = '';
                topMenuData.forEach(item => {
                    html += `<div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 2px solid rgba(43,79,140,0.08);">`;
                    html += `<button class="extra-link" data-panel="${item.id}">
                        <span class="icon">${item.icon}</span> ${item.label}
                    </button>`;
                    html += `</div>`;
                });
                topMenuContainer.innerHTML = html;
            }

            function renderMenuItems(items, depth) {
                let html = '';
                items.forEach(item => {
                    if (item.children) {
                        const isTop = depth === 0;
                        html += `<div class="menu-section">`;
                        html += `<button class="menu-head ${isTop ? 'open' : ''}" data-toggle="${item.id}" aria-expanded="${isTop}">
                            <span class="icon">${item.icon || svgIcons.folder}</span> ${item.label}
                            <span class="arrow">▶</span>
                        </button>`;
                        html += `<ul class="sub-menu ${isTop ? 'open' : ''}">`;
                        html += renderMenuItems(item.children, depth + 1);
                        html += `</ul></div>`;
                    } else {
                        html += `<li><button class="sub-link" data-panel="${item.id}">
                            <span class="sub-icon">${item.icon || svgIcons.target}</span> ${item.label}
                        </button></li>`;
                    }
                });
                return html;
            }

            function renderMenu() {
                let html = '';
                menuData.forEach(item => {
                    html += `<div class="menu-section">`;
                    html += `<button class="menu-head open" data-toggle="${item.id}" aria-expanded="true">
                        <span class="icon">${item.icon || svgIcons.folder}</span> ${item.label}
                        <span class="arrow">▶</span>
                    </button>`;
                    html += `<ul class="sub-menu open">`;
                    html += renderMenuItems(item.children, 1);
                    html += `</ul></div>`;
                });
                menuContainer.innerHTML = html;
            }

            function renderExtraMenu() {
                let html = '';
                extraData.forEach(item => {
                    html += `<button class="extra-link" data-panel="${item.id}">
                        <span class="icon">${item.icon}</span> ${item.label}
                    </button>`;
                });
                extraMenuContainer.innerHTML = html;
            }

            function renderPanels() {
                let html = '';
                topMenuData.forEach(item => {
                    html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                });
                function collectPanels(items) {
                    items.forEach(item => {
                        if (item.children) {
                            collectPanels(item.children);
                        } else {
                            html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                        }
                    });
                }
                collectPanels(menuData);
                extraData.forEach(item => {
                    html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                });
                panelContainer.innerHTML = html;
            }

            function showPanel(panelId, fromSubLink = true) {
                document.querySelectorAll('.content-panel').forEach(el => el.classList.remove('active'));
                const panel = document.getElementById('panel-' + panelId);
                if (panel) panel.classList.add('active');
                document.querySelectorAll('.sub-link, .extra-link').forEach(el => el.classList.remove('active'));
                const link = document.querySelector(`.sub-link[data-panel="${panelId}"], .extra-link[data-panel="${panelId}"]`);
                if (link) link.classList.add('active');
                activePanelId = panelId;
                if (window.innerWidth <= 991 && fromSubLink) closeSidebar();
            }

            function toggleSection(btn) {
                const sub = btn.nextElementSibling;
                if (!sub) return;
                const isOpen = sub.classList.contains('open');
                if (isOpen) {
                    sub.classList.remove('open');
                    btn.classList.remove('open');
                    btn.setAttribute('aria-expanded', 'false');
                } else {
                    sub.classList.add('open');
                    btn.classList.add('open');
                    btn.setAttribute('aria-expanded', 'true');
                }
            }

            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function toggleSidebar() {
                if (sidebar.classList.contains('open')) closeSidebar();
                else openSidebar();
            }

            function init() {
                renderPanels();
                renderTopMenu();
                renderMenu();
                renderExtraMenu();

                topMenuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                    }
                });

                menuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('menu-head')) {
                        e.stopPropagation();
                        toggleSection(target);
                        return;
                    }
                    if (target.classList.contains('sub-link')) {
                        e.preventDefault();
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                        return;
                    }
                });

                extraMenuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                    }
                });

                if (topMenuData.length > 0) {
                    showPanel(topMenuData[0].id, false);
                }

                hamburger.addEventListener('click', toggleSidebar);
                overlay.addEventListener('click', closeSidebar);
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 991) closeSidebar();
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
                });
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
</body>
</html>
