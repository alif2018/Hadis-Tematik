<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanitasi dalam Perspektif Hadis</title>
    <base target="_self" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f6f0;
            color: #1e2b3a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        :root {
            --primary: #2b4f8c;
            --gold: #c9a84c;
            --gold-light: #e0c66e;
            --gold-dark: #a8892f;
            --bg-body: #f8f6f0;
            --bg-card: #ffffff;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 300px;
            --header-height: 72px;
        }
        .app-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: var(--header-height);
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 12px rgba(43, 79, 140, 0.25);
        }
        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-header .brand img {
            height: 44px;
            width: auto;
            border-radius: 6px;
            background: #fff;
            padding: 4px;
            object-fit: contain;
        }
        .app-header .brand .title-group {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .app-header .brand .title-group h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .app-header .brand .title-group .author {
            font-size: 0.8rem;
            color: var(--gold-light);
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .app-header .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 4px;
            border-radius: 6px;
        }
        .app-header .hamburger:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .app-header .hamburger span {
            display: block;
            width: 26px;
            height: 2.5px;
            background: #fff;
            border-radius: 4px;
        }
        .app-layout {
            display: flex;
            flex: 1;
            position: relative;
        }
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-left: 1px solid rgba(43, 79, 140, 0.10);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.04);
            height: calc(100vh - var(--header-height));
            position: sticky;
            top: var(--header-height);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 10px 30px;
            flex-shrink: 0;
            transition: transform var(--transition);
            z-index: 900;
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: #f0ede7;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 8px;
        }

        .menu-section {
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(43, 79, 140, 0.06);
        }
        .menu-section:last-of-type {
            border-bottom: none;
        }
        .menu-head {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 14px;
            background: transparent;
            border: none;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
        }
        .menu-head:hover {
            background: rgba(43, 79, 140, 0.06);
        }
        .menu-head .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            fill: var(--primary);
        }
        .menu-head .arrow {
            margin-left: auto;
            font-size: 0.7rem;
            transition: transform var(--transition);
            color: var(--gold-dark);
        }
        .menu-head.open .arrow {
            transform: rotate(90deg);
        }

        .sub-menu {
            list-style: none;
            padding: 0;
            margin: 0 0 6px 0;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s ease, opacity 0.25s ease;
            opacity: 0;
        }
        .sub-menu.open {
            max-height: 1200px;
            opacity: 1;
        }
        .sub-menu li {
            margin: 0;
        }
        .sub-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px 8px 38px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 450;
            color: #2d3f54;
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .sub-link:hover {
            background: rgba(43, 79, 140, 0.07);
            color: var(--primary);
        }
        .sub-link.active {
            background: var(--primary);
            color: #fff;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(43, 79, 140, 0.25);
        }
        .sub-link .sub-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            fill: #2d3f54;
            opacity: 0.8;
        }
        .sub-link:hover .sub-icon {
            fill: var(--primary);
        }
        .sub-link.active .sub-icon {
            fill: #fff;
            opacity: 1;
        }

        .extra-menu {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 2px solid rgba(43, 79, 140, 0.08);
        }
        .extra-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--primary);
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .extra-link:hover {
            background: rgba(43, 79, 140, 0.06);
        }
        .extra-link.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(43, 79, 140, 0.25);
        }
        .extra-link .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            fill: var(--primary);
        }
        .extra-link.active .icon {
            fill: #fff;
        }

        .top-menu {
            margin-bottom: 6px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(43, 79, 140, 0.08);
        }
        .top-menu .extra-link {
            font-weight: 600;
            color: var(--gold-dark);
        }
        .top-menu .extra-link:hover {
            background: rgba(201, 168, 76, 0.08);
        }
        .top-menu .extra-link.active {
            background: var(--gold);
            color: #1e2b3a;
        }
        .top-menu .extra-link.active .icon {
            fill: #1e2b3a;
        }

        .main-content {
            flex: 1;
            padding: 32px 40px 60px;
            min-width: 0;
            background: var(--bg-body);
        }
        .content-panel {
            display: none;
            animation: fadeUp 0.35s ease;
        }
        .content-panel.active {
            display: block;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            border-bottom: 3px solid var(--gold);
            padding-bottom: 10px;
            display: inline-block;
        }
        .panel-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary);
            margin: 22px 0 10px;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--gold-light);
        }
        .hadith-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin: 18px 0 22px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--gold);
        }
        .hadith-box .arabic {
            font-size: 1.15rem;
            line-height: 1.9;
            color: #1e2b3a;
            direction: rtl;
            font-family: 'Times New Roman', 'Traditional Arabic', serif;
            margin-bottom: 12px;
            padding: 6px 0;
            word-wrap: break-word;
        }
        .hadith-box .translation {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #2d3f54;
            border-top: 1px dashed rgba(43, 79, 140, 0.12);
            padding-top: 12px;
        }
        .hadith-box .source {
            display: block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--gold-dark);
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .bibliography {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 2px solid rgba(43, 79, 140, 0.10);
        }
        .bibliography ul {
            list-style: none;
            padding: 0;
        }
        .bibliography ul li {
            padding: 6px 0 6px 20px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #2d3f54;
            border-bottom: 1px solid rgba(43, 79, 140, 0.05);
            text-indent: -20px;
            padding-left: 30px;
        }
        .bibliography ul li::before {
            content: "•";
            color: var(--gold);
            font-weight: 700;
            margin-right: 8px;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .overlay.active {
            display: block;
        }

        @media (max-width: 991px) {
            .app-header .hamburger {
                display: flex;
            }
            .sidebar {
                position: fixed;
                top: var(--header-height);
                right: 0;
                height: calc(100vh - var(--header-height));
                transform: translateX(100%);
                box-shadow: -8px 0 30px rgba(0, 0, 0, 0.10);
                border-left: none;
                width: 290px;
                padding: 12px 8px 30px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                padding: 20px 18px 40px;
            }
            .panel-title {
                font-size: 1.5rem;
            }
            .panel-subtitle {
                font-size: 1.1rem;
            }
            .app-header .brand .title-group h1 {
                font-size: 1rem;
            }
            .app-header .brand img {
                height: 36px;
            }
            .hadith-box {
                padding: 16px 18px;
            }
            .hadith-box .arabic {
                font-size: 1rem;
            }
        }
        @media (max-width: 480px) {
            :root {
                --header-height: 64px;
            }
            .app-header {
                padding: 0 14px;
            }
            .app-header .brand .title-group h1 {
                font-size: 0.85rem;
            }
            .app-header .brand .title-group .author {
                font-size: 0.7rem;
            }
            .sidebar {
                width: 265px;
            }
            .main-content {
                padding: 14px 12px 30px;
            }
            .panel-title {
                font-size: 1.25rem;
            }
            .sub-link {
                padding: 7px 10px 7px 28px;
                font-size: 0.8rem;
            }
            .menu-head {
                padding: 10px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <img src="logo-pshd.jpg" alt="Logo" />
            <div class="title-group">
                <h1>Sanitasi dalam Perspektif Hadis</h1>
                <span class="author">Penyusun: Ambarwati & Muhammad Alif</span>
            </div>
        </div>
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
    </header>
    <div class="app-layout">
        <div class="overlay" id="overlay"></div>
        <nav class="sidebar" id="sidebar" role="navigation" aria-label="Daftar isi">
            <div class="top-menu" id="topMenu"></div>
            <div id="menuContainer"></div>
            <div class="extra-menu" id="extraMenu"></div>
        </nav>
        <main class="main-content" id="mainContent">
            <div id="panelContainer"></div>
        </main>
    </div>
    <script>
        (function() {
            'use strict';

            // ===== SVG ICONS =====
            const svgIcons = {
                book: '<svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>',
                books: '<svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>',
                folder: '<svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>',
                water: '<svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>',
                drop: '<svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>',
                sea: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8 0-1.03.2-2.01.56-2.91L10 14.44V16c0 1.1.9 2 2 2v2zm5.88-5.88l-1.88-.75V11c0-1.1-.9-2-2-2h-2V7h1c1.1 0 2-.9 2-2V4.26c3.22 1.15 5.6 3.99 6.13 7.5.02.12.04.24.04.36 0 1.25-.39 2.41-1.06 3.38z"/></svg>',
                well: '<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H4V4h16v16z"/><circle cx="12" cy="12" r="4"/></svg>',
                waste: '<svg viewBox="0 0 24 24"><path d="M18 11h-2V6c0-1.1-.9-2-2-2v0c-1.1 0-2 .9-2 2v5H9V4c0-1.1-.9-2-2-2v0C5.9 2 5 2.9 5 4v12.25c0 .77.31 1.48.86 2.02l4.97 4.98c.55.55 1.28.86 2.04.86h5.08c1.66 0 3.01-1.34 3.01-3v-6c0-1.66-1.34-3-3-3z"/></svg>',
                hand: '<svg viewBox="0 0 24 24"><path d="M18 11h-2V6c0-1.1-.9-2-2-2v0c-1.1 0-2 .9-2 2v5H9V4c0-1.1-.9-2-2-2v0C5.9 2 5 2.9 5 4v12.25c0 .77.31 1.48.86 2.02l4.97 4.98c.55.55 1.28.86 2.04.86h5.08c1.66 0 3.01-1.34 3.01-3v-6c0-1.66-1.34-3-3-3z"/></svg>',
                toilet: '<svg viewBox="0 0 24 24"><path d="M14 14v-2h-4v2h4zm-6 0v-2H6v2h2zm8 0v-2h-2v2h2zm0 4v-2h-2v2h2zm-8 0v-2H6v2h2zm10-12H6v14h12V6z"/></svg>',
                bug: '<svg viewBox="0 0 24 24"><path d="M12 3c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm7 4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM5 7c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm7 5c-2.76 0-5 2.24-5 5 0 1.66 1.34 3 3 3h4c1.66 0 3-1.34 3-3 0-2.76-2.24-5-5-5z"/></svg>',
                dog: '<svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM4 18c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm15-9c-.55 0-1 .45-1 1v1h-2V7c0-.55-.45-1-1-1s-1 .45-1 1v3H9V7c0-.55-.45-1-1-1s-1 .45-1 1v3H5V8c0-.55-.45-1-1-1s-1 .45-1 1v4c0 2.21 1.79 4 4 4h12c2.21 0 4-1.79 4-4v-1c0-.55-.45-1-1-1z"/></svg>',
                fly: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2L8 8l-4-2 4 6-6 4 6 4-4 6 4-2 4 4 4-4 4 2-4-6 6-4-6-4 4-6-4 2-4-4z"/></svg>',
                gecko: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8 0-1.03.2-2.01.56-2.91L10 14.44V16c0 1.1.9 2 2 2v2zm5.88-5.88l-1.88-.75V11c0-1.1-.9-2-2-2h-2V7h1c1.1 0 2-.9 2-2V4.26c3.22 1.15 5.6 3.99 6.13 7.5.02.12.04.24.04.36 0 1.25-.39 2.41-1.06 3.38z"/></svg>',
                target: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>'
            };

            // ============================================================
            //  DATA MENU — sesuai struktur Heading 1 → Heading 2
            // ============================================================

            const menuData = [{
                id: 'bab1',
                label: 'I. Manajemen Sanitasi',
                icon: svgIcons.water,
                children: [{
                    id: '1A',
                    label: 'A. Sumber Air Bersih',
                    icon: svgIcons.water,
                    children: [{
                        id: '1A1',
                        label: '1. Air Laut',
                        icon: svgIcons.sea,
                        content: `
                            <h2 class="panel-title">1. Air Laut</h2>
                            <div class="hadith-box">
                                <div class="arabic">حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ حَدَّثَنَا مَالِكُ بْنُ أَنَسٍ حَدَّثَنِي صَفْوَانُ بْنُ سُلَيْمٍ عَنْ سَعِيدِ بْنِ سَلَمَةَ هُوَ مِنْ الْأَزْرَقِ أَنَّ الْمُغِيرَةَ بْنَ أَبِي بُرْدَةَ وَهُوَ مِنْ بَنِي عَبْدِ الدَّارِ حَدَّثَنَةُ أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ يَقُولُ جَاءَ رَجُلٌ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ يَا رَسُولَ اللَّهِ إِنَّا نَرْكَبُ الْبَحْرَ وَنَحْمِلُ مَعَنَا الْقَلِيلَ مِنْ الْمَاءِ فَإِنْ تَوَضَّأْنَا بِهِ عَطِشْنَا أَفَنَتَوَضَّأَ مِنْ مَاءِ الْبَحْرِ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ هُوَ الطَّهُورُ مَاؤُهُ الْجِلُّ مَيْتَتُهُ</div>
                                <div class="translation">Telah menceritakan kepada kami Hisyam bin Ammar berkata, telah menceritakan kepada kami Malik bin Anas berkata, telah menceritakan kepadaku Shafwan bin Sulaim dari Sa’id bin Salamah dari keluarga Ibnu Al Azraq bahwa Al Mughirah bin Abu Burdah dari bani Abdu Ad Dar mendengar Abu Hurairah berkata, "Seorang laki-laki datang kepada Rasulullah ﷺ seraya bertanya, 'Wahai Rasulullah, kami berlayar di lautan dan kami hanya membawa sedikit air, jika kami berwudu dengannya maka kami akan kehausan. Bolehkah kami berwudu dengan air laut?' Rasulullah ﷺ menjawab, 'Laut itu suci airnya dan halal bangkainya'."</div>
                                <span class="source">— Ibnu Majah no. 380</span>
                            </div>
                        `
                    }, {
                        id: '1A2',
                        label: '2. Sumur/Mata Air',
                        icon: svgIcons.well,
                        content: `

                    <h2 class="panel-title">Kata Pengantar</h2>
                    <div style="background:#fff; border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); line-height:1.9; font-size:0.98rem; color:#2d3f54;">
                        <p>Syukur Alhamdulillah kami panjatkan kehadirat Allah SWT, berkat rahmat dan karunianya pada akhirnya kami dapat menyelesaikan tulisan berupa buku yang berjudul <strong>"Sanitasi dalam Perspektif Hadis"</strong> ini dapat diselesaikan. Tanpa izin Allah e-book ini tidak akan pernah diselesaikan.</p>
                        <p style="margin-top:12px;">Semoga buku ini dapat bermanfaat bagi banyak orang, dan setiap saran dan umpan balik untuk perbaikan sangat kami harapkan. Akhirnya kepada semua pihak yang telah memberikan bantuan baik moril maupun materil hingga selesainya penulisan buku yang belum sempurna ini, kami berdoa dan memohon kepada Allah SWT, semoga semua pihak yang materinya kami kutip agar selalu mendapatkan kesehatan serta keridhoan Allah, rezeki yang melimpah, dan diampuni seluruh dosa-dosanya, Aamiin.</p>
                        <p style="margin-top:24px; text-align:right; font-style:italic; color:#5e6f82;">Serang, 2025<br/><strong>Ambarwati</strong></p>
                    </div>
                `
            }];

            // ===== EXTRA MENU (Daftar Pustaka) =====
            const extraData = [{
                id: 'daftar-pustaka',
                label: 'Daftar Pustaka',
                icon: svgIcons.books,
                content: `
                    <h2 class="panel-title">Daftar Pustaka</h2>
                    <div class="bibliography">
                        <ul>
                            <li>Abū ‘Abdillāh Muḥammad ibn Ismā‘īl ibn Ibrāhīm ibn al-Mugīrah al-Ju‘fiy Al-Bukhāriy. <em>Al-Jāmi‘ al-Musnad al-Ṣaḥīḥ al-Mukhtaṣar min Umūr Rasūlillah Ṣallā Allāh ‘alaih wasallam wa Sunanih wa Ayyāmih</em>. Edited by Muḥammad Zuhair ibn Nāṣir Al-Nāṣir. Beirut: Dār Tauq al-Najāt, 1422.</li>
                            <li>Muslim ibn al-Ḥajjāj Abū al-Ḥasan al-Qusyairiy Al-Naisābūri. <em>Al-Musnad al-Ṣaḥīḥ al-Mukhtaṣar binaql al-‘Adl ‘an al-‘Adl ilā Rasūlillah Ṣallā Allāh ‘alaih wasallam</em>. Edited by Muḥammad Fu’ād ‘Abd Al-Bāqī. Beirut: Dār Iḥyā’ al-Turāṡ al-‘Arabiy, 1424.</li>
                            <li>Abū Dāwud Sulaimān ibn al-Asy‘aṡ ibn Isḥāq ibn Basyīr ibn Syidād ibn ‘Amru al-Azdiy Al-Sijistāniy. <em>Sunan Abī Dāwud</em>. Edited by Syu‘aib Al-Arna’ūt. Beirut: Dār al-Risālah al-‘Ālamiyah, 2009.</li>
                            <li>Abū ‘Abd al-Raḥmān ibn Syu‘aib ibn ‘Aliy al-Khurrāsāniy Al-Nassā’iy. <em>Al-Mujtabā min al-Sunan (al-Sunan al-Ṣugrā li al-Nassā’iy)</em>. Edited by ‘Abd al-Fattāḥ Abū Gudah. Ḥalab: Maktab al-Matbū‘āt al-Islāmīyyah, 1986.</li>
                            <li>Abū ‘Īsā Muḥammad ibn ‘Īsā ibn Saurah ibn Mūsā al-Daḥḥak Al-Tirmīziy. <em>Al-Jāmi‘ al-Kabīr wahuwa Sunan al-Tirmīziy</em>. Edited by Basysyār ‘Awad Ma‘rūf. Beirut: Dār al-Garb al-Islāmīy, 1998.</li>
                            <li>Ibn Mājah Abū ‘Abdillāh Muḥammad ibn Yazīd Al-Qazwīnīy. <em>Sunan Ibn Mājah</em>. Edited by Syu‘aib al-Arna’ūṭ et. Al. Ḥalab: Dār al-Risālah al-‘Ālamiyyah, 2009.</li>
                        </ul>
                    </div>
                `
            }];

            // ============================================================
            //  RENDER ENGINE
            // ============================================================

            const topMenuContainer = document.getElementById('topMenu');
            const menuContainer = document.getElementById('menuContainer');
            const extraMenuContainer = document.getElementById('extraMenu');
            const panelContainer = document.getElementById('panelContainer');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const hamburger = document.getElementById('hamburgerBtn');

            let activePanelId = null;

            function renderTopMenu() {
                let html = '';
                topMenuData.forEach(item => {
                    html += `<div style="margin-bottom:12px;padding-bottom:12px;border-bottom:2px solid rgba(43,79,140,0.08);">`;
                    html += `<button class="extra-link" data-panel="${item.id}"><span class="icon">${item.icon}</span> ${item.label}</button>`;
                    html += `</div>`;
                });
                topMenuContainer.innerHTML = html;
            }

            function renderMenuItems(items, depth) {
                let html = '';
                items.forEach(item => {
                    if (item.children) {
                        const isTop = depth === 0;
                        html += `<div class="menu-section">`;
                        html += `<button class="menu-head ${isTop ? 'open' : ''}" data-toggle="${item.id}" aria-expanded="${isTop}">
                            <span class="icon">${item.icon || svgIcons.folder}</span> ${item.label}
                            <span class="arrow">▶</span>
                        </button>`;
                        html += `<ul class="sub-menu ${isTop ? 'open' : ''}">`;
                        html += renderMenuItems(item.children, depth + 1);
                        html += `</ul></div>`;
                    } else {
                        html += `<li><button class="sub-link" data-panel="${item.id}">
                            <span class="sub-icon">${item.icon || svgIcons.target}</span> ${item.label}
                        </button></li>`;
                    }
                });
                return html;
            }

            function renderMenu() {
                let html = '';
                menuData.forEach(item => {
                    html += `<div class="menu-section">`;
                    html += `<button class="menu-head open" data-toggle="${item.id}" aria-expanded="true">
                        <span class="icon">${item.icon || svgIcons.folder}</span> ${item.label}
                        <span class="arrow">▶</span>
                    </button>`;
                    html += `<ul class="sub-menu open">`;
                    html += renderMenuItems(item.children, 1);
                    html += `</ul></div>`;
                });
                menuContainer.innerHTML = html;
            }

            function renderExtraMenu() {
                let html = '';
                extraData.forEach(item => {
                    html += `<button class="extra-link" data-panel="${item.id}"><span class="icon">${item.icon}</span> ${item.label}</button>`;
                });
                extraMenuContainer.innerHTML = html;
            }

            function renderPanels() {
                let html = '';
                topMenuData.forEach(item => {
                    html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                });

                function collectPanels(items) {
                    items.forEach(item => {
                        if (item.children) {
                            collectPanels(item.children);
                        } else {
                            html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                        }
                    });
                }
                collectPanels(menuData);
                extraData.forEach(item => {
                    html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                });
                panelContainer.innerHTML = html;
            }

            function showPanel(panelId, fromSubLink = true) {
                document.querySelectorAll('.content-panel').forEach(el => el.classList.remove('active'));
                const panel = document.getElementById('panel-' + panelId);
                if (panel) panel.classList.add('active');

                document.querySelectorAll('.sub-link, .extra-link').forEach(el => el.classList.remove('active'));
                const link = document.querySelector(`.sub-link[data-panel="${panelId}"], .extra-link[data-panel="${panelId}"]`);
                if (link) link.classList.add('active');

                activePanelId = panelId;
                if (window.innerWidth <= 991 && fromSubLink) closeSidebar();
            }

            function toggleSection(btn) {
                const sub = btn.nextElementSibling;
                if (!sub) return;
                const isOpen = sub.classList.contains('open');
                if (isOpen) {
                    sub.classList.remove('open');
                    btn.classList.remove('open');
                    btn.setAttribute('aria-expanded', 'false');
                } else {
                    sub.classList.add('open');
                    btn.classList.add('open');
                    btn.setAttribute('aria-expanded', 'true');
                }
            }

            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function toggleSidebar() {
                if (sidebar.classList.contains('open')) closeSidebar();
                else openSidebar();
            }

            function init() {
                renderPanels();
                renderTopMenu();
                renderMenu();
                renderExtraMenu();

                topMenuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                    }
                });

                menuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('menu-head')) {
                        e.stopPropagation();
                        toggleSection(target);
                        return;
                    }
                    if (target.classList.contains('sub-link')) {
                        e.preventDefault();
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                        return;
                    }
                });

                extraMenuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                    }
                });

                if (topMenuData.length > 0) {
                    showPanel(topMenuData[0].id, false);
                }

                hamburger.addEventListener('click', toggleSidebar);
                overlay.addEventListener('click', closeSidebar);

                window.addEventListener('resize', function() {
                    if (window.innerWidth > 991) closeSidebar();
                });

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
                });
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
</body>
</html>
