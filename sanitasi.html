<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanitasi dalam Perspektif Hadis</title>
    <base target="_self" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    <style>
        /* ----- RESET & GLOBAL ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f6f0;
            color: #1e2b3a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ----- VARIABLES ----- */
        :root {
            --primary: #2b4f8c;
            --primary-light: #3a6bb0;
            --primary-dark: #1d3a66;
            --gold: #c9a84c;
            --gold-light: #e0c66e;
            --gold-dark: #a8892f;
            --bg-body: #f8f6f0;
            --bg-card: #ffffff;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 320px;
            --header-height: 72px;
        }

        /* ----- HEADER ----- */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: var(--header-height);
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 12px rgba(43, 79, 140, 0.25);
        }
        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-header .brand img {
            height: 44px;
            width: auto;
            border-radius: 6px;
            background: #fff;
            padding: 4px;
            object-fit: contain;
        }
        .app-header .brand .title-group {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .app-header .brand .title-group h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .app-header .brand .title-group .author {
            font-size: 0.8rem;
            color: var(--gold-light);
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .app-header .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 4px;
            border-radius: 6px;
            transition: background var(--transition);
        }
        .app-header .hamburger:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .app-header .hamburger span {
            display: block;
            width: 26px;
            height: 2.5px;
            background: #fff;
            border-radius: 4px;
            transition: var(--transition);
        }

        /* ----- LAYOUT ----- */
        .app-layout {
            display: flex;
            flex: 1;
            position: relative;
        }

        /* ----- SIDEBAR (kanan) ----- */
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-left: 1px solid rgba(43, 79, 140, 0.10);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.04);
            height: calc(100vh - var(--header-height));
            position: sticky;
            top: var(--header-height);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 10px 30px;
            flex-shrink: 0;
            transition: transform var(--transition);
            z-index: 900;
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: #f0ede7;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 8px;
        }

        /* Level 1: Kategori */
        .menu-category {
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(43, 79, 140, 0.08);
        }
        .menu-category:last-of-type {
            border-bottom: none;
        }
        .menu-category .cat-head {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 14px;
            background: transparent;
            border: none;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary-dark);
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
        }
        .menu-category .cat-head:hover {
            background: rgba(43, 79, 140, 0.06);
        }
        .menu-category .cat-head .icon {
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .menu-category .cat-head .arrow {
            margin-left: auto;
            font-size: 0.65rem;
            transition: transform var(--transition);
            color: var(--gold-dark);
        }
        .menu-category .cat-head.open .arrow {
            transform: rotate(90deg);
        }

        .subcat-container {
            list-style: none;
            padding: 0;
            margin: 0 0 6px 0;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 0;
        }
        .subcat-container.open {
            max-height: 1200px;
            opacity: 1;
        }

        /* Level 2: Sub-Kategori */
        .subcat-item {
            margin: 4px 0 4px 12px;
            border-left: 2px solid rgba(43, 79, 140, 0.12);
            padding-left: 6px;
        }
        .subcat-head {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 8px 10px;
            background: transparent;
            border: none;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 550;
            color: #2d3f54;
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
        }
        .subcat-head:hover {
            background: rgba(43, 79, 140, 0.06);
            color: var(--primary);
        }
        .subcat-head .subcat-arrow {
            margin-left: auto;
            font-size: 0.55rem;
            transition: transform var(--transition);
            color: var(--gold-dark);
        }
        .subcat-head.open .subcat-arrow {
            transform: rotate(90deg);
        }

        .items-container {
            list-style: none;
            padding: 0;
            margin: 2px 0 6px 0;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s ease, opacity 0.25s ease;
            opacity: 0;
        }
        .items-container.open {
            max-height: 600px;
            opacity: 1;
        }

        /* Level 3: Judul / Item Hadis */
        .items-container li {
            margin: 2px 0;
        }
        .items-container li .item-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px 7px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 450;
            color: #4a5a6a;
            text-decoration: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .items-container li .item-link:hover {
            background: rgba(43, 79, 140, 0.07);
            color: var(--primary);
        }
        .items-container li .item-link.active {
            background: var(--primary);
            color: #fff;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(43, 79, 140, 0.25);
        }
        .items-container li .item-link .item-icon {
            font-size: 0.75rem;
            opacity: 0.7;
        }
        .items-container li .item-link.active .item-icon {
            opacity: 1;
        }

        /* ----- MAIN CONTENT ----- */
        .main-content {
            flex: 1;
            padding: 32px 40px 60px;
            min-width: 0;
            background: var(--bg-body);
        }

        .content-panel {
            display: none;
            animation: fadeUp 0.35s ease;
        }
        .content-panel.active {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content-panel .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 8px;
            border-bottom: 3px solid var(--gold);
            padding-bottom: 10px;
            display: inline-block;
        }
        .content-panel .panel-sub {
            font-size: 0.95rem;
            color: #5e6f82;
            margin-bottom: 24px;
        }
        .content-panel .hadith-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin: 18px 0 22px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--gold);
        }
        .content-panel .hadith-box .arabic {
            font-size: 1.15rem;
            line-height: 1.9;
            color: #1e2b3a;
            direction: rtl;
            font-family: 'Times New Roman', 'Traditional Arabic', serif;
            margin-bottom: 12px;
            padding: 6px 0;
            word-wrap: break-word;
        }
        .content-panel .hadith-box .translation {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #2d3f54;
            border-top: 1px dashed rgba(43, 79, 140, 0.12);
            padding-top: 12px;
        }
        .content-panel .hadith-box .source {
            display: block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--gold-dark);
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .content-panel .sub-section {
            margin-top: 28px;
        }
        .content-panel .sub-section h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .content-panel .sub-section p {
            line-height: 1.7;
            color: #2d3f54;
            margin-bottom: 10px;
        }

        /* daftar pustaka */
        .bibliography {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--gold);
        }
        .bibliography h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--primary-dark);
            margin-bottom: 14px;
        }
        .bibliography ul {
            list-style: none;
            padding: 0;
        }
        .bibliography ul li {
            padding: 8px 0 8px 20px;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #2d3f54;
            border-bottom: 1px solid rgba(43, 79, 140, 0.05);
            text-indent: -20px;
            padding-left: 30px;
        }
        .bibliography ul li::before {
            content: "•";
            color: var(--gold);
            font-weight: 700;
            margin-right: 8px;
        }

        /* ----- OVERLAY (mobile) ----- */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 850;
            backdrop-filter: blur(2px);
            transition: opacity var(--transition);
        }
        .overlay.active {
            display: block;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 991px) {
            .app-header .hamburger {
                display: flex;
            }
            .sidebar {
                position: fixed;
                top: var(--header-height);
                right: 0;
                height: calc(100vh - var(--header-height));
                transform: translateX(100%);
                box-shadow: -8px 0 30px rgba(0, 0, 0, 0.10);
                border-left: none;
                width: 300px;
                padding: 12px 8px 30px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                padding: 20px 18px 40px;
            }
            .content-panel .panel-title {
                font-size: 1.5rem;
            }
            .app-header .brand .title-group h1 {
                font-size: 1rem;
            }
            .app-header .brand img {
                height: 36px;
            }
            .content-panel .hadith-box {
                padding: 16px 18px;
            }
            .content-panel .hadith-box .arabic {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            :root {
                --header-height: 64px;
            }
            .app-header {
                padding: 0 14px;
            }
            .app-header .brand .title-group h1 {
                font-size: 0.85rem;
            }
            .app-header .brand .title-group .author {
                font-size: 0.7rem;
            }
            .sidebar {
                width: 275px;
            }
            .main-content {
                padding: 14px 12px 30px;
            }
            .content-panel .panel-title {
                font-size: 1.25rem;
            }
            .menu-category .cat-head {
                padding: 10px 12px;
                font-size: 0.9rem;
            }
            .subcat-head {
                padding: 7px 8px;
                font-size: 0.83rem;
            }
            .items-container li .item-link {
                padding: 6px 8px 6px 20px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="brand">
            <img src="logo-pshd.jpg" alt="Logo" />
            <div class="title-group">
                <h1>Sanitasi dalam Perspektif Hadis</h1>
                <span class="author">Penyusun: Ambarwati & Muhammad Alif</span>
            </div>
        </div>
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
    </header>

    <!-- ===== LAYOUT ===== -->
    <div class="app-layout">

        <!-- OVERLAY -->
        <div class="overlay" id="overlay"></div>

        <!-- ===== SIDEBAR ===== -->
        <nav class="sidebar" id="sidebar" role="navigation" aria-label="Daftar isi">
            <!-- Menu akan diisi secara dinamis melalui JavaScript -->
            <div id="menuContainer"></div>
        </nav>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main-content" id="mainContent">
            <!-- Panel konten akan diisi secara dinamis melalui JavaScript -->
            <div id="panelContainer"></div>
        </main>

    </div>

    <script>
        (function() {
            'use strict';

            // ---------- STRUKTUR DATA NESTED 3 LEVEL + DAFTAR PUSTAKA ----------
            const menuData = [
                {
                    id: 'bab1',
                    label: 'I. MANAJEMEN SANITASI',
                    icon: '📖',
                    subcategories: [
                        {
                            id: 'sub-a',
                            label: 'A. Sumber Air Bersih',
                            icon: '💧',
                            items: [
                                {
                                    id: 'item-a1',
                                    label: '1. Air Laut',
                                    icon: '🌊',
                                    content: `
                                        <h2 class="panel-title">A. Sumber Air Bersih - Air Laut</h2>
                                        <p class="panel-sub">Sumber-sumber air bersih dalam perspektif hadis.</p>
                                        <div class="sub-section">
                                          <h3>1. Air Laut</h3>
                                          <div class="hadith-box">
                                            <div class="arabic">حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ حَدَّثَنَا مَالِكُ بْنُ أَنَسٍ حَدَّثَنِي صَفْوَانُ بْنُ سُلَيْمٍ عَنْ سَعِيدِ بْنِ سَلَمَةَ — هُوَ مِنْ آلِ ابْنِ الْأَزْرَقِ — أَنَّ الْمُغِيرَةَ بْنَ أَبِي بُرْدَةَ وَهُوَ مِنْ بَنِي عَبْدِ الدَّارِ حَدَّثَهُ أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ يَقُولُ جَاءَ رَجُلٌ إِلَى رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ يَا رَسُولَ اللَّهِ إِنَّا نَرْكَبُ الْبَحْرَ وَنَحْمِلُ مَعَنَا الْقَلِيلَ مِنَ الْمَاءِ فَإِنْ تَوَضَّأْنَا بِهِ عَطِشْنَا أَفَنَتَوَضَّأُ مِنْ مَاءِ الْبَحْرِ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ هُوَ الطَّهُورُ مَاؤُهُ الْحِلُّ مَيْتَتُهُ</div>
                                            <div class="translation">Telah menceritakan kepada kami Hisyam bin Ammar berkata, telah menceritakan kepada kami Malik bin Anas berkata, telah menceritakan kepadaku Shafwan bin Sulaim dari Sa'id bin Salamah dari keluarga Ibnu Al Azraq bahwa Al Mughirah bin Abu Burdah dari bani Abdu Ad Dar mendengar Abu Hurairah berkata, "Seorang laki-laki datang kepada Rasulullah ﷺ seraya bertanya, 'Wahai Rasulullah, kami berlayar di lautan dan kami hanya membawa sedikit air, jika kami berwudu dengannya maka kami akan kehausan. Bolehkah kami berwudu dengan air laut?' Rasulullah ﷺ menjawab, 'Laut itu suci airnya dan halal bangkainya.'"</div>
                                            <span class="source">(Ibnu Majah no. 380)</span>
                                          </div>
                                        </div>
                                    `
                                },
                                {
                                    id: 'item-a2',
                                    label: '2. Sumur / Mata Air',
                                    icon: '🕳️',
                                    content: `
                                        <h2 class="panel-title">A. Sumber Air Bersih - Sumur / Mata Air</h2>
                                        <p class="panel-sub">Sumber-sumber air bersih dalam perspektif hadis.</p>
                                        <div class="sub-section">
                                          <h3>2. Sumur / Mata Air</h3>
                                          <div class="hadith-box">
                                            <div class="arabic">حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلَاءِ وَالْحَسَنُ بْنُ عَلِيٍّ وَمُحَمَّدُ بْنُ سُلَيْمَانَ الْأَنْبَارِيُّ قَالُوا حَدَّثَنَا أَبُو أُسَامَةَ عَنِ الْوَلِيدِ بْنِ كَثِيرٍ عَنْ مُحَمَّدِ بْنِ كَعْبٍ عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ رَافِعِ بْنِ خَدِيجٍ عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ أَنَّهُ قِيلَ لِرَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَتَوَضَّأُ مِنْ بِئْرِ بُضَاعَةَ وَهِيَ بِئْرٌ يُطْرَحُ فِيهَا الْحِيَضُ وَلَحْمُ الْكِلَابِ وَالنَّتْنُ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ الْمَاءُ طَهُورٌ لَا يُنَجِّسُهُ شَيْءٌ</div>
                                            <div class="translation">Telah menceritakan kepada kami Muhammad bin Al 'Ala dan Al Hasan bin Ali dan Muhammad bin Sulaiman Al Anbari mereka berkata, telah menceritakan kepada kami Abu Usamah dari Al Walid bin Katsir dari Muhammad bin Ka'b dari Ubaidillah bin Abdullah bin Rafi' bin Khadij dari Abu Sa'id Al Khudri bahwasanya pernah ditanyakan kepada Rasulullah ﷺ, "Bolehkah kita berwudu dari sumur Bidla'ah? Yaitu sumur yang dilemparkan ke dalamnya bekas kotoran haid, bangkai anjing, dan sesuatu yang berbau busuk." Rasulullah ﷺ menjawab, "Air itu suci, tidak ada sesuatu pun yang dapat menajiskannya."</div>
                                            <span class="source">(Abu Dawud no. 60)</span>
                                          </div>
                                        </div>
                                    `
                                }
                            ]
                        },
                        {
                            id: 'sub-b',
                            label: 'B. Pemeliharaan Sumber Air Bersih',
                            icon: '🛠️',
                            items: [
                                {
                                    id: 'item-b1',
                                    label: '1. Waste Water Management',
                                    icon: '♻️',
                                    content: `
                                        <h2 class="panel-title">B. Pemeliharaan Sumber Air Bersih - Waste Water Management</h2>
                                        <p class="panel-sub">Pemeliharaan dan standarisasi air bersih dalam hadis.</p>
                                        <div class="sub-section">

            // ---------- DOM REFS ----------
            const menuContainer = document.getElementById('menuContainer');
            const panelContainer = document.getElementById('panelContainer');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const hamburger = document.getElementById('hamburgerBtn');

            // ---------- RENDER MENU 3 LEVEL ----------
            function renderMenu() {
                let html = '';
                let firstItemId = null;

                menuData.forEach((category, catIdx) => {
                    const isFirstCat = (catIdx === 0);
                    html += `<div class="menu-category">`;
                    html += `<button class="cat-head ${isFirstCat ? 'open' : ''}" data-category="${category.id}" aria-expanded="${isFirstCat}">
                        <span class="icon">${category.icon}</span>
                        ${category.label}
                        <span class="arrow">▶</span>
                    </button>`;
                    html += `<ul class="subcat-container ${isFirstCat ? 'open' : ''}">`;

                    category.subcategories.forEach((subcat, subIdx) => {
                        const isFirstSub = (isFirstCat && subIdx === 0);
                        html += `<li class="subcat-item">`;
                        html += `<button class="subcat-head ${isFirstSub ? 'open' : ''}" data-subcat="${subcat.id}" aria-expanded="${isFirstSub}">
                            <span class="subcat-icon">${subcat.icon || '▸'}</span>
                            ${subcat.label}
                            <span class="subcat-arrow">▶</span>
                        </button>`;
                        html += `<ul class="items-container ${isFirstSub ? 'open' : ''}">`;

                        subcat.items.forEach((item, itemIdx) => {
                            if (isFirstCat && subIdx === 0 && itemIdx === 0) {
                                firstItemId = item.id;
                            }
                            html += `<li><button class="item-link" data-item="${item.id}">
                                <span class="item-icon">${item.icon || '•'}</span>
                                ${item.label}
                            </button></li>`;
                        });

                        html += `</ul></li>`;
                    });

                    html += `</ul></div>`;
                });

                menuContainer.innerHTML = html;
                return firstItemId;
            }

            // ---------- RENDER PANELS ----------
            function renderPanels() {
                let html = '';
                menuData.forEach(category => {
                    category.subcategories.forEach(subcat => {
                        subcat.items.forEach(item => {
                            html += `<div class="content-panel" id="panel-${item.id}">
                                ${item.content}
                            </div>`;
                        });
                    });
                });
                panelContainer.innerHTML = html;
            }

            // ---------- NAVIGATION & ACTIVE STATES ----------
            function showPanel(itemId, fromClick = true) {
                // Sembunyikan semua panel
                document.querySelectorAll('.content-panel').forEach(el => el.classList.remove('active'));
                
                // Tampilkan panel yang dituju
                const panel = document.getElementById('panel-' + itemId);
                if (panel) panel.classList.add('active');

                // Perbarui kelas active pada tombol item level 3
                document.querySelectorAll('.item-link').forEach(el => el.classList.remove('active'));
                const activeLink = document.querySelector(`.item-link[data-item="${itemId}"]`);
                if (activeLink) {
                    activeLink.classList.add('active');
                    
                    // Pastikan kontainer parent (sub-kategori & kategori) terbuka jika belum
                    const itemsContainer = activeLink.closest('.items-container');
                    const subcatHead = itemsContainer ? itemsContainer.previousElementSibling : null;
                    const subcatContainer = itemsContainer ? itemsContainer.closest('.subcat-container') : null;
                    const catHead = subcatContainer ? subcatContainer.previousElementSibling : null;

                    if (itemsContainer && !itemsContainer.classList.contains('open')) {
                        itemsContainer.classList.add('open');
                        if (subcatHead) {
                            subcatHead.classList.add('open');
                            subcatHead.setAttribute('aria-expanded', 'true');
                        }
                    }
                    if (subcatContainer && !subcatContainer.classList.contains('open')) {
                        subcatContainer.classList.add('open');
                        if (catHead) {
                            catHead.classList.add('open');
                            catHead.setAttribute('aria-expanded', 'true');
                        }
                    }
                }

                // Tutup sidebar pada perangkat seluler setelah memilih item
                if (window.innerWidth <= 991 && fromClick) {
                    closeSidebar();
                }
            }

            // ---------- ACCORDION TOGGLE (LEVEL 1 & LEVEL 2) ----------
            function toggleAccordion(button, containerClass) {
                const container = button.nextElementSibling;
                if (!container || !container.classList.contains(containerClass)) return;
                
                const isOpen = container.classList.contains('open');
                if (isOpen) {
                    container.classList.remove('open');
                    button.classList.remove('open');
                    button.setAttribute('aria-expanded', 'false');
                } else {
                    container.classList.add('open');
                    button.classList.add('open');
                    button.setAttribute('aria-expanded', 'true');
                }
            }

            // ---------- SIDEBAR TOGGLE (mobile) ----------
            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function toggleSidebar() {
                if (sidebar.classList.contains('open')) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            }

            // ---------- INISIALISASI ----------
            function init() {
                renderPanels();
                const firstItemId = renderMenu();

                // Event Delegation untuk Menu Sidebar
                menuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;

                    // Level 1: Kategori Head
                    if (target.classList.contains('cat-head')) {
                        e.stopPropagation();
                        toggleAccordion(target, 'subcat-container');
                        return;
                    }

                    // Level 2: Sub-Kategori Head
                    if (target.classList.contains('subcat-head')) {
                        e.stopPropagation();
                        toggleAccordion(target, 'items-container');
                        return;
                    }

                    // Level 3: Item Link (Konten)
                    if (target.classList.contains('item-link')) {
                        e.preventDefault();
                        const itemId = target.dataset.item;
                        if (itemId) {
                            showPanel(itemId, true);
                        }
                        return;
                    }
                });

                // Tampilkan panel pertama secara default
                if (firstItemId) {
                    showPanel(firstItemId, false);
                } else if (menuData.length && menuData[0].subcategories.length && menuData[0].subcategories[0].items.length) {
                    showPanel(menuData[0].subcategories[0].items[0].id, false);
                }

                // Event listener untuk tombol hamburger dan overlay
                hamburger.addEventListener('click', toggleSidebar);
                overlay.addEventListener('click', closeSidebar);

                // Tutup sidebar jika ukuran layar berubah menjadi desktop
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 991) {
                        closeSidebar();
                    }
                });

                // Tutup sidebar saat tombol ESC ditekan
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && sidebar.classList.contains('open')) {
                        closeSidebar();
                    }
                });
            }

            // Jalankan saat DOM siap
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
