    <script>
        (function() {
            'use strict';

            const menuData = [{
                id: 'bab1',
                label: 'BAB I — Pengertian & Urgensi Silaturahmi',
                icon: '📖',
                children: [{
                    id: '1a',
                    label: 'Pengertian Silaturahmi',
                    icon: '🔗',
                    content: `
                <h2 class="panel-title">Pengertian Silaturahmi</h2>
                <p class="panel-sub">Makna dan hakikat silaturahmi dalam perspektif hadis.</p>
                <div class="hadith-box">
                  <div class="arabic">حَدَّثَنَا خَالِدُ بْنُ مَخْلَدٍ: حَدَّثَنَا سُلَيْمَانُ: حَدَّثَنَا عَبْدُ اللَّهِ بْنُ دِينَارٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: إِنَّ الرَّحِمَ شِجْنَةٌ مِنَ الرَّحْمَنِ فَقَالَ اللَّهُ: مَنْ وَصَلَكِ وَصَلْتُهُ وَمَنْ قَطَعَكِ قَطَعْتُهُ</div>
                  <div class="translation">“Sesungguhnya penamaan rahim itu diambil dari nama Allah: Ar-Rahman. Allah berfirman: Barangsiapa menyambungmu maka Akupun menyambungnya dan barangsiapa memutuskanmu maka Akupun akan memutuskannya.”</div>
                  <span class="source">(HR. Bukhari No. 5988)</span>
                </div>
                <div class="hadith-box">
                  <div class="arabic">حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ : أَخْبَرَنَا سُفْيَانُ، عَنِ الْأَعْمَشِ وَالْحَسَنِ بْنِ عَمْرٍو وَفِطْرٍ، عَنْ مُجَاهِدٍ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو قَالَ سُفْيَانُ لَمْ يَرْفَعْهُ الْأَعْمَشُ إِلَى النَّبِيِّ وَرَفَعَهُ حَسَنٌ وَفِطْرٌ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: «لَيْسَ الْوَاصِلُ بِالْمُكَافِئِ، وَلَكِنِ الْوَاصِلُ الَّذِي إِذَا قُطِعَتْ رَحِمُهُ وَصَلَهَا</div>
                  <div class="translation">“Orang yang menyambung (silaturrahim) bukanlah orang yang membalas kebaikan secara setimpal. Namun orang yang menyambung (silaturrahim) adalah orang yang menyambung hubungan kekerabatan setelah terputus.”</div>
                  <span class="source">(HR. Bukhari No. 5991)</span>
                </div>
                <div class="hadith-box">
                  <div class="arabic">حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدِ بْنِ جَمِيلِ بْنِ طَرِيفِ بْنِ عَبْدِ اللَّهِ الثَّقَفِيُّ وَمُحَمَّدُ بْنُ عَبَّادٍ. قَالَ: حَدَّثَنَا حَاتِمٌ (وَهُوَ ابْنُ إِسْمَاعِيلَ) عَنْ مُعَاوِيَةَ (وَهُوَ ابْنُ أَبِي مُزَرِّدٍ، مَوْلَى بَنِي هَاشِمٍ). حَدَّثَنِي عَمِّي، أَبُو الْحُبَابِ، سَعِيدِ بْنِ يَسَارٍ عَنْ أَبِي هُرَيْرَةَ، قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ "أَنَّ اللَّهَ خَلَقَ الْخَلْقَ حَتَّى إِذَا فَرَغَ مِنْهُمْ قَامَتِ الرَّحِمُ فَقَالَتْ: هَذَا مَقَامُ الْعَائِذِ مِنَ الْقَطِيعَةِ. قَالَ: نَعَمْ. أَمَا تَرْضَيْنَ أَنْ أَصِلَ مَنْ وَصَلَكِ وَأَقْطَعَ مَنْ قَطَعَكِ؟ قَالَتْ: بَلَى. قَالَ: فَذَاكَ لَكِ". ثُمَّ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ "اقْرَءُوا إِنْ شِئْتُمْ}: فَهَلْ عَسَيْتُمْ إِنْ تَوَلَّيْتُمْ أَنْ تُفْسِدُوا فِي الْأَرْضِ وَتُقَطِّعُوا أَرْحَامَكُمْ. أُولَئِكَ الَّذِينَ لَعَنَهُمُ اللَّهُ فَأَصَمَّهُمْ وَأَعْمَى أَبْصَارَهُمْ. أَفَلَا يَتَدَبَّرُونَ الْقُرْآنَ أَمْ عَلَى قُلُوبٍ أَقْفَالُهَا"{</div>
                  <div class="translation">“Setelah Allah menciptakan semua makhluk, maka rahim pun berdiri sambil berkata, ‘Inikah tempat bagi yang berlindung dari terputusnya silaturahim.’ Allah menjawab, ‘Benar. Tidakkah kamu rela bahwasanya Aku akan menyambung orang yang menyambungmu dan memutuskan yang memutuskanmu?’ Rahim menjawab, ‘Tentu.’ Allah berfirman, ‘Itulah yang kamu miliki.’ Setelah itu Rasulullah bersabda, ‘Jika kamu mau, maka bacalah ayat ...’”</div>
                  <span class="source">(HR. Muslim No. 2554)</span>
                </div>
                <div class="hadith-box">
                  <div class="arabic">حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ حَدَّثَنَا سُفْيَانُ عَنِ الزُّهْرِيِّ عَنْ عَطَاءِ بْنِ يَزِيدَ اللَّيْثِيِّ عَنْ أَبِي أَيُّوبَ رَضِيَ اللَّهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: «لَا يَحِلُّ لِمُسْلِمٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلَاثٍ، يَلْتَقِيَانِ فَيَصُدُّ هَذَا وَيَصُدُّ هَذَا، وَخَيْرُهُمَا الَّذِي يَبْدَأُ بِالسَّلَامِ</div>
                  <div class="translation">“Tidak halal bagi seorang muslim tidak bersapaan dengan saudaranya lebih dari tiga malam. Keduanya saling bertemu, tetapi saling berpaling. Yang terbaik di antara keduanya ialah yang lebih dahulu memberi salam.”</div>
                  <span class="source">(HR. Bukhari No. 6237 & Muslim No. 2560)</span>
                </div>
                <div class="hadith-box">

                <p style="line-height:1.8; font-size:1rem; color:#2d3f54; margin-bottom:16px;">Kepada para pembaca yang terhormat, semoga keberkahan dan rahmat Allah senantiasa menyertai kita semua. Melalui kesempatan ini, saya dengan tulus menghadirkan sebuah ebook yang mengangkat tema yang sangat penting dalam kehidupan kita, yaitu "Hadis Tematik: Urgensi Silaturahmi dalam Perspektif Hadis."</p>
                <p style="line-height:1.8; font-size:1rem; color:#2d3f54; margin-bottom:16px;">Silaturahmi, dalam bahasa Arab, berasal dari kata "sila" yang berarti menghubungkan atau menjalin, dan "rahim" yang berarti hubungan kekeluargaan. Dalam agama Islam, silaturahmi adalah salah satu nilai luhur yang diajarkan oleh Rasulullah Muhammad ﷺ dan ditegaskan dalam Al-Qur'an dan hadis-hadisnya. Silaturahmi adalah ikatan yang menghubungkan satu dengan yang lain, baik dalam lingkup keluarga, tetangga, maupun masyarakat secara luas. Hadis-hadis Rasulullah ﷺ memberikan pengajaran yang jelas mengenai pentingnya menjaga silaturahmi. Salah satu hadis yang menggambarkan urgensi silaturahmi adalah hadis riwayat Abu Hurairah yang diriwayatkan oleh Imam Bukhari, di mana Rasulullah ﷺ bersabda, "Barangsiapa yang ingin diluaskan rizkinya dan dipanjangkan umurnya, hendaklah ia menyambung tali silaturahmi."</p>
                <p style="line-height:1.8; font-size:1rem; color:#2d3f54; margin-bottom:16px;">Dalam perspektif hadis, urgensi silaturahmi menunjukkan sejumlah manfaat dan hikmah yang tak terhingga. Melalui silaturahmi, kita dapat mempererat hubungan kekeluargaan, menguatkan jalinan persaudaraan, serta menjaga keharmonisan dalam masyarakat. Dalam silaturahmi, terdapat berkah dan rahmat yang melimpah, karena dengan bersilaturahmi kita berbagi kasih sayang, saling memberikan nasehat, serta saling membantu dalam kebaikan dan kesulitan. Namun, dalam dinamika kehidupan modern saat ini, silaturahmi sering kali terabaikan dan terlupakan. Padatnya aktivitas sehari-hari, kemajuan teknologi, serta jarak geografis sering kali menjadi alasan untuk mengabaikan pentingnya menjaga silaturahmi. Oleh karena itu, ebook ini hadir untuk mengingatkan kita akan urgensi dan keutamaan silaturahmi dalam perspektif hadis, agar kita kembali merasakan manfaatnya dan berupaya menjaganya dengan sebaik-baiknya.</p>

                    const isFirst = (idx === 0);
                    html += `<div class="menu-section">`;
                    html += `<button class="menu-head ${isFirst ? 'open' : ''}" data-section="${section.id}" aria-expanded="${isFirst}">
                        <span class="icon">${section.icon}</span> ${section.label}
                        <span class="arrow">▶</span>
                    </button>`;
                    html += `<ul class="sub-menu ${isFirst ? 'open' : ''}">`;
                    section.children.forEach((child, ci) => {
                        if (isFirst && ci === 0) firstSubId = child.id;
                        html += `<li><button class="sub-link" data-panel="${child.id}">
                            <span class="sub-icon">${child.icon || '▸'}</span> ${child.label}
                        </button></li>`;
                    });
                    html += `</ul></div>`;
                });
                menuContainer.innerHTML = html;
                return firstSubId;
            }

            function renderExtraMenu() {
                let html = '';
                extraData.forEach(item => {
                    html += `<button class="extra-link" data-panel="${item.id}">
                        <span class="icon">${item.icon}</span> ${item.label}
                    </button>`;
                });
                extraMenuContainer.innerHTML = html;
            }

            function renderPanels() {
                let html = '';
                menuData.forEach(section => {
                    section.children.forEach(child => {
                        html += `<div class="content-panel" id="panel-${child.id}">${child.content}</div>`;
                    });
                });
                extraData.forEach(item => {
                    html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                });
                panelContainer.innerHTML = html;
            }

            function showPanel(panelId, fromSubLink = true) {
                document.querySelectorAll('.content-panel').forEach(el => el.classList.remove('active'));
                const panel = document.getElementById('panel-' + panelId);
                if (panel) panel.classList.add('active');
                document.querySelectorAll('.sub-link').forEach(el => el.classList.remove('active'));
                const activeLink = document.querySelector(`.sub-link[data-panel="${panelId}"]`);
                if (activeLink) activeLink.classList.add('active');
                document.querySelectorAll('.extra-link').forEach(el => el.classList.remove('active'));
                const extraLink = document.querySelector(`.extra-link[data-panel="${panelId}"]`);
                if (extraLink) extraLink.classList.add('active');
                activePanelId = panelId;
                if (window.innerWidth <= 991 && fromSubLink) closeSidebar();
            }

            function toggleSection(headBtn) {
                const sub = headBtn.nextElementSibling;
                const isOpen = sub.classList.contains('open');
                if (isOpen) {
                    sub.classList.remove('open');
                    headBtn.classList.remove('open');
                    headBtn.setAttribute('aria-expanded', 'false');
                } else {
                    sub.classList.add('open');
                    headBtn.classList.add('open');
                    headBtn.setAttribute('aria-expanded', 'true');
                }
            }

            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function toggleSidebar() {
                if (sidebar.classList.contains('open')) closeSidebar();
                else openSidebar();
            }

            function init() {
                renderPanels();
                const firstSub = renderMenu();
                renderExtraMenu();

                menuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('menu-head')) {
                        e.stopPropagation();
                        toggleSection(target);
                        return;
                    }
                    if (target.classList.contains('sub-link')) {
                        e.preventDefault();
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                        return;
                    }
                });

                extraMenuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                    }
                });

                if (extraData.length > 0) {
                    showPanel(extraData[0].id, false);
                } else if (firstSub) {
                    showPanel(firstSub, false);
                } else if (menuData.length && menuData[0].children.length) {
                    showPanel(menuData[0].children[0].id, false);
                }

                const firstSection = document.querySelector('.menu-section:first-child .menu-head');
                const firstSubMenu = firstSection ? firstSection.nextElementSibling : null;
                if (firstSection && firstSubMenu && !firstSubMenu.classList.contains('open')) {
                    firstSection.classList.add('open');
                    firstSubMenu.classList.add('open');
                    firstSection.setAttribute('aria-expanded', 'true');
                }

                hamburger.addEventListener('click', toggleSidebar);
                overlay.addEventListener('click', closeSidebar);
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 991) closeSidebar();
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
                });
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
