<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Climber dalam Perspektif Hadis · E-Book</title>
    <base target="_self" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f6f0;
            color: #1e2b3a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        :root {
            --primary: #2b4f8c;
            --gold: #c9a84c;
            --gold-light: #e0c66e;
            --gold-dark: #a8892f;
            --bg-body: #f8f6f0;
            --bg-card: #ffffff;
            --shadow: 0 8px 30px rgba(0,0,0,0.08);
            --radius: 12px;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
            --sidebar-width: 320px;
            --header-height: 72px;
        }
        .app-header {
            position: sticky; top: 0; z-index: 1000;
            height: var(--header-height);
            background: var(--primary); color: #fff;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 12px rgba(43,79,140,0.25);
        }
        .app-header .brand { display: flex; align-items: center; gap: 14px; }
        .app-header .brand img {
            height: 44px; width: auto; border-radius: 6px;
            background: #fff; padding: 4px; object-fit: contain;
        }
        .app-header .brand .title-group { display: flex; flex-direction: column; line-height: 1.2; }
        .app-header .brand .title-group h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem; font-weight: 700; letter-spacing: 0.5px;
        }
        .app-header .brand .title-group .author {
            font-size: 0.78rem; color: var(--gold-light); font-weight: 400; letter-spacing: 0.3px;
        }
        .app-header .hamburger {
            display: none; flex-direction: column; gap: 5px;
            background: transparent; border: none; cursor: pointer;
            padding: 6px 4px; border-radius: 6px;
        }
        .app-header .hamburger:hover { background: rgba(255,255,255,0.1); }
        .app-header .hamburger span {
            display: block; width: 26px; height: 2.5px; background: #fff; border-radius: 4px;
        }
        .app-layout { display: flex; flex: 1; position: relative; }
        .sidebar {
            width: var(--sidebar-width); background: #fff;
            border-left: 1px solid rgba(43,79,140,0.10);
            box-shadow: -4px 0 20px rgba(0,0,0,0.04);
            height: calc(100vh - var(--header-height));
            position: sticky; top: var(--header-height);
            overflow-y: auto; overflow-x: hidden;
            padding: 16px 10px 30px;
            flex-shrink: 0;
            transition: transform var(--transition);
            z-index: 900;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: #f0ede7; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 8px; }
        .menu-section { margin-bottom: 4px; border-bottom: 1px solid rgba(43,79,140,0.06); }
        .menu-section:last-of-type { border-bottom: none; }
        .menu-head {
            display: flex; align-items: center; gap: 10px;
            width: 100%; padding: 12px 14px;
            background: transparent; border: none; border-radius: var(--radius);
            font-family: 'Inter', sans-serif; font-size: 0.86rem; font-weight: 600;
            color: var(--primary); cursor: pointer; transition: all var(--transition);
            text-align: left;
        }
        .menu-head:hover { background: rgba(43,79,140,0.06); }
        .menu-head .icon {
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; width: 20px; height: 20px; fill: var(--primary);
        }
        .menu-head .arrow {
            margin-left: auto; font-size: 0.7rem;
            transition: transform var(--transition); color: var(--gold-dark);
        }
        .menu-head.open .arrow { transform: rotate(90deg); }
        .sub-menu {
            list-style: none; padding: 0; margin: 0 0 6px 0;
            overflow: hidden; max-height: 0;
            transition: max-height 0.4s ease, opacity 0.25s ease; opacity: 0;
        }
        .sub-menu.open { max-height: 5000px; opacity: 1; }
        .sub-menu li { margin: 0; }
        .sub-link {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 14px 8px 34px;
            font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 450;
            color: #2d3f54; border-radius: 8px; cursor: pointer;
            transition: all var(--transition); border: none; background: transparent;
            width: 100%; text-align: left;
        }
        .sub-link:hover { background: rgba(43,79,140,0.07); color: var(--primary); }
        .sub-link.active {
            background: var(--primary); color: #fff; font-weight: 500;
            box-shadow: 0 4px 12px rgba(43,79,140,0.25);
        }
        .sub-link .sub-icon {
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; width: 16px; height: 16px;
            fill: #2d3f54; opacity: 0.8;
        }
        .sub-link:hover .sub-icon { fill: var(--primary); }
        .sub-link.active .sub-icon { fill: #fff; opacity: 1; }
        .sub-menu .menu-head { padding: 8px 14px 8px 28px; font-size: 0.83rem; }
        .sub-menu .menu-head .icon { width: 16px; height: 16px; }
        .sub-menu .sub-menu .sub-link { padding-left: 52px; font-size: 0.78rem; }
        .extra-menu {
            margin-top: 16px; padding-top: 12px;
            border-top: 2px solid rgba(43,79,140,0.08);
        }
        .extra-link {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-radius: var(--radius);
            font-family: 'Inter', sans-serif; font-size: 0.88rem; font-weight: 500;
            color: var(--primary); cursor: pointer;
            transition: all var(--transition); border: none;
            background: transparent; width: 100%; text-align: left;
        }
        .extra-link:hover { background: rgba(43,79,140,0.06); }
        .extra-link.active {
            background: var(--primary); color: #fff;
            box-shadow: 0 4px 12px rgba(43,79,140,0.25);
        }
        .extra-link .icon {
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; width: 20px; height: 20px; fill: var(--primary);
        }
        .extra-link.active .icon { fill: #fff; }
        .main-content {
            flex: 1; padding: 32px 40px 60px;
            min-width: 0; background: var(--bg-body);
        }
        .content-panel { display: none; animation: fadeUp 0.35s ease; }
        .content-panel.active { display: block; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem; font-weight: 700; color: var(--primary);
            margin-bottom: 8px; border-bottom: 3px solid var(--gold);
            padding-bottom: 10px; display: inline-block;
        }
        .panel-sub { font-size: 0.95rem; color: #5e6f82; margin-bottom: 24px; }
        .hadith-box {
            background: var(--bg-card); border-radius: var(--radius);
            padding: 20px 24px; margin: 18px 0 22px;
            box-shadow: var(--shadow); border-left: 4px solid var(--gold);
        }
        .hadith-box .arabic {
            font-size: 1.15rem; line-height: 2.1; color: #1e2b3a;
            direction: rtl; text-align: right;
            font-family: 'Times New Roman', 'Traditional Arabic', serif;
            margin-bottom: 12px; padding: 6px 0; word-wrap: break-word;
        }
        .hadith-box .translation {
            font-size: 0.95rem; line-height: 1.75; color: #2d3f54;
            border-top: 1px dashed rgba(43,79,140,0.12); padding-top: 12px;
        }
        .hadith-box .source {
            display: block; margin-top: 10px; font-size: 0.8rem;
            color: var(--gold-dark); font-weight: 600; letter-spacing: 0.2px;
        }
        .sub-section { margin-top: 24px; }
        .sub-section h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem; color: var(--primary); margin-bottom: 8px;
        }
        .sub-section p { line-height: 1.75; color: #2d3f54; margin-bottom: 12px; text-align: justify; }
        .author-card {
            background: linear-gradient(135deg, #eef4fb 0%, #dce9f5 100%);
            border-radius: 16px; padding: 28px;
            box-shadow: var(--shadow);
            border: 2px dashed var(--primary);
            margin-top: 16px;
        }
        .author-name {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; font-weight: 900;
            color: var(--primary); text-align: center;
            letter-spacing: 1px; line-height: 1.1;
        }
        .author-tagline {
            text-align: center; color: var(--primary);
            font-style: italic; font-size: 0.95rem;
            margin: 12px 0 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(43,79,140,0.3);
        }
        .info-block {
            background: #fff; border-radius: 12px; padding: 18px 20px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
            margin-bottom: 16px;
        }
        .info-block h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem; color: var(--primary);
            margin-bottom: 12px; padding-bottom: 8px;
            border-bottom: 2px solid var(--gold);
            display: flex; align-items: center; gap: 8px;
        }
        .info-block p { line-height: 1.75; color: #2d3f54; font-size: 0.92rem; text-align: justify; }
        .overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.35); z-index: 850;
            backdrop-filter: blur(2px);
        }
        .overlay.active { display: block; }
        .prakata-text {
            line-height: 1.85; font-size: 0.98rem;
            color: #2d3f54; margin-bottom: 16px; text-align: justify;
        }
        .prakata-text strong { color: var(--primary); }
        .signature {
            text-align: right; font-style: italic;
            color: #5e6f82; margin-top: 20px;
        }
        .bibliography { margin-top: 20px; }
        .bibliography ul { list-style: none; padding: 0; }
        .bibliography ul li {
            padding: 8px 0 8px 20px; font-size: 0.85rem;
            line-height: 1.7; color: #2d3f54;
            border-bottom: 1px solid rgba(43,79,140,0.06);
            text-indent: -20px; padding-left: 30px;
        }
        .bibliography ul li::before {
            content: "•"; color: var(--gold);
            font-weight: 700; margin-right: 8px;
        }
        @media (max-width: 991px) {
            .app-header .hamburger { display: flex; }
            .sidebar {
                position: fixed; top: var(--header-height); right: 0;
                height: calc(100vh - var(--header-height));
                transform: translateX(100%);
                box-shadow: -8px 0 30px rgba(0,0,0,0.10);
                border-left: none; width: 300px; padding: 12px 8px 30px;
            }
            .sidebar.open { transform: translateX(0); }
            .main-content { padding: 20px 18px 40px; }
            .panel-title { font-size: 1.35rem; }
            .app-header .brand .title-group h1 { font-size: 0.9rem; }
            .app-header .brand img { height: 36px; }
            .hadith-box { padding: 16px 18px; }
            .hadith-box .arabic { font-size: 1rem; }
            .author-name { font-size: 1.5rem; }
        }
        @media (max-width: 480px) {
            :root { --header-height: 64px; }
            .app-header { padding: 0 14px; }
            .app-header .brand .title-group h1 { font-size: 0.78rem; }
            .app-header .brand .title-group .author { font-size: 0.62rem; }
            .sidebar { width: 280px; }
            .main-content { padding: 14px 12px 30px; }
            .panel-title { font-size: 1.15rem; }
            .sub-link { padding: 7px 10px 7px 28px; font-size: 0.78rem; }
            .menu-head { padding: 10px 12px; font-size: 0.8rem; }
            .author-card { padding: 18px; }
            .info-block { padding: 14px; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <img src="logo-pshd.jpg" alt="Logo" />
            <div class="title-group">
                <h1>Social Climber dalam Perspektif Hadis</h1>
                <span class="author">Penyusun: Adelia Lutfiani & Muhammad Alif</span>
            </div>
        </div>
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
    </header>
    <div class="app-layout">
        <div class="overlay" id="overlay"></div>
        <nav class="sidebar" id="sidebar" role="navigation" aria-label="Daftar isi">
            <div class="top-menu" id="topMenu"></div>
            <div id="menuContainer"></div>
            <div class="extra-menu" id="extraMenu"></div>
        </nav>
        <main class="main-content" id="mainContent">
            <div id="panelContainer"></div>
        </main>
    </div>

    <script>
        (function() {
            'use strict';

            var svgIcons = {

                books: '<svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>',
                folder: '<svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>',
                target: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>',
                heart: '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
                scale: '<svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l4-2.18L12 3zm6.82 9L12 15.72 5.18 12 12 8.28l6.82 3.72zM5 16.5v-3.55L12 17l7-4.05v3.55L12 20.28 5 16.5z"/></svg>',
                star: '<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>',
                cloud: '<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>',
                hands: '<svg viewBox="0 0 24 24"><path d="M18 11h-2V6c0-1.1-.9-2-2-2v0c-1.1 0-2 .9-2 2v5H9V4c0-1.1-.9-2-2-2v0C5.9 2 5 2.9 5 4v12.25c0 .77.31 1.48.86 2.02l4.97 4.98c.55.55 1.28.86 2.04.86h5.08c1.66 0 3.01-1.34 3.01-3v-6c0-1.66-1.34-3-3-3z"/></svg>',
                fire: '<svg viewBox="0 0 24 24"><path d="M17.56 10.59c-.93-.88-1.74-2.18-1.75-3.64 0-1.63 1.05-3.1 2.5-3.65-2.09-.64-4.52.22-5.73 2.05-1.46 2.21-.49 5.2 1.64 6.78-1.28-.15-2.43-.81-3.14-1.85-.94-1.38-1.02-3.21-.19-4.66C9.28 6.55 7.82 8.3 7.3 10.45c-.6 2.5.39 5.16 2.45 6.74C11.39 18.3 13.06 19 14.8 19c2.04 0 3.99-.87 5.37-2.38 1.4-1.52 1.94-3.7 1.35-5.65-.55-1.82-2.12-3.19-3.96-3.38z"/></svg>',
                shield: '<svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>',
                user: '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
                eye: '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>',
                globe: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>',
                sparkle: '<svg viewBox="0 0 24 24"><path d="M12 2l1.5 6.5L20 10l-6.5 1.5L12 18l-1.5-6.5L4 10l6.5-1.5z"/></svg>',
                sad: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 9.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm-7 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm6.5 6.5c-1.5 1.5-3.5 2-5 2s-3.5-.5-5-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
            };

            var topMenuData = [{
                id: 'prakata',
                label: 'Prakata',
                icon: svgIcons.book,
                content: [
                    '<h2 class="panel-title">Prakata</h2>',
                    '<p class="prakata-text">Puji syukur penulis panjatkan ke hadirat Allah Swt. atas segala rahmat, karunia, dan kesempatan sehingga buku yang berjudul <strong>"Social Climber dalam Perspektif Hadis: Studi Tematik"</strong> ini dapat diselesaikan dengan baik. Shalawat serta salam semoga senantiasa tercurah kepada Nabi Muhammad saw., keluarga, sahabat, serta seluruh umatnya hingga akhir zaman.</p>',
                    '<p class="prakata-text">Buku ini hadir sebagai bentuk refleksi terhadap fenomena sosial yang semakin berkembang di era digital, khususnya mengenai perilaku <em>social climber</em> — kecenderungan seseorang untuk menaikkan status sosialnya dengan berbagai cara, baik positif maupun negatif. Melalui pendekatan studi tematik, buku ini mengkaji bagaimana fenomena tersebut dipahami dari sudut pandang hadis Nabi SAW, sehingga pembaca dapat memahami batasan antara ambisi yang dibenarkan dan perilaku yang tercela.</p>',
                    '<p class="prakata-text">Penulis menyadari bahwa buku ini masih memiliki banyak kekurangan, baik dari segi isi maupun penyusunan. Oleh karena itu, kritik dan saran yang membangun sangat diharapkan demi perbaikan dan pengembangan karya ini di masa mendatang.</p>',
                    '<p class="prakata-text">Akhir kata, penulis berharap buku ini dapat memberikan manfaat, menambah wawasan, serta menjadi bahan refleksi bagi pembaca dalam memahami fenomena <em>social climber</em> di tengah kehidupan modern saat ini.</p>',
                    '<p class="signature">Penulis,<br /><strong>Adelia Lutfiani</strong></p>'
                ].join('')
            }];

            function hadithBox(arabic, translation, source) {
                return '<div class="hadith-box">' +
                    '<div class="arabic">' + arabic + '</div>' +
                    '<div class="translation">' + translation + '</div>' +
                    '<span class="source">— ' + source + '</span>' +
                    '</div>';
            }
            function panelWrap(title, inner) {
                return '<h2 class="panel-title">' + title + '</h2>' + inner;
            }
            function subSection(text) {
                return '<div class="sub-section"><p>' + text + '</p></div>';
            }

            var menuData = [
                {
                    id: 'bab1',
                    label: 'BAB I — PENGERTIAN & MOTIF SOCIAL CLIMBER',
                    icon: svgIcons.target,
                    children: [
                        {
                            id: '1A',
                            label: 'A. Pansos Positif (Cari Ridha Allah)',
                            icon: svgIcons.heart,

                                            'Telah menceritakan kepada kami Musaddad, telah menceritakan kepada kami Yahya, dari Sufyan, telah menceritakan kepadaku Salamah bin Kuhail. Lewat jalur periwayatan lain, telah menceritakan kepada kami Abu Nu\'aim, telah menceritakan kepada kami Sufyan, dari Salamah, ia mengatakan; Aku mendengar Jundab berkata: <strong>"Nabi ﷺ bersabda" — dan aku tak mendengar seorang pun mengatakan dengan redaksi \'Nabi ﷺ bersabda selain dia — maka aku dekati dia, dan kudengar dia menuturkan, Nabi ﷺ bersabda: "Barang siapa yang memperdengarkan, maka Allah akan memperdengarkan tentangnya, dan barang siapa yang memperlihatkan (riya\'), maka Allah akan memperlihatkan tentangnya."</strong>',
                                            'Shahih Bukhari 6134'
                                        ) +
                                        subSection('Tujuan utama <em>social climber</em> adalah mencari perhatian. Namun, dalam Islam, siapa pun yang melakukan amal demi diperdengarkan atau diperlihatkan kepada manusia, maka Allah akan membalasnya dengan memperlihatkan keburukannya di akhirat.')
                                    )
                                },
                                {
                                    id: '2B2',
                                    label: '2. Cari Popularitas',
                                    icon: svgIcons.star,
                                    content: panelWrap('2. Cari Popularitas',
                                        hadithBox(
                                            'حَدَّثَنَا سَعِيدُ بْنُ أَبِي مَرْيَمَ أَخْبَرَنَا مُحَمَّدُ بْنُ جَعْفَرٍ قَالَ حَدَّثَنِي زَيْدُ بْنُ أَسْلَمَ عَنْ عَطَاءِ بْنِ يَسَارٍ عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللَّهُ عَنْهُ أَنَّ رِجَالًا مِنْ الْمُنَافِقِينَ عَلَى عَهْدِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ إِذَا خَرَجَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِلَى الْغَزْوِ تَخَلَّفُوا عَنْهُ وَفَرِحُوا بِمَقْعَدِهِمْ خِلَافَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَإِذَا قَدِمَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ اعْتَذَرُوا إِلَيْهِ وَحَلَفُوا وَأَحَبُّوا أَنْ يُحْمَدُوا بِمَا لَمْ يَفْعَلُوا فَنَزَلَتْ { لَا تَحْسَبَنَّ الَّذِينَ يَفْرَحُونَ بِمَا أَتَوا وَيُحِبُّونَ أَن يُحْمَدُوا بِمَا لَمْ يَفْعَلُوا } الْآيَةَ',
                                            'Telah menceritakan kepada kami Sa\'id bin Abi Maryam, telah mengabarkan kepada kami Muhammad bin Ja\'far, ia berkata, telah menceritakan kepadaku Zaid bin Aslam dari \'Atha bin Yasar dari Abu Sa\'id Al Khudri radhiallahu\'anhu: <strong>"Bahwa ada beberapa orang munafik pada masa Rasulullah apabila beliau pergi berperang, mereka tidak turut berperang dan merasa bangga dengan ketidakpergiannya untuk menyelisihi Rasulullah. Apabila Rasulullah telah kembali (membawa kemenangan dan harta rampasan perang), mereka mengemukakan alasan mereka masing-masing yang menjadikan mereka tidak turut berperang serta menguatkan alasannya dengan sumpah. Kemudian mereka ingin dipuji (seolah-olah merekalah yang pahlawan) padahal mereka tidak berbuat apa-apa. Karena itu turunlah ayat: Janganlah sekali-kali kamu menyangka bahwa orang-orang yang gembira dengan apa yang telah mereka kerjakan, sedang merekapun ingin dipuji terhadap perbuatan yang tidak mereka kerjakan, janganlah kamu mengira bahwa mereka akan terlepas dari siksa...\' (QS. Ali Imraan: 188)."</strong>',
                                            'Shahih Bukhari 4567'
                                        ) +
                                        subSection('Mencari popularitas dengan mengaku-aku perbuatan yang tidak dilakukan adalah ciri kemunafikan. Al-Qur\'an menegaskan bahwa orang yang ingin dipuji atas apa yang tidak dilakukannya tidak akan lepas dari siksa.')
                                    )

                                {
                                    id: '2B3',
                                    label: '3. Cari Panggung',
                                    icon: svgIcons.fire,
                                    content: panelWrap('3. Cari Panggung',
                                        hadithBox(
                                            'عَنْ أَبِي هُرَيْرَةَ قَالَ: سَمِعْتُ رَسُولَ اللهِ -صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ- يَقُولُ: «إِنَّ أَوَّلَ النَّاسِ يُقْضَى يَوْمَ الْقِيَامَةِ عَلَيْهِ رَجُلٌ اسْتُشْهِدَ، فَأُتِيَ بِهِ، فَعَرَّفَهُ نِعْمَتَهُ، فَعَرَفَهَا، قَالَ: فَمَا عَمِلْتَ فِيهَا؟ قَالَ: قَاتَلْتُ فِيكَ حَتَّى اسْتُشْهِدْتُ. قَالَ: كَذَبْتَ، وَلَكِنَّكَ قَاتَلْتَ لِأَنْ يُقَالَ: جَرِيءٌ! فَقَدْ قِيلَ، ثُمَّ أُمِرَ بِهِ فَسُحِبَ عَلَى وَجْهِهِ حَتَّى أُلْقِيَ فِي النَّارِ. وَرَجُلٌ تَعَلَّمَ الْعِلْمَ وَعَلَّمَهُ، وَقَرَأَ الْقُرْآنَ، فَأُتِيَ بِهِ فَعَرَّفَهُ نِعَمَهُ فَعَرَفَهَا. قَالَ: فَمَا عَمِلْتَ فِيهَا؟ قَالَ: تَعَلَّمْتُ الْعِلْمَ وَعَلَّمْتُهُ، وَقَرَأْتُ فِيكَ الْقُرْآنَ، قَالَ: كَذَبْتَ، وَلَكِنَّكَ تَعَلَّمْتَ لِيُقَالَ: عَالِمٌ! وَقَرَأْتَ الْقُرْآنَ لِيُقَالَ: هُوَ قَارِئٌ؛ فَقَدْ قِيلَ، ثُمَّ أُمِرَ بِهِ فَسُحِبَ عَلَى وَجْهِهِ حَتَّى أُلْقِيَ فِي النَّارِ. وَرَجُلٌ وَسَّعَ اللهُ عَلَيْهِ، وَأَعْطَاهُ مِنْ أَصْنَافِ الْمَالِ، فَأُتِيَ بِهِ فَعَرَّفَهُ نِعَمَهُ، فَعَرَفَهَا. قَالَ: فَمَا عَمِلْتَ فِيهَا؟ قَالَ: مَا تَرَكْتُ مِنْ سَبِيلٍ تُحِبُّ أَنْ يُنْفَقَ فِيهَا إِلَّا أَنْفَقْتُ فِيهَا لَكَ. قَالَ: كَذَبْتَ، وَلَكِنَّكَ فَعَلْتَ لِيُقَالَ: جَوَادٌ! فَقَدْ قِيلَ، ثُمَّ أُمِرَ بِهِ فَسُحِبَ عَلَى وَجْهِهِ حَتَّى أُلْقِيَ فِي النَّارِ»',
                                            'Dari Abi Hurairah Radhiyallahu \'anhu, ia berkata, aku mendengar Rasulullah Shallallahu \'alaihi wa sallam bersabda: <strong>"Sesungguhnya manusia pertama yang diadili pada hari kiamat adalah orang yang mati syahid di jalan Allah. Dia didatangkan dan diperlihatkan kepadanya kenikmatan-kenikmatan (yang diberikan di dunia), lalu ia pun mengenalinya. Allah bertanya kepadanya: \'Amal apakah yang engkau lakukan dengan nikmat-nikmat itu?\' Ia menjawab: \'Aku berperang semata-mata karena Engkau sehingga aku mati syahid.\' Allah berfirman: \'Engkau dusta! Engkau berperang supaya dikatakan seorang yang gagah berani. Memang demikianlah yang telah dikatakan (tentang dirimu).\' Kemudian diperintahkan (malaikat) agar menyeret orang itu atas mukanya (tertelungkup), lalu dilemparkan ke dalam neraka. Berikutnya orang (yang diadili) adalah seorang yang menuntut ilmu dan mengajarkannya serta membaca al Qur\'an. Ia didatangkan dan diperlihatkan kepadanya kenikmatan-kenikmatannya, maka ia pun mengakuinya. Kemudian Allah menanyakannya: \'Amal apakah yang telah engkau lakukan dengan kenikmatan-kenikmatan itu?\' Ia menjawab: \'Aku menuntut ilmu dan mengajarkannya, serta aku membaca al Qur\'an hanyalah karena engkau.\' Allah berkata: \'Engkau dusta! Engkau menuntut ilmu agar dikatakan seorang \'alim (yang berilmu) dan engkau membaca al Qur\'an supaya dikatakan (sebagai) seorang qari\' (pembaca al Qur\'an yang baik). Memang begitulah yang dikatakan (tentang dirimu).\' Kemudian diperintahkan (malaikat) agar menyeret atas mukanya dan melemparkannya ke dalam neraka. Berikutnya (yang diadili) adalah orang yang diberikan kelapangan rezeki dan berbagai macam harta benda. Ia didatangkan dan diperlihatkan kepadanya kenikmatan-kenikmatan-kenikmatannya, maka ia pun mengenalinya (mengakuinya). Allah bertanya: \'Apa yang engkau telah lakukan dengan nikmat-nikmat itu?\' Dia menjawab: \'Aku tidak pernah meninggalkan shadaqah dan infaq pada jalan yang Engkau cintai, melainkan pasti aku melakukannya semata-mata karena Engkau.\' Allah berfirman: \'Engkau dusta! Engkau berbuat yang demikian itu supaya dikatakan seorang dermawan (murah hati) dan memang begitulah yang dikatakan (tentang dirimu).\' Kemudian diperintahkan (malaikat) agar menyeretnya atas mukanya dan melemparkannya ke dalam neraka.\'"</strong>',
                                            'Shahih Muslim 1905'
                                        ) +
                                        subSection('Mencari panggung — baik melalui syahid, ilmu, maupun sedekah — dengan niat agar disebut-sebut manusia, adalah bentuk <em>social climber</em> yang paling berbahaya. Hadis ini menunjukkan bahwa tiga golongan pertama yang diadili di akhirat adalah mereka yang beramal besar tetapi tidak ikhlas.')
                                    )
                                },
                                {
                                    id: '2B4',
                                    label: '4. Ingin Dianggap',
                                    icon: svgIcons.mask || svgIcons.eye,
                                    content: panelWrap('4. Ingin Dianggap',
                                        hadithBox(
                                            'حَدَّثَنَا عَبْدُ اللَّهِ بْنُ سَعِيدٍ حَدَّثَنَا أَبُو خَالِدٍ الْأَحْمَرُ عَنْ كَثِيرِ بْنِ زَيْدٍ عَنْ رُبَيْحِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ أَبِي سَعِيدٍ الْخُدْرِيِّ عَنْ أَبِيهِ عَنْ أَبِي سَعِيدٍ قَالَ خَرَجَ عَلَيْنَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَنَحْنُ نَتَذَاكَرُ الْمَسِيحَ الدَّجَّالَ فَقَالَ أَلَا أُخْبِرُكُمْ بِمَا هُوَ أَخْوَفُ عَلَيْكُمْ عِنْدِي مِنْ الْمَسِيحِ الدَّجَّالِ قَالَ قُلْنَا بَلَى فَقَالَ الشِّرْكُ الْخَفِيُّ أَنْ يَقُومَ الرَّجُلُ يُصَلِّي فَيُزَيِّنُ صَلَاتَهُ لِمَا يَرَى مِنْ نَظَرِ رَجُلٍ',
                                            'Telah menceritakan kepada kami Abdullah bin Sa\'id telah menceritakan kepada kami Abu Khalid Al Ahmar dari Katsir bin Zaid dari Rubaih bin Abdurrahman bin Abu Sa\'id Al Khudri dari Ayahnya dari Abu Sa\'id dia berkata: <strong>"Rasulullah shallallahu \'alaihi wasallam pernah keluar bersama kami, sementara kami saling mengingatkan tentang Al Masih Ad Dajjal, maka beliau bersabda: \'Maukah aku beritahukan kepada kalian tentang sesuatu yang lebih aku khawatirkan terhadap diri kalian daripada Al Masih Ad Dajjal?\' Abu Sa\'id berkata: \'Kami menjawab: Tentu.\' Beliau bersabda: \'Syirik yang tersembunyi, yaitu seseorang mengerjakan shalat dan membaguskan shalatnya dengan harapan agar ada seseorang yang memperhatikannya.\'"</strong>',
                                            'Sunan Ibnu Majah 4204'
                                        ) +
                                        subSection('Ingin dianggap sebagai orang saleh, pintar, atau dermawan dengan cara memperbagus amal di hadapan orang lain adalah syirik tersembunyi. Rasulullah SAW menyebutnya sebagai hal yang lebih beliau khawatirkan daripada fitnah Dajjal.')
                                    )
                                }
                            ]
                        }
                    ]
                },
                {
                    id: 'bab3',
                    label: 'BAB III — DAMPAK NEGATIF SOCIAL CLIMBER',
                    icon: svgIcons.fire,
                    children: [
                        {
                            id: '3A',
                            label: '1. Kekecewaan dan Ketidakbahagiaan',
                            icon: svgIcons.sad,
                            content: panelWrap('1. Kekecewaan dan Ketidakbahagiaan',
                                hadithBox(
                                    'حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ. حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ عَنْ بُرَيْدِ بْنِ عَبْدِ اللهِ، عَنْ جَدِّهِ، عَنْ أَبِي مُوسَى، عَنِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ. ح وَحَدَّثَنَا مُحَمَّدُ بْنُ الْعَلَاءِ الْهَمْدَانِيُّ (وَاللَّفْظُ لَهُ). حَدَّثَنَا أَبُو أُسَامَةَ عَنْ بُرَيْدٍ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، عَنِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ "إِنَّمَا مَثَلُ الْجَلِيسِ الصَّالِحِ وَالْجَلِيسِ السَّوْءِ، كَحَامِلِ الْمِسْكِ وَنَافِخِ الْكِيرِ. فَحَامِلُ الْمِسْكِ، إِمَّا أَنْ يَحْذِيَكَ، وَإِمَّا أَنْ تَبْتَاعَ مِنْهُ، وَإِمَّا أَنْ تَجِدَ مِنْهُ رِيحًا طَيِّبَةً. وَنَافِخُ الْكِيرِ، إِمَّا أَنْ يَحْرِقَ ثِيَابَكَ، وَإِمَّا أَنْ تَجِدَ رِيحًا خَبِيثَةً"',
                                    'Telah menceritakan kepada kami Abu Bakr bin Abu Syaibah; Telah menceritakan kepada kami Sufyan bin \'Uyainah dari Buraid bin \'Abdullah dari Kakeknya dari Abu Musa dari Nabi shallallahu \'alaihi wasallam; Demikian juga diriwayatkan dari jalur lainnya, Dan telah menceritakan kepada kami Muhammad bin Al A\'laa Al Mahdani dan lafazh ini miliknya; Telah menceritakan kepada kami Abu Usamah dari Buraid dari Abu Burdah dari Abu Musa dari Nabi shallallahu \'alaihi wasallam beliau bersabda: <strong>"Sesungguhnya perumpamaan teman dekat yang baik dan teman dekat yang buruk adalah seperti penjual minyak wangi dan tukang pandai besi. Seorang penjual minyak wangi terkadang mengoleskan wanginya kepada kamu dan terkadang kamu membelinya sebagian atau kamu dapat mencium semerbak harumnya minyak wangi itu. Sementara tukang pandai besi adakalanya ia membakar pakaian kamu ataupun kamu akan menciumi baunya yang tidak sedap."</strong>',
                                    'Shahih Muslim 2628'
                                ) +
                                subSection('Salah satu dampak negatif <em>social climber</em> adalah kekecewaan dan ketidakbahagiaan. Lingkungan sosial yang salah, yang menekankan citra dan popularitas, akan menjerumuskan seseorang ke dalam persaingan tidak sehat dan rasa hampa. Islam mengajarkan untuk memilih teman dekat yang baik, karena mereka akan memengaruhi kualitas hidup kita.')

                        {

                            label: '2. Ancaman Siksa Neraka',

                            content: panelWrap('2. Ancaman Siksa Neraka',

                },
                {
                    id: 'tentang-penulis',
                    label: 'Tentang Penulis',
                    icon: svgIcons.user,
                    content: [
                        '<h2 class="panel-title">Tentang Penulis</h2>',
                        '<div class="author-card">',
                        '<div class="author-name">ADELIA LUTFIANI</div>',
                        '<div class="author-tagline">Penulis E-Book Hadis Tematik · Social Climber dalam Perspektif Hadis</div>',

            var topMenuContainer = document.getElementById('topMenu');
            var menuContainer = document.getElementById('menuContainer');
            var extraMenuContainer = document.getElementById('extraMenu');
            var panelContainer = document.getElementById('panelContainer');
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('overlay');
            var hamburger = document.getElementById('hamburgerBtn');

            function renderTopMenu() {
                var html = '';
                topMenuData.forEach(function(item) {
                    html += '<div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 2px solid rgba(43,79,140,0.08);">';
                    html += '<button class="extra-link" data-panel="' + item.id + '">' +
                        '<span class="icon">' + item.icon + '</span> ' + item.label +
                        '</button>';
                    html += '</div>';
                });
                topMenuContainer.innerHTML = html;
            }

            function renderMenuItems(items) {
                var html = '';
                items.forEach(function(item) {
                    if (item.children) {
                        html += '<div class="menu-section">';
                        html += '<button class="menu-head" data-toggle="' + item.id + '" aria-expanded="false">' +
                            '<span class="icon">' + (item.icon || svgIcons.folder) + '</span> ' + item.label +
                            '<span class="arrow">▶</span>' +
                            '</button>';
                        html += '<ul class="sub-menu">';
                        html += renderMenuItems(item.children);
                        html += '</ul></div>';
                    } else {
                        html += '<li><button class="sub-link" data-panel="' + item.id + '">' +
                            '<span class="sub-icon">' + (item.icon || svgIcons.target) + '</span> ' + item.label +
                            '</button></li>';
                    }
                });
                return html;
            }

            function renderMenu() {
                var html = '';
                menuData.forEach(function(item) {
                    html += '<div class="menu-section">';
                    html += '<button class="menu-head open" data-toggle="' + item.id + '" aria-expanded="true">' +
                        '<span class="icon">' + (item.icon || svgIcons.folder) + '</span> ' + item.label +
                        '<span class="arrow">▶</span>' +
                        '</button>';
                    html += '<ul class="sub-menu open">';
                    html += renderMenuItems(item.children);
                    html += '</ul></div>';
                });
                menuContainer.innerHTML = html;
            }

            function renderExtraMenu() {
                var html = '';
                extraData.forEach(function(item) {
                    html += '<button class="extra-link" data-panel="' + item.id + '">' +
                        '<span class="icon">' + item.icon + '</span> ' + item.label +
                        '</button>';
                });
                extraMenuContainer.innerHTML = html;
            }

            function renderPanels() {
                var html = '';
                topMenuData.forEach(function(item) {
                    html += '<div class="content-panel" id="panel-' + item.id + '">' + item.content + '</div>';
                });
                function collectPanels(items) {
                    items.forEach(function(item) {
                        if (item.children) {
                            collectPanels(item.children);
                        } else {
                            html += '<div class="content-panel" id="panel-' + item.id + '">' + item.content + '</div>';
                        }
                    });
                }
                collectPanels(menuData);
                extraData.forEach(function(item) {
                    html += '<div class="content-panel" id="panel-' + item.id + '">' + item.content + '</div>';
                });
                panelContainer.innerHTML = html;
            }

            function showPanel(panelId, fromSubLink) {
                if (fromSubLink === undefined) fromSubLink = true;
                document.querySelectorAll('.content-panel').forEach(function(el) { el.classList.remove('active'); });
                var panel = document.getElementById('panel-' + panelId);
                if (panel) panel.classList.add('active');
                document.querySelectorAll('.sub-link, .extra-link').forEach(function(el) { el.classList.remove('active'); });
                var link = document.querySelector('.sub-link[data-panel="' + panelId + '"], .extra-link[data-panel="' + panelId + '"]');
                if (link) link.classList.add('active');
                if (window.innerWidth <= 991 && fromSubLink) closeSidebar();
                window.scrollTo(0, 0);
            }

            function toggleSection(btn) {
                var sub = btn.nextElementSibling;
                if (!sub) return;
                var isOpen = sub.classList.contains('open');
                if (isOpen) {
                    sub.classList.remove('open');
                    btn.classList.remove('open');
                    btn.setAttribute('aria-expanded', 'false');
                } else {
                    sub.classList.add('open');
                    btn.classList.add('open');
                    btn.setAttribute('aria-expanded', 'true');
                }
            }

            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }
            function toggleSidebar() {
                if (sidebar.classList.contains('open')) closeSidebar();
                else openSidebar();
            }

            function init() {
                renderPanels();
                renderTopMenu();
                renderMenu();
                renderExtraMenu();

                topMenuContainer.addEventListener('click', function(e) {
                    var target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        var panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                    }
                });

                menuContainer.addEventListener('click', function(e) {
                    var target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('menu-head')) {
                        e.stopPropagation();
                        toggleSection(target);
                        return;
                    }
                    if (target.classList.contains('sub-link')) {
                        e.preventDefault();
                        var panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                        return;
                    }
                });

                extraMenuContainer.addEventListener('click', function(e) {
                    var target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        var panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                    }
                });

                if (topMenuData.length > 0) {
                    showPanel(topMenuData[0].id, false);
                }

                hamburger.addEventListener('click', toggleSidebar);
                overlay.addEventListener('click', closeSidebar);
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 991) closeSidebar();
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
                });
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
