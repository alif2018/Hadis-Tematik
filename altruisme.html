<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hadis Tematik Altruisme Religius</title>
    <base target="_self" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    <style>
        /* ----- RESET & GLOBAL ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f6f0;
            color: #1e2b3a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ----- VARIABLES ----- */
        :root {
            --primary: #2b4f8c;
            --primary-light: #3a6bb0;
            --primary-dark: #1d3a66;
            --gold: #c9a84c;
            --gold-light: #e0c66e;
            --gold-dark: #a8892f;
            --bg-body: #f8f6f0;
            --bg-card: #ffffff;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 300px;
            --header-height: 72px;
        }

        /* ----- HEADER ----- */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: var(--header-height);
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 12px rgba(43, 79, 140, 0.25);
        }
        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-header .brand img {
            height: 44px;
            width: auto;
            border-radius: 6px;
            background: #fff;
            padding: 4px;
            object-fit: contain;
        }
        .app-header .brand .title-group {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .app-header .brand .title-group h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .app-header .brand .title-group .author {
            font-size: 0.8rem;
            color: var(--gold-light);
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .app-header .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 4px;
            border-radius: 6px;
            transition: background var(--transition);
        }
        .app-header .hamburger:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .app-header .hamburger span {
            display: block;
            width: 26px;
            height: 2.5px;
            background: #fff;
            border-radius: 4px;
            transition: var(--transition);
        }

        /* ----- LAYOUT ----- */
        .app-layout {
            display: flex;
            flex: 1;
            position: relative;
        }

        /* ----- SIDEBAR (kanan) ----- */
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-left: 1px solid rgba(43, 79, 140, 0.10);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.04);
            height: calc(100vh - var(--header-height));
            position: sticky;
            top: var(--header-height);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 10px 30px;
            flex-shrink: 0;
            transition: transform var(--transition);
            z-index: 900;
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: #f0ede7;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 8px;
        }

        /* menu items */
        .menu-section {
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(43, 79, 140, 0.06);
        }
        .menu-section:last-of-type {
            border-bottom: none;
        }
        .menu-section .menu-head {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 14px;
            background: transparent;
            border: none;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--primary-dark);
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
            position: relative;
        }
        .menu-section .menu-head:hover {
            background: rgba(43, 79, 140, 0.06);
        }
        .menu-section .menu-head .icon {
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .menu-section .menu-head .arrow {
            margin-left: auto;
            font-size: 0.7rem;
            transition: transform var(--transition);
            color: var(--gold-dark);
        }
        .menu-section .menu-head.open .arrow {
            transform: rotate(90deg);
        }

        .sub-menu {
            list-style: none;
            padding: 0;
            margin: 0 0 6px 0;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s ease, opacity 0.25s ease;
            opacity: 0;
        }
        .sub-menu.open {
            max-height: 800px;
            opacity: 1;
        }
        .sub-menu li {
            margin: 0;
        }
        .sub-menu li .sub-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px 8px 38px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 450;
            color: #2d3f54;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .sub-menu li .sub-link:hover {
            background: rgba(43, 79, 140, 0.07);
            color: var(--primary);
        }
        .sub-menu li .sub-link.active {
            background: var(--primary);
            color: #fff;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(43, 79, 140, 0.25);
        }
        .sub-menu li .sub-link .sub-icon {
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .sub-menu li .sub-link.active .sub-icon {
            opacity: 1;
        }

        /* menu tambahan (kata pengantar, daftar pustaka, penulis) */
        .extra-menu {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 2px solid rgba(43, 79, 140, 0.08);
        }
        .extra-menu .extra-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--primary-dark);
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .extra-menu .extra-link:hover {
            background: rgba(43, 79, 140, 0.06);
        }
        .extra-menu .extra-link.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(43, 79, 140, 0.25);
        }
        .extra-menu .extra-link .icon {
            font-size: 1.1rem;
        }

        /* ----- MAIN CONTENT ----- */
        .main-content {
            flex: 1;
            padding: 32px 40px 60px;
            min-width: 0;
            background: var(--bg-body);
        }

        .content-panel {
            display: none;
            animation: fadeUp 0.35s ease;
        }
        .content-panel.active {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content-panel .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 8px;
            border-bottom: 3px solid var(--gold);
            padding-bottom: 10px;
            display: inline-block;
        }
        .content-panel .panel-sub {
            font-size: 0.95rem;
            color: #5e6f82;
            margin-bottom: 24px;
        }
        .content-panel .hadith-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin: 18px 0 22px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--gold);
        }
        .content-panel .hadith-box .arabic {
            font-size: 1.15rem;
            line-height: 1.9;
            color: #1e2b3a;
            direction: rtl;
            font-family: 'Times New Roman', 'Traditional Arabic', serif;
            margin-bottom: 12px;
            padding: 6px 0;
            word-wrap: break-word;
        }
        .content-panel .hadith-box .translation {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #2d3f54;
            border-top: 1px dashed rgba(43, 79, 140, 0.12);
            padding-top: 12px;
        }
        .content-panel .hadith-box .source {
            display: block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--gold-dark);
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .content-panel .sub-section {
            margin-top: 28px;
        }
        .content-panel .sub-section h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .content-panel .sub-section p {
            line-height: 1.7;
            color: #2d3f54;
            margin-bottom: 10px;
        }

        /* daftar pustaka & profil penulis di dalam panel */
        .bibliography {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 2px solid rgba(43, 79, 140, 0.10);
        }
        .bibliography h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--primary-dark);
            margin-bottom: 14px;
        }
        .bibliography ul {
            list-style: none;
            padding: 0;
        }
        .bibliography ul li {
            padding: 6px 0 6px 20px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #2d3f54;
            border-bottom: 1px solid rgba(43, 79, 140, 0.05);
            text-indent: -20px;
            padding-left: 30px;
        }
        .bibliography ul li::before {
            content: "•";
            color: var(--gold);
            font-weight: 700;
            margin-right: 8px;
        }

        .profil-penulis {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 2px solid rgba(43, 79, 140, 0.10);
        }
        .profil-penulis h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--primary-dark);
            margin-bottom: 14px;
        }
        .profil-penulis p {
            line-height: 1.8;
            color: #2d3f54;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .profil-penulis .penulis-nama {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
        }

        /* ----- OVERLAY (mobile) ----- */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 850;
            backdrop-filter: blur(2px);
            transition: opacity var(--transition);
        }
        .overlay.active {
            display: block;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 991px) {
            .app-header .hamburger {
                display: flex;
            }
            .sidebar {
                position: fixed;
                top: var(--header-height);
                right: 0;
                height: calc(100vh - var(--header-height));
                transform: translateX(100%);
                box-shadow: -8px 0 30px rgba(0, 0, 0, 0.10);
                border-left: none;
                width: 290px;
                padding: 12px 8px 30px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                padding: 20px 18px 40px;
            }
            .content-panel .panel-title {
                font-size: 1.5rem;
            }
            .app-header .brand .title-group h1 {
                font-size: 1rem;
            }
            .app-header .brand img {
                height: 36px;
            }
            .content-panel .hadith-box {
                padding: 16px 18px;
            }
            .content-panel .hadith-box .arabic {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            :root {
                --header-height: 64px;
            }
            .app-header {
                padding: 0 14px;
            }
            .app-header .brand .title-group h1 {
                font-size: 0.85rem;
            }
            .app-header .brand .title-group .author {
                font-size: 0.7rem;
            }
            .sidebar {
                width: 265px;
            }
            .main-content {
                padding: 14px 12px 30px;
            }
            .content-panel .panel-title {
                font-size: 1.25rem;
            }
            .sub-menu li .sub-link {
                padding: 7px 10px 7px 28px;
                font-size: 0.8rem;
            }
            .menu-section .menu-head {
                padding: 10px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="brand">
            <img src="logo-pshd.jpg" alt="Logo" />
            <div class="title-group">
                <h1>Hadis Tematik Altruisme Religius</h1>
                <span class="author">Penyusun: Atikah Khoerunnisa & M. Alif</span>
            </div>
        </div>
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
    </header>

    <!-- ===== LAYOUT ===== -->
    <div class="app-layout">

        <!-- OVERLAY -->
        <div class="overlay" id="overlay"></div>

        <!-- ===== SIDEBAR ===== -->
        <nav class="sidebar" id="sidebar" role="navigation" aria-label="Daftar isi">
            <div id="menuContainer"></div>
            <div class="extra-menu" id="extraMenu"></div>
        </nav>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main-content" id="mainContent">
            <div id="panelContainer"></div>
        </main>

    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DATA KONTEN ----------
            // struktur: setiap heading1 memiliki heading2 → panel
            const menuData = [{
                id: 'bab1',
                label: 'BAB I — Motiv-Motiv Altruisme',
                icon: '🌟',
                children: [{
                    id: '1a',
                    label: 'A. Empati',
                    icon: '❤️',
                    content: `
                <h2 class="panel-title">A. Empati</h2>
                <p class="panel-sub">Landasan altruisme dalam hadis: ketulusan dan kasih sayang.</p>

                <div class="sub-section">
                  <h3>1. Ketulusan tanpa pamrih</h3>
                  <div class="hadith-box">
                    <div class="arabic">عَنْ يَزِيدَ بْنِ الْأَصَمِّ ، عَنْ أَبِي هُرَيْرَةَ . قَالَ : قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ "إِنَّ اللَّهَ لَا يَنظُرُ إِلَى صُوَرِكُم وَأَمْوَالِكُم . وَلَكِن يَنظُرُ إِلَى قُلُوبِكُم وَأَعْمَالِكُم</div>
                    <div class="translation">“Allah tidak melihat pada rupa dan harta kalian, akan tetapi Dia melihat pada hati dan amal kalian.”</div>
                    <span class="source">(Sahih Muslim 2564)</span>
                  </div>
                </div>

                <div class="sub-section">
                  <h3>2. Kasih sayang sesama muslim</h3>
                  <div class="hadith-box">
                    <div class="arabic">حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ مُبَرِّ . حَدَّثَنَا أَبِي . حَدَّثَنَا رَّكِيرَاءُ عَنْ الشَّعْيِ ، عَنِ النُّعْمَانِ بْنِ بَشِيرِ . قَالَ : قَالَ رَسُولُ اللَّهِ صلى اللَّهِ عليه وسلم "مثل المؤمنين في توادهم وتراحهم وتعاطفهم، مثل الجسد. إذا اشتكى منه عضو تداعى له سائر الجسد بالسهر والحمى</div>
                    <div class="translation">“Perumpamaan orang-orang beriman dalam hal saling mencintai, mengasihi, dan menyayangi bagaikan satu tubuh. Apabila salah satu anggotanya sakit, maka seluruh tubuh akan merasakan demam dan tidak bisa tidur.”</div>
                    <span class="source">(Sahih Muslim, dari Nu'man bin Basyir)</span>
                  </div>
                  <div class="hadith-box">
                    <div class="arabic">حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلَاءِ: حَدَّثَنَا أَبُو أُسَامَةَ عَنْ بُرَيْدٍ عَنْ أَبِي بُرْدَةَ عَنْ أَبِي مُوسَى رَضِيَ اللَّهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: «الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا» وَشَبَّكَ بَيْنَ أَصَابِعِهِ</div>
                    <div class="translation">“Seorang mukmin bagi mukmin lainnya ibarat satu bangunan, sebagian menguatkan sebagian yang lain.” Beliau menyatukan jari-jarinya.</div>
                    <span class="source">(Sahih Bukhari 2446)</span>
                  </div>
                </div>
              `
                }, {
                    id: '1b',
                    label: 'B. Norma Sosial',
                    icon: '🤝',
                    content: `
                <h2 class="panel-title">B. Norma Sosial</h2>
                <p class="panel-sub">Solidaritas, mencegah kezaliman, balas budi, dan kesadaran moral.</p>

                <div class="sub-section">
                  <h3>1. Solidaritas sosial</h3>
                  <div class="hadith-box">
                    <div class="arabic">حَدَّثَنَا يَحْيَى بْنُ يَحْيَى التَّمِيمِيُّ وَأَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ وَمُحَمَّدُ بْنُ الْعَلَاءِ الْمَدَائِنِيُّ وَاللَّفْظُ لِيَحْيَى قَالَ يَحْيَى: أَخْبَرَنَا. وَقَالَ الْآخَرَان: حَدَّثَنَا (أَبُو مُعَاوِيَةَ عَنِ الْأَعْمَشِ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ. قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ "مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا، نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ. وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ، يَسَّرَ اللَّهُ عَلَيْهِ فِي الدُّنْيَا وَالْآخِرَةِ. وَمَنْ سَتَرَ مُسْلِمًا، سَتَرَهُ اللَّهُ فِي الدُّنْيَا وَالْآخِرَةِ. وَاللَّهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ. وَمَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا، سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ. وَمَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللَّهِ، يَتْلُونَ كِتَابَ اللَّهِ، وَيَتَدَارَسُونَهُ بَيْنَهُمْ، إِلَّا نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ، وَغَشِيَتْهُمُ الرَّحْمَةُ، وَحَفَّتْهُمُ الْمَلَائِكَةُ، وَذَكَرَهُمُ اللَّهُ فِيمَنْ عِنْدَهُ. وَمَنْ بَطَّأَ بِهِ عَمَلُهُ، لَمْ يُسْرِعْ بِهِ نَسَبُهُ</div>

                  <div class="hadith-box">

                    <div class="translation">Rasulullah keluar pada hari Idul adha atau Idul fitri menuju mushalla, lalu memberi nasihat dan memerintahkan sedekah. Beliau bersabda, “Wahai manusia, bersedekahlah!” Lalu beliau berjalan melewati para wanita dan bersabda, “Wahai kaum wanita, bersedekahlah! Karena sesungguhnya aku melihat kalian adalah penghuni neraka yang paling banyak.” Mereka bertanya, “Mengapa demikian, wahai Rasulullah?” Beliau menjawab, “Kalian banyak melaknat dan mengingkari kebaikan suami. Aku tidak pernah melihat orang yang kurang akal dan agamanya, yang lebih mampu menghilangkan akal seorang laki-laki yang teguh daripada salah seorang di antara kalian, wahai kaum wanita!” Kemudian beliau kembali. Setelah sampai di rumah, Zainab, istri Ibnu Mas’ud, datang meminta izin. Ia berkata, “Wahai Nabi Allah, engkau memerintahkan sedekah, dan aku mempunyai perhiasan, aku ingin menyedekahkannya, tetapi Ibnu Mas’ud mengira bahwa dia dan anak-anaknya lebih berhak.” Nabi bersabda, “Benar Ibnu Mas’ud. Suamimu dan anak-anakmu lebih berhak untuk diberi sedekah darimu.”</div>
                    <span class="source">(Sahih Bukhari 1393)</span>

            // ---------- DOM REFS ----------
            const menuContainer = document.getElementById('menuContainer');
            const extraMenuContainer = document.getElementById('extraMenu');
            const panelContainer = document.getElementById('panelContainer');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const hamburger = document.getElementById('hamburgerBtn');

            let activePanelId = null;

            // ---------- RENDER MENU ----------
            function renderMenu() {
                let html = '';
                let firstSubId = null;

                menuData.forEach((section, idx) => {
                    const sectionId = section.id;
                    const isFirst = (idx === 0);
                    html += `<div class="menu-section">`;
                    html += `<button class="menu-head ${isFirst ? 'open' : ''}" data-section="${sectionId}" aria-expanded="${isFirst}">
                        <span class="icon">${section.icon}</span>
                        ${section.label}
                        <span class="arrow">▶</span>
                    </button>`;
                    html += `<ul class="sub-menu ${isFirst ? 'open' : ''}">`;

                    section.children.forEach((child, ci) => {
                        const subId = child.id;
                        if (isFirst && ci === 0) firstSubId = subId;
                        html += `<li><button class="sub-link" data-panel="${subId}">
                            <span class="sub-icon">${child.icon || '▸'}</span>
                            ${child.label}
                        </button></li>`;
                    });

                    html += `</ul></div>`;
                });

                menuContainer.innerHTML = html;
                return firstSubId;
            }

            // ---------- RENDER EXTRA MENU ----------
            function renderExtraMenu() {
                let html = '';
                extraData.forEach((item) => {
                    html += `<button class="extra-link" data-panel="${item.id}">
                        <span class="icon">${item.icon}</span>
                        ${item.label}
                    </button>`;
                });
                extraMenuContainer.innerHTML = html;
            }

            // ---------- RENDER PANELS ----------
            function renderPanels() {
                let html = '';
                // panels dari menuData
                menuData.forEach(section => {
                    section.children.forEach(child => {
                        html += `<div class="content-panel" id="panel-${child.id}">
                            ${child.content}
                        </div>`;
                    });
                });
                // panels ekstra
                extraData.forEach(item => {
                    html += `<div class="content-panel" id="panel-${item.id}">
                        ${item.content}
                    </div>`;
                });
                panelContainer.innerHTML = html;
            }

            // ---------- NAVIGATION ----------
            function showPanel(panelId, fromSubLink = true) {
                // hide all panels
                document.querySelectorAll('.content-panel').forEach(el => el.classList.remove('active'));
                // show target
                const panel = document.getElementById('panel-' + panelId);
                if (panel) panel.classList.add('active');

                // update active class on sub-links (menuData)
                document.querySelectorAll('.sub-link').forEach(el => el.classList.remove('active'));
                const activeLink = document.querySelector(`.sub-link[data-panel="${panelId}"]`);
                if (activeLink) activeLink.classList.add('active');

                // update active class on extra links
                document.querySelectorAll('.extra-link').forEach(el => el.classList.remove('active'));
                const extraLink = document.querySelector(`.extra-link[data-panel="${panelId}"]`);
                if (extraLink) extraLink.classList.add('active');

                activePanelId = panelId;

                // close sidebar on mobile
                if (window.innerWidth <= 991 && fromSubLink) {
                    closeSidebar();
                }
            }

            // ---------- ACCORDION TOGGLE ----------
            function toggleSection(headBtn) {
                const sub = headBtn.nextElementSibling;
                const isOpen = sub.classList.contains('open');
                if (isOpen) {
                    sub.classList.remove('open');
                    headBtn.classList.remove('open');
                    headBtn.setAttribute('aria-expanded', 'false');
                } else {
                    sub.classList.add('open');
                    headBtn.classList.add('open');
                    headBtn.setAttribute('aria-expanded', 'true');
                }
            }

            // ---------- SIDEBAR TOGGLE (mobile) ----------
            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function toggleSidebar() {
                if (sidebar.classList.contains('open')) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            }

            // ---------- INIT ----------
            function init() {
                renderPanels();
                const firstSub = renderMenu();
                renderExtraMenu();

                // event delegation: menu clicks (menuData)
                menuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;

                    if (target.classList.contains('menu-head')) {
                        e.stopPropagation();
                        toggleSection(target);
                        return;
                    }

                    if (target.classList.contains('sub-link')) {
                        e.preventDefault();
                        const panelId = target.dataset.panel;
                        if (panelId) {
                            showPanel(panelId, true);
                        }
                        return;
                    }
                });

                // event delegation: extra menu
                extraMenuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        const panelId = target.dataset.panel;
                        if (panelId) {
                            showPanel(panelId, true);
                        }
                    }
                });

                // show first panel (kata pengantar atau sub pertama)
                // default: tampilkan kata pengantar jika ada, atau sub pertama
                if (extraData.length > 0) {
                    showPanel(extraData[0].id, false);
                } else if (firstSub) {
                    showPanel(firstSub, false);
                } else {
                    // fallback
                    if (menuData.length && menuData[0].children.length) {
                        showPanel(menuData[0].children[0].id, false);
                    }
                }

                // open first section if needed
                const firstSection = document.querySelector('.menu-section:first-child .menu-head');
                const firstSubMenu = firstSection ? firstSection.nextElementSibling : null;
                if (firstSection && firstSubMenu && !firstSubMenu.classList.contains('open')) {
                    firstSection.classList.add('open');
                    firstSubMenu.classList.add('open');
                    firstSection.setAttribute('aria-expanded', 'true');
                }

                // hamburger
                hamburger.addEventListener('click', toggleSidebar);

                // overlay click closes sidebar
                overlay.addEventListener('click', closeSidebar);

                // close sidebar on resize to desktop
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 991) {
                        closeSidebar();
                    }
                });

                // keyboard: escape closes sidebar
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && sidebar.classList.contains('open')) {
                        closeSidebar();
                    }
                });
            }

            // run when DOM ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
