        :root {
            --primary: #2b4f8c;
            --gold: #c9a84c;

            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 12px rgba(43,79,140,0.25);
        }
        .app-header .brand {

            align-items: center;
            gap: 14px;
        }
        .app-header .brand img {

            width: auto;
            border-radius: 6px;
            background: #fff;
            padding: 4px;

        .app-header .brand .title-group {
            display: flex;
            flex-direction: column;
            line-height: 1.2;

        .app-header .brand .title-group h1 {

            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;

        .app-header .brand .title-group .author {

            border: none;

        .app-header .hamburger:hover { background: rgba(255,255,255,0.1); }

        .sidebar {

            background: #fff;

            box-shadow: -4px 0 20px rgba(0,0,0,0.04);
            height: calc(100vh - var(--header-height));
            position: sticky;
            top: var(--header-height);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 10px 30px;
            flex-shrink: 0;
            transition: transform var(--transition);
            z-index: 900;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: #f0ede7; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 8px; }

        .menu-section { margin-bottom: 4px; border-bottom: 1px solid rgba(43,79,140,0.06); }
        .menu-section:last-of-type { border-bottom: none; }
        .menu-head {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 14px;
            background: transparent;
            border: none;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
        }
        .menu-head:hover { background: rgba(43,79,140,0.06); }
        .menu-head .icon { 
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            fill: var(--primary);
        }
        .menu-head .arrow {
            margin-left: auto;
            font-size: 0.7rem;
            transition: transform var(--transition);
            color: var(--gold-dark);
        }
        .menu-head.open .arrow { transform: rotate(90deg); }

        .sub-menu {
            list-style: none;
            padding: 0;
            margin: 0 0 6px 0;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s ease, opacity 0.25s ease;
            opacity: 0;
        }
        .sub-menu.open { max-height: 1200px; opacity: 1; }
        .sub-menu li { margin: 0; }
        .sub-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px 8px 38px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 450;
            color: #2d3f54;
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .sub-link:hover { background: rgba(43,79,140,0.07); color: var(--primary); }
        .sub-link.active {
            background: var(--primary);
            color: #fff;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(43,79,140,0.25);
        }
        .sub-link .sub-icon { 
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            fill: #2d3f54;
            opacity: 0.8; 
        }
        .sub-link:hover .sub-icon { fill: var(--primary); }
        .sub-link.active .sub-icon { fill: #fff; opacity: 1; }

            padding-top: 12px;
            border-top: 2px solid rgba(43,79,140,0.08);

        .extra-link {

            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;

            color: var(--primary);

            background: transparent;
            width: 100%;
            text-align: left;

            color: var(--primary);

            padding-top: 20px;
            border-top: 2px solid rgba(43,79,140,0.10);
        }
        .bibliography h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 14px;
        }

        .bibliography ul li {
            padding: 6px 0 6px 20px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #2d3f54;
            border-bottom: 1px solid rgba(43,79,140,0.05);
            text-indent: -20px;
            padding-left: 30px;
        }
        .bibliography ul li::before {
            content: "•";
            color: var(--gold);
            font-weight: 700;
            margin-right: 8px;
        }
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .overlay.active { display: block; }

                top: var(--header-height);
                right: 0;

                border-left: none;
                width: 290px;
                padding: 12px 8px 30px;

            .sidebar.open { transform: translateX(0); }
            .main-content { padding: 20px 18px 40px; }
            .panel-title { font-size: 1.5rem; }
            .app-header .brand .title-group h1 { font-size: 1rem; }
            .app-header .brand img { height: 36px; }
            .hadith-box { padding: 16px 18px; }
            .hadith-box .arabic { font-size: 1rem; }
        }

            :root { --header-height: 64px; }
            .app-header { padding: 0 14px; }
            .app-header .brand .title-group h1 { font-size: 0.85rem; }
            .app-header .brand .title-group .author { font-size: 0.7rem; }
            .sidebar { width: 265px; }
            .main-content { padding: 14px 12px 30px; }
            .panel-title { font-size: 1.25rem; }
            .sub-link { padding: 7px 10px 7px 28px; font-size: 0.8rem; }
            .menu-head { padding: 10px 12px; font-size: 0.85rem; }

</head>

            // ===== RENDER =====
            const topMenuContainer = document.getElementById('topMenu');
            const menuContainer = document.getElementById('menuContainer');
            const extraMenuContainer = document.getElementById('extraMenu');
            const panelContainer = document.getElementById('panelContainer');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const hamburger = document.getElementById('hamburgerBtn');

            let activePanelId = null;

            function renderTopMenu() {
                let html = '';
                topMenuData.forEach(item => {
                    html += `<div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 2px solid rgba(43,79,140,0.08);">`;
                    html += `<button class="extra-link" data-panel="${item.id}">
                        <span class="icon">${item.icon}</span> ${item.label}
                    </button>`;
                    html += `</div>`;
                });
                topMenuContainer.innerHTML = html;
            }

            // Fungsi render menu recursively
            function renderMenuItems(items, depth) {
                let html = '';
                items.forEach(item => {
                    if (item.children) {
                        const isTop = depth === 0;
                        html += `<div class="menu-section">`;
                        html += `<button class="menu-head ${isTop ? 'open' : ''}" data-toggle="${item.id}" aria-expanded="${isTop}">
                            <span class="icon">${item.icon || svgIcons.folder}</span> ${item.label}
                            <span class="arrow">▶</span>
                        </button>`;
                        html += `<ul class="sub-menu ${isTop ? 'open' : ''}">`;
                        html += renderMenuItems(item.children, depth + 1);
                        html += `</ul></div>`;
                    } else {
                        html += `<li><button class="sub-link" data-panel="${item.id}">
                            <span class="sub-icon">${item.icon || svgIcons.target}</span> ${item.label}
                        </button></li>`;
                    }
                });
                return html;
            }

            function renderMenu() {
                let html = '';
                menuData.forEach(item => {
                    html += `<div class="menu-section">`;
                    html += `<button class="menu-head open" data-toggle="${item.id}" aria-expanded="true">
                        <span class="icon">${item.icon || svgIcons.folder}</span> ${item.label}
                        <span class="arrow">▶</span>
                    </button>`;
                    html += `<ul class="sub-menu open">`;
                    html += renderMenuItems(item.children, 1);
                    html += `</ul></div>`;
                });
                menuContainer.innerHTML = html;
            }

            function renderExtraMenu() {
                let html = '';
                extraData.forEach(item => {
                    html += `<button class="extra-link" data-panel="${item.id}">
                        <span class="icon">${item.icon}</span> ${item.label}
                    </button>`;
                });
                extraMenuContainer.innerHTML = html;
            }

            function renderPanels() {
                let html = '';
                topMenuData.forEach(item => {
                    html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                });
                function collectPanels(items) {
                    items.forEach(item => {
                        if (item.children) {
                            collectPanels(item.children);
                        } else {
                            html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                        }
                    });
                }
                collectPanels(menuData);
                extraData.forEach(item => {
                    html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                });
                panelContainer.innerHTML = html;
            }

            function showPanel(panelId, fromSubLink = true) {
                document.querySelectorAll('.content-panel').forEach(el => el.classList.remove('active'));
                const panel = document.getElementById('panel-' + panelId);
                if (panel) panel.classList.add('active');
                document.querySelectorAll('.sub-link, .extra-link').forEach(el => el.classList.remove('active'));
                const link = document.querySelector(`.sub-link[data-panel="${panelId}"], .extra-link[data-panel="${panelId}"]`);
                if (link) link.classList.add('active');
                activePanelId = panelId;
                if (window.innerWidth <= 991 && fromSubLink) closeSidebar();
            }

            function toggleSection(btn) {
                const sub = btn.nextElementSibling;
                if (!sub) return;
                const isOpen = sub.classList.contains('open');
                if (isOpen) {
                    sub.classList.remove('open');
                    btn.classList.remove('open');
                    btn.setAttribute('aria-expanded', 'false');
                } else {
                    sub.classList.add('open');
                    btn.classList.add('open');
                    btn.setAttribute('aria-expanded', 'true');
                }
            }

            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function toggleSidebar() {
                if (sidebar.classList.contains('open')) closeSidebar();
                else openSidebar();
            }

            function init() {
                renderPanels();
                renderTopMenu();
                renderMenu();
                renderExtraMenu();

                // Event delegation untuk menu atas
                topMenuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                    }
                });

                menuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('menu-head')) {
                        e.stopPropagation();
                        toggleSection(target);
                        return;
                    }
                    if (target.classList.contains('sub-link')) {
                        e.preventDefault();
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                        return;
                    }
                });

                extraMenuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                    }
                });

                // Default: tampilkan kata pengantar
                if (topMenuData.length > 0) {
                    showPanel(topMenuData[0].id, false);
                }

                hamburger.addEventListener('click', toggleSidebar);
                overlay.addEventListener('click', closeSidebar);
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 991) closeSidebar();
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
                });
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
