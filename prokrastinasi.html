        html { scroll-behavior: smooth; }

            background: #f8f6f0;
            color: #1e2b3a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;

        :root {
            --primary: #2b4f8c;
            --gold: #c9a84c;
            --gold-light: #e0c66e;
            --gold-dark: #a8892f;
            --bg-body: #f8f6f0;
            --bg-card: #ffffff;

            --radius: 12px;

            --sidebar-width: 320px;
            --header-height: 72px;
            --olive: #6b7040;

        .app-header {
            position: sticky; top: 0; z-index: 1000;
            height: var(--header-height);
            background: var(--primary); color: #fff;
            display: flex; align-items: center; justify-content: space-between;

            box-shadow: 0 2px 12px rgba(43,79,140,0.25);
        }
        .app-header .brand { display: flex; align-items: center; gap: 14px; }
        .app-header .brand img {
            height: 44px; width: auto; border-radius: 6px;
            background: #fff; padding: 4px; object-fit: contain;
        }
        .app-header .brand .title-group { display: flex; flex-direction: column; line-height: 1.2; }
        .app-header .brand .title-group h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px;
        }
        .app-header .brand .title-group .author {
            font-size: 0.78rem; color: var(--gold-light); font-weight: 400; letter-spacing: 0.3px;
        }
        .app-header .hamburger {
            display: none; flex-direction: column; gap: 5px;
            background: transparent; border: none; cursor: pointer;
            padding: 6px 4px; border-radius: 6px;
        }
        .app-header .hamburger:hover { background: rgba(255,255,255,0.1); }
        .app-header .hamburger span {
            display: block; width: 26px; height: 2.5px; background: #fff; border-radius: 4px;
        }
        .app-layout { display: flex; flex: 1; position: relative; }
        .sidebar {
            width: var(--sidebar-width); background: #fff;
            border-left: 1px solid rgba(43,79,140,0.10);
            box-shadow: -4px 0 20px rgba(0,0,0,0.04);
            height: calc(100vh - var(--header-height));
            position: sticky; top: var(--header-height);
            overflow-y: auto; overflow-x: hidden;
            padding: 16px 10px 30px;
            flex-shrink: 0;
            transition: transform var(--transition);
            z-index: 900;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: #f0ede7; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 8px; }

        .menu-section:last-of-type { border-bottom: none; }
        .menu-head {
            display: flex; align-items: center; gap: 10px;
            width: 100%; padding: 12px 14px;
            background: transparent; border: none; border-radius: var(--radius);
            font-family: 'Inter', sans-serif; font-size: 0.88rem; font-weight: 600;
            color: var(--primary); cursor: pointer; transition: all var(--transition);
            text-align: left;
        }
        .menu-head:hover { background: rgba(43,79,140,0.06); }
        .menu-head .icon {
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; width: 20px; height: 20px; fill: var(--primary);
        }
        .menu-head .arrow {
            margin-left: auto; font-size: 0.7rem;
            transition: transform var(--transition); color: var(--gold-dark);
        }
        .menu-head.open .arrow { transform: rotate(90deg); }
        .sub-menu {
            list-style: none; padding: 0; margin: 0 0 6px 0;
            overflow: hidden; max-height: 0;
            transition: max-height 0.4s ease, opacity 0.25s ease; opacity: 0;
        }
        .sub-menu.open { max-height: 3000px; opacity: 1; }
        .sub-menu li { margin: 0; }
        .sub-link {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 14px 8px 34px;
            font-family: 'Inter', sans-serif; font-size: 0.83rem; font-weight: 450;
            color: #2d3f54; border-radius: 8px; cursor: pointer;
            transition: all var(--transition); border: none; background: transparent;
            width: 100%; text-align: left;
        }
        .sub-link:hover { background: rgba(43,79,140,0.07); color: var(--primary); }
        .sub-link.active {
            background: var(--primary); color: #fff; font-weight: 500;
            box-shadow: 0 4px 12px rgba(43,79,140,0.25);
        }
        .sub-link .sub-icon {
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; width: 16px; height: 16px;
            fill: #2d3f54; opacity: 0.8;
        }
        .sub-link:hover .sub-icon { fill: var(--primary); }
        .sub-link.active .sub-icon { fill: #fff; opacity: 1; }
        /* Nested menu-head inside sub-menu (untuk bab dengan sub a,b,c) */
        .sub-menu .menu-head { padding: 8px 14px 8px 28px; font-size: 0.85rem; }
        .sub-menu .menu-head .icon { width: 16px; height: 16px; }
        .sub-menu .sub-menu .sub-link { padding-left: 52px; font-size: 0.8rem; }
        .extra-menu {
            margin-top: 16px; padding-top: 12px;
            border-top: 2px solid rgba(43,79,140,0.08);
        }
        .extra-link {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-radius: var(--radius);
            font-family: 'Inter', sans-serif; font-size: 0.88rem; font-weight: 500;
            color: var(--primary); cursor: pointer;
            transition: all var(--transition); border: none;
            background: transparent; width: 100%; text-align: left;
        }
        .extra-link:hover { background: rgba(43,79,140,0.06); }
        .extra-link.active {
            background: var(--primary); color: #fff;
            box-shadow: 0 4px 12px rgba(43,79,140,0.25);
        }
        .extra-link .icon {
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; width: 20px; height: 20px; fill: var(--primary);
        }
        .extra-link.active .icon { fill: #fff; }
        .main-content {
            flex: 1; padding: 32px 40px 60px;
            min-width: 0; background: var(--bg-body);
        }
        .content-panel { display: none; animation: fadeUp 0.35s ease; }
        .content-panel.active { display: block; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem; font-weight: 700; color: var(--primary);
            margin-bottom: 8px; border-bottom: 3px solid var(--gold);
            padding-bottom: 10px; display: inline-block;
        }
        .panel-sub { font-size: 0.95rem; color: #5e6f82; margin-bottom: 24px; }
        .hadith-box {
            background: var(--bg-card); border-radius: var(--radius);
            padding: 20px 24px; margin: 18px 0 22px;
            box-shadow: var(--shadow); border-left: 4px solid var(--gold);
        }
        .hadith-box .arabic {
            font-size: 1.15rem; line-height: 2.1; color: #1e2b3a;
            direction: rtl; text-align: right;
            font-family: 'Times New Roman', 'Traditional Arabic', serif;
            margin-bottom: 12px; padding: 6px 0; word-wrap: break-word;
        }
        .hadith-box .translation {
            font-size: 0.95rem; line-height: 1.75; color: #2d3f54;
            border-top: 1px dashed rgba(43,79,140,0.12); padding-top: 12px;
        }
        .hadith-box .source {
            display: block; margin-top: 10px; font-size: 0.8rem;
            color: var(--gold-dark); font-weight: 600; letter-spacing: 0.2px;
        }
        .sub-section { margin-top: 28px; }
        .sub-section h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem; color: var(--primary); margin-bottom: 8px;
        }
        .sub-section p { line-height: 1.75; color: #2d3f54; margin-bottom: 12px; }
        .empty-note {
            padding: 24px; background: #fff; border-radius: var(--radius);
            box-shadow: var(--shadow); color: #5e6f82; font-style: italic;
            border-left: 4px solid var(--gold); margin: 18px 0;
        }
        /* Tentang Penulis */
        .author-card {
            background: linear-gradient(135deg, #fffaf0 0%, #fdf4e3 100%);
            border-radius: 16px; padding: 28px;
            box-shadow: var(--shadow);
            border: 2px dashed var(--gold);
            margin-top: 16px;
        }
        .author-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem; font-weight: 900;
            color: var(--primary); text-align: center;
            letter-spacing: 1px; line-height: 1;
        }
        .author-tagline {
            text-align: center; color: var(--olive);
            font-style: italic; font-size: 0.95rem;
            margin: 10px 0 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(201,168,76,0.4);
        }
        .author-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }
        .info-block {
            background: #fff; border-radius: 12px; padding: 18px 20px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }
        .info-block h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem; color: var(--primary);
            margin-bottom: 12px; padding-bottom: 8px;
            border-bottom: 2px solid var(--gold);
            display: flex; align-items: center; gap: 8px;
        }
        .info-block h3 .emoji { font-size: 1.2rem; }
        .info-list { list-style: none; padding: 0; }
        .info-list li {
            padding: 6px 0; font-size: 0.88rem;
            color: #2d3f54; line-height: 1.55;
            display: flex; gap: 8px;
        }
        .info-list li strong {
            color: var(--primary); min-width: 110px; flex-shrink: 0; font-weight: 600;
        }
        .info-list li .val { color: #2d3f54; }
        .timeline { list-style: none; padding: 0; position: relative; }
        .timeline::before {
            content: ''; position: absolute; left: 7px; top: 4px; bottom: 4px;
            width: 2px; background: rgba(201,168,76,0.4);
        }
        .timeline li {
            position: relative; padding: 6px 0 6px 26px;
            font-size: 0.85rem; color: #2d3f54; line-height: 1.5;
        }
        .timeline li::before {
            content: ''; position: absolute; left: 3px; top: 12px;
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--gold); border: 2px solid #fff;
            box-shadow: 0 0 0 2px var(--gold);
        }
        .timeline li .year {
            display: block; font-size: 0.75rem;
            color: var(--gold-dark); font-weight: 600; margin-top: 2px;
        }
        .skill-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .skill-tag {
            background: rgba(43,79,140,0.08); color: var(--primary);
            padding: 5px 12px; border-radius: 20px;
            font-size: 0.78rem; font-weight: 500;
        }
        .contact-list li {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 0; font-size: 0.88rem; color: #2d3f54;
        }
        .contact-list .ci {
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(201,168,76,0.15);
            display: flex; align-items: center; justify-content: center;
            color: var(--gold-dark); font-weight: 700; flex-shrink: 0;
        }
        .overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.35); z-index: 850;
            backdrop-filter: blur(2px);
        }
        .overlay.active { display: block; }
        .prakata-text {
            line-height: 1.85; font-size: 0.98rem;
            color: #2d3f54; margin-bottom: 16px; text-align: justify;
        }
        .prakata-text strong { color: var(--primary); }
        .signature {
            text-align: right; font-style: italic;
            color: #5e6f82; margin-top: 20px;
        }
        @media (max-width: 991px) {
            .app-header .hamburger { display: flex; }
            .sidebar {
                position: fixed; top: var(--header-height); right: 0;
                height: calc(100vh - var(--header-height));
                transform: translateX(100%);
                box-shadow: -8px 0 30px rgba(0,0,0,0.10);
                border-left: none; width: 300px; padding: 12px 8px 30px;
            }
            .sidebar.open { transform: translateX(0); }
            .main-content { padding: 20px 18px 40px; }
            .panel-title { font-size: 1.4rem; }
            .app-header .brand .title-group h1 { font-size: 1rem; }
            .app-header .brand img { height: 36px; }
            .hadith-box { padding: 16px 18px; }
            .hadith-box .arabic { font-size: 1rem; }
            .author-grid { grid-template-columns: 1fr; }
            .author-name { font-size: 1.7rem; }
        }
        @media (max-width: 480px) {
            :root { --header-height: 64px; }
            .app-header { padding: 0 14px; }
            .app-header .brand .title-group h1 { font-size: 0.85rem; }
            .app-header .brand .title-group .author { font-size: 0.68rem; }
            .sidebar { width: 280px; }
            .main-content { padding: 14px 12px 30px; }
            .panel-title { font-size: 1.2rem; }
            .sub-link { padding: 7px 10px 7px 28px; font-size: 0.78rem; }
            .menu-head { padding: 10px 12px; font-size: 0.82rem; }
            .author-card { padding: 18px; }
            .info-block { padding: 14px; }
            .info-list li { font-size: 0.82rem; }
            .info-list li strong { min-width: 90px; }
        }
    </style>
</head>

            // ===== DATA PRAKATA =====
            const topMenuData = [{
                id: 'prakata',
                label: 'Prakata',
                icon: svgIcons.book,
                content: `
                    <h2 class="panel-title">Prakata</h2>
                    <p class="prakata-text">
                        Penulis berterima kasih kepada Allah SWT atas rahmat, hidayah, dan inayah-Nya yang telah memungkinkan penulis menyelesaikan ebook berjudul <strong>"Prokrastinasi (Menunda-nunda Pekerjaan) dalam Perspektif Hadis: Kajian Hadis Tematik tentang Upaya Menghindari Prokrastinasi dalam Mewujudkan Produktivitas Muslim"</strong> dengan cepat. Uswah hasanah Nabi Muhammad SAW telah membimbing orang-orang menuju kebenaran. Semoga shalawat dan salam senantiasa tercurah kepadanya.
                    </p>
                    <p class="prakata-text">
                        Ebook ini disusun untuk mendalami bagaimana nilai-nilai nabawi memberikan solusi terhadap fenomena prokrastinasi atau menunda pekerjaan yang sering menjadi kendala dalam produktivitas umat. Melalui kajian hadis tematik ini, diharapkan pembaca dapat memahami upaya-upaya dalam menghindari sifat mempertahankan guna mewujudkan produktivitas sebagai seorang Muslim.

                                <div class="translation">Telah menceritakan kepada kami Muhammad bin Salam, telah mengabarkan kepada kami Abdullah dari Ubaidillah bin Umar dari Khubaib bin Abdurrahman dari Hafsh bin 'Ashim dari Abu Hurairah dari Nabi SAW bersabda, <strong>"Ada tujuh golongan yang Allah melindungi mereka dalam lindungan-Nya pada hari kiamat, di hari ketika tiada perlindungan selain perlindungan-Nya, yaitu: imam yang adil, pemuda yang tumbuh dalam beribadah kepada Allah, seseorang yang senantiasa mengingat Allah saat sendiri sehingga matanya berlinang, seseorang yang hatinya selalu terkait dengan masjid, dua orang yang saling mencintai karena Allah, seseorang yang diajak berkencan oleh wanita bangsawan dan rupawan, namun ia menjawab, 'Saya takut kepada Allah', serta seseorang yang bersedekah secara sembunyi-sembunyi hingga tangan kirinya tidak mengetahui apa yang dilakukan oleh tangan kanannya."</strong></div>

                            </div>

                document.querySelectorAll('.sub-link, .extra-link').forEach(el => el.classList.remove('active'));

            function toggleSection(btn) {
                const sub = btn.nextElementSibling;
                if (!sub) return;
                const isOpen = sub.classList.contains('open');
                if (isOpen) {
                    sub.classList.remove('open');
                    btn.classList.remove('open');
                    btn.setAttribute('aria-expanded', 'false');

            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }
            function toggleSidebar() {
                if (sidebar.classList.contains('open')) closeSidebar();
                else openSidebar();
            }

            function init() {
                renderPanels();
                renderTopMenu();
                renderMenu();
                renderExtraMenu();

                topMenuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                    }
                });

                menuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('menu-head')) {
                        e.stopPropagation();
                        toggleSection(target);
                        return;
                    }
                    if (target.classList.contains('sub-link')) {
                        e.preventDefault();
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                        return;
                    }
                });

                extraMenuContainer.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;
                    if (target.classList.contains('extra-link')) {
                        const panelId = target.dataset.panel;
                        if (panelId) showPanel(panelId, true);
                    }
                });

                if (topMenuData.length > 0) {
                    showPanel(topMenuData[0].id, false);
                }

                hamburger.addEventListener('click', toggleSidebar);
                overlay.addEventListener('click', closeSidebar);
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 991) closeSidebar();
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
                });
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
</body>
</html>
