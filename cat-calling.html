        .app-header .brand .title-group {

        }

        .menu-section {

        .menu-section:last-of-type {

        .menu-head {

            padding: 0;
            margin: 0 0 6px 0;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s ease, opacity 0.25s ease;

        .sub-menu.open {

            opacity: 1;

        .sub-menu li {
            margin: 0;
        }

            display: flex;
            align-items: center;
            gap: 10px;

            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 450;

        .sub-link:hover {

        .sub-link.active {

            color: #fff;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(43, 79, 140, 0.25);
        }
        .sub-link .sub-icon {

            width: 1.2rem;
            text-align: center;
        }
        .sub-link.active .sub-icon {

        }
        .extra-menu {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 2px solid rgba(43, 79, 140, 0.08);
        }
        .extra-link {

            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--primary);
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .extra-link:hover {
            background: rgba(43, 79, 140, 0.06);
        }
        .extra-link.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(43, 79, 140, 0.25);

        .extra-link .icon {
            font-size: 1.1rem;
            width: 1.5rem;
            text-align: center;
        }
        .main-content {

            padding: 32px 40px 60px;
            min-width: 0;
            background: var(--bg-body);
        }
        .content-panel {
            display: none;
            animation: fadeUp 0.35s ease;
        }
        .content-panel.active {
            display: block;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;

            padding-bottom: 10px;
            display: inline-block;

        .panel-sub {

            color: #5e6f82;

        .hadith-box .arabic {

            color: #1e2b3a;
            direction: rtl;
            font-family: 'Times New Roman', 'Traditional Arabic', serif;
            margin-bottom: 12px;
            padding: 6px 0;
            word-wrap: break-word;
        }
        .hadith-box .translation {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #2d3f54;
            border-top: 1px dashed rgba(43, 79, 140, 0.12);
            padding-top: 12px;
        }
        .hadith-box .source {
            display: block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--gold-dark);
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .sub-section {
            margin-top: 28px;
        }
        .sub-section h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .sub-section p {
            line-height: 1.7;
            color: #2d3f54;
            margin-bottom: 10px;
        }
        .bibliography {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 2px solid rgba(43, 79, 140, 0.10);
        }
        .bibliography h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 14px;
        }
        .bibliography ul {
            list-style: none;
            padding: 0;
        }
        .bibliography ul li {
            padding: 6px 0 6px 20px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #2d3f54;
            border-bottom: 1px solid rgba(43, 79, 140, 0.05);
            text-indent: -20px;
            padding-left: 30px;
        }
        .bibliography ul li::before {
            content: "•";
            color: var(--gold);
            font-weight: 700;
            margin-right: 8px;
        }
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 850;
            backdrop-filter: blur(2px);
        }
        .overlay.active {
            display: block;
        }
        @media (max-width: 991px) {
            .app-header .hamburger {
                display: flex;
            }
            .sidebar {
                position: fixed;
                top: var(--header-height);
                right: 0;
                height: calc(100vh - var(--header-height));
                transform: translateX(100%);
                box-shadow: -8px 0 30px rgba(0, 0, 0, 0.10);
                border-left: none;
                width: 290px;
                padding: 12px 8px 30px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                padding: 20px 18px 40px;
            }
            .panel-title {
                font-size: 1.5rem;
            }
            .app-header .brand .title-group h1 {
                font-size: 1rem;

            .app-header .brand img {

            }

                padding: 16px 18px;
            }
            .hadith-box .arabic {
                font-size: 1rem;
            }
        }
        @media (max-width: 480px) {
            :root {
                --header-height: 64px;
            }
            .app-header {
                padding: 0 14px;
            }
            .app-header .brand .title-group h1 {
                font-size: 0.85rem;
            }
            .app-header .brand .title-group .author {
                font-size: 0.7rem;
            }
            .sidebar {
                width: 265px;
            }
            .main-content {
                padding: 14px 12px 30px;
            }
            .panel-title {
                font-size: 1.25rem;
            }
            .sub-link {

            }
            .menu-head {
                padding: 10px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="brand">

            <div id="panelContainer"></div>

    <script>
        (function() {
            'use strict';

            // ===== DATA MENU =====
            const menuData = [{
                id: 'bab1',
                label: 'UPAYA ANTI CATCALLING',
                icon: 'fa-shield-halved',
                children: [{
                    id: '1-1',
                    label: 'Anti Catcalling',
                    icon: 'fa-chevron-right',
                    content: `
                        <h2 class="panel-title">Anti Catcalling</h2>
                        <div class="hadith-box">
                            <div class="arabic">حَدَّثَنِي عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعْدٍ عَنْ ابْنِ شِهَابٍ عَنْ أَبِي سَلَمَةَ عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلَا يُؤْذِ جَارَهُ وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ ضَيْفَهُ</div>
                            <div class="translation">Telah menceritakan kepada kami Abdul Aziz bin Abdillah, telah menceritakan kepada kami Ibrahim bin Sa‘ad dari Ibnu Syihab dari Abu Salamah dari Abu Hurairah radhiallahu‘anhu, ia berkata, Rasulullah ﷺ bersabda, <strong>“Barang siapa yang beriman kepada Allah dan hari Akhir, hendaknya ia berkata baik atau diam. Barang siapa yang beriman kepada Allah dan hari Akhir, janganlah ia menyakiti tetangganya, dan barang siapa yang beriman kepada Allah dan hari Akhir, hendaknya ia memuliakan tamunya.”</strong></div>
                            <span class="source">Sumber: Shahih Bukhari</span>
                        </div>
                        <div style="background:#f5f0e6; border-radius:12px; padding:18px 22px; margin:12px 0 24px; border-left:4px solid var(--gold);">
                            <p style="font-size:0.95rem; color:#2d3f54;"><strong><i class="fas fa-bullhorn" style="color:var(--primary);"></i> Pesan Utama:</strong> Hadis ini mengajarkan bahwa iman sejati tercermin dalam perkataan dan perbuatan. Seorang mukmin tidak hanya menjaga lisannya dari keburukan, tetapi juga menjaga hubungan baik dengan tetangga dan memuliakan tamu.</p>
                        </div>
                    `
                }, {
                    id: '1-2',
                    label: 'Menjaga Lisan dan Perbuatan',
                    icon: 'fa-chevron-right',
                    content: `
                        <h2 class="panel-title">Menjaga Lisan dan Perbuatan</h2>
                        <div class="hadith-box">
                            <div class="arabic">حَدَّثَنَا مُحَمَّدُ بْنُ عُبَيْدٍ حَدَّثَنَا زَكَرِيَّا عَنْ عَامِرٍ سَمِعْتُ عَبْدَ اللَّهِ بْنَ عَمْرٍو سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ الْمُسْلِمُ مَنْ سَلِمَ النَّاسُ مِنْ لِسَانِهِ وَيَدِهِ وَالْمُهَاجِرُ مَنْ هَجَرَ مَا نَهَى اللَّهُ عَنْهُ</div>
                            <div class="translation">Telah menceritakan kepada kami Muhammad bin Ubaid, telah menceritakan kepada kami Zakaria dari ‘Amir, dia berkata, aku mendengar Abdullah bin ‘Amru berkata, aku mendengar Rasulullah ﷺ bersabda, <strong>“Seorang muslim adalah jika manusia selamat dari kejahatan lisan dan tangannya, dan seorang muhajir adalah orang yang menjauhi apa yang Allah larang.”</strong></div>
                            <span class="source">Sumber: Shahih Bukhari</span>
                        </div>
                        <div style="background:#f5f0e6; border-radius:12px; padding:18px 22px; margin:12px 0 24px; border-left:4px solid var(--gold);">
                            <p style="font-size:0.95rem; color:#2d3f54;"><strong><i class="fas fa-bullhorn" style="color:var(--primary);"></i> Pesan Utama:</strong> Keislaman seseorang diukur dari sejauh mana ia menjadi sumber keselamatan bagi orang lain — baik dari lisannya maupun tangannya. Hijrah (muhajir) sejati adalah meninggalkan segala yang dilarang Allah.</p>
                        </div>
                    `
                }, {
                    id: '1-3',
                    label: 'Prinsip Ukhuwwah Islamiyyah',
                    icon: 'fa-chevron-right',
                    content: `
                        <h2 class="panel-title">Prinsip Ukhuwwah Islamiyyah</h2>
                        <div class="hadith-box">
                            <div class="arabic">حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ بْنِ قَعْنَبٍ. حدثنا داود (يعني ابن قيس) عن أبي سعيد، مولى عامر بن كريز، عن أبي هريرة. قال: قال رسول الله صلى الله عليه وسلم "لا تحاسدوا. ولا تناجشوا، ولا تباغضوا، ولا تدابروا، ولا يبع بعضكم على بيع بعض. وكونوا، عباد الله! إخوانا. المسلم أخو المسلم. لا يظلمه، ولا يخذله، ولا يحقره. التقوى ههنا" ويشير إلى صدره ثلاث مرات "بحسب امرئ من الشر أن يحقر أخاه المسلم. كل المسلم على المسلم حرام. دمه وماله وعرضه"</div>
                            <div class="translation">Telah menceritakan kepada kami Abdullah bin Maslamah bin Qanab telah menceritakan kepada kami Dawud bin Qais dari Abu Said, maula Amir bin Kriz, dari Abu Hurairah, Rasulullah SAW bersabda: <strong>“Janganlah kalian saling dengki, janganlah kalian saling menawar (dalam harga), janganlah kalian saling membenci, janganlah kalian saling berkhianat, dan janganlah kalian saling menjual atas penjualan saudaranya. Jadilah kalian, wahai hamba-hamba Allah, sebagai saudara. Sesungguhnya seorang muslim adalah saudara muslim lainnya. Dia tidak boleh menzaliminya, tidak boleh menelantarkannya, dan tidak boleh menghinanya. Takwa itu ada di sini.”</strong> (Rasulullah SAW menunjuk ke dadanya tiga kali) <strong>“Cukuplah bagi seseorang dari keburukan apabila dia menghina saudaranya sesama muslim. Setiap muslim haram bagi muslim lainnya: darahnya, hartanya, dan kehormatannya.”</strong></div>
                            <span class="source">Sumber: Shahih Muslim</span>
                        </div>
                        <div style="background:#f5f0e6; border-radius:12px; padding:18px 22px; margin:12px 0 24px; border-left:4px solid var(--gold);">
                            <p style="font-size:0.95rem; color:#2d3f54;"><strong><i class="fas fa-bullhorn" style="color:var(--primary);"></i> Pesan Utama:</strong> Hadis ini menjadi fondasi persaudaraan Islam. Menghina saudara muslim adalah keburukan yang sangat besar, dan seluruh aspek kehormatan, harta, serta darah seorang muslim adalah haram bagi muslim lainnya.</p>
                        </div>
                    `
                }, {
                    id: '1-4',
                    label: 'Diam Selamat',
                    icon: 'fa-chevron-right',
                    content: `
                        <h2 class="panel-title">Diam Selamat</h2>
                        <div class="hadith-box">
                            <div class="arabic">حَدَّثَنَا إِسْحَاقُ بْنُ عِيسَى حَدَّثَنِي ابْنُ لَهِيعَةَ عَنْ يَزِيدَ بْنِ عَمْرٍو عَنْ أَبِي عَبْدِ الرَّحْمَنِ الْحُبُلِيِّ عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو قَالَ قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَنْ صَمَتَ نَجَا</div>
                            <div class="translation">Telah menceritakan kepada kami Ishaq bin Isa, telah menceritakan kepadaku Ibnu Lahi‘ah dari Yazid bin Amru dari Abu Abdirrahman Al Hubali dari Abdullah bin Amr dia berkata, Rasulullah ﷺ bersabda, <strong>“Barang siapa diam, ia selamat.”</strong></div>
                            <span class="source">Sumber: Sunan Tirmidzi</span>

                            <p style="font-size:0.95rem; color:#2d3f54;"><strong><i class="fas fa-bullhorn" style="color:var(--primary);"></i> Pesan Utama:</strong> Akhlak mulia adalah amal yang paling berat timbangannya di hari kiamat. Sebaliknya, orang yang kasar dan berkata-kata kotor sangat dibenci oleh Allah. Ini menjadi peringatan keras bagi pelaku catcalling.</p>
                        </div>
                    `
                }, {
                    id: '3-3',
                    label: 'Menghina Muslim Adalah Jahat',
                    icon: 'fa-chevron-right',
                    content: `
                        <h2 class="panel-title">Menghina Muslim Adalah Jahat dan Membunuhnya Adalah Kafir</h2>
                        <div class="hadith-box">
                            <div class="arabic">حَدَّثَنَا عُمَرُ بْنُ حَفْصٍ، حَدَّثَنِي أَبِي، حَدَّثَنَا الْأَعْمَشُ، حَدَّثَنَا شَقِيقٌ قَالَ قَالَ عَبْدُ اللهِ: قَالَ النَّبِيُّ ﷺ: «سِبَابُ الْمُسْلِمِ فُسُوقٌ، وَقِتَالُهُ كُفْرٌ»</div>
                            <div class="translation">Telah menceritakan kepada kami Umar bin Hafs, telah menceritakan kepadaku ayahku, telah menceritakan kepada kami Al-A‘mash, telah menceritakan kepada kami Shaqiq, dia berkata: Abdullah berkata: Nabi SAW bersabda: <strong>“Menghina seorang muslim adalah tindakan kejahatan. Dan membunuhnya adalah kafir.”</strong></div>
                            <span class="source">Sumber: Shahih Bukhari</span>
                        </div>
                        <div style="background:#f5f0e6; border-radius:12px; padding:18px 22px; margin:12px 0 24px; border-left:4px solid var(--gold);">
                            <p style="font-size:0.95rem; color:#2d3f54;"><strong><i class="fas fa-bullhorn" style="color:var(--primary);"></i> Pesan Utama:</strong> Menghina (sibab) sesama muslim termasuk perbuatan fasik (jahat). Ini menunjukkan bahwa catcalling yang mengandung penghinaan terhadap kehormatan seseorang adalah dosa besar. Sedangkan membunuhnya adalah kekufuran.</p>
                        </div>
                    `
                }, {
                    id: '3-4',
                    label: 'Hilangnya Pahala Kebaikan',
                    icon: 'fa-chevron-right',
                    content: `
                        <h2 class="panel-title">Hilangnya Pahala Kebaikan</h2>
                        <div class="hadith-box">
                            <div class="arabic">حَدَّثَنَا قُتَيْبَة بْنُ سَعِيْدٍ وَعَلِيُّ بْنُ حُجْرٍ. قَالَا: حَدَّثَنَا إِسْمَاعِيلُ (وَهُوَ ابْنُ جَعْفَرٍ) عَنِ الْعَلَاءِ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ؛ أَنَّ رَسُوْلَ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ "أَتَدْرُوْنَ مَا المُفْلِسُ؟" قاَلُوا: المُفْلِسُ فِيْنَا مَنْ لَا دِرْهَمٌ لَهُ وَلَا مَتَاعٌ. فَقَالَ "إِنَّ المُفْلِسَ مِنْ أُمَّتِي، يَأْتِي يَوْمَ القِيَامَةِ بِصَلَاةِ وَصِيَامِ وَزكَاةِ، وَيَأْتِي قَدْ شتم هَذَا، وَقَذَفَ هَذَا، وَأَكَلَ مَالَ هَذَا، وسفك دم هَذَا، وَضَرَبَ هَذَا. فَيعطى هذا مِنْ حَسَنَاتِهِ وَهَذَا مِنْ حَسَنَاتِهِ. فَإِن فنيت حَسَنَاتِهِ، قَبْلَ أَنْ يَقْضِى مَا عَلَيْهِ، أَخَذَ مِنْ خَطَايَاهُمْ فَطَرَحَتْ عَلَيْهِ. ثُمَّ طَرَحَ فِي النَّارِ"</div>
                            <div class="translation">Telah menceritakan kepada kami Qutaibah ibn Sa‘id dan Ali bin Hujr berkata telah menceritakan kepada kami Ismail (yaitu putra Ja‘far) telah menceritakan kepada kami dari Al-A‘laa, dari ayahnya, dari Abu Hurairah, bahwa Rasulullah shallallahu alaihi wa sallam bersabda, <strong>“Tahukah kalian siapa orang yang muflis (bangkrut) itu?”</strong> Para sahabat menjawab, <em>“Orang yang muflis di antara kami adalah yang tidak memiliki dirham atau harta benda.”</em> Beliau shallallahu alaihi wa sallam bersabda, <strong>“Sesungguhnya orang yang muflis dari umatku adalah dia yang datang pada hari kiamat dengan membawa pahala shalat, puasa, dan zakat. Akan tetapi, dia pernah mencela orang lain, menuduh (mencemarkan nama baik) orang lain, memakan harta orang lain, menumpahkan darah orang lain, dan memukul orang lain. Maka pahala kebaikannya akan diberikan kepada orang yang dicelanya sebagian, dan kepada orang yang dituduhnya sebagian. Jika amal kebaikannya telah habis sebelum hutangnya terlunasi, maka akan diambilkan sebagian dari kesalahan orang-orang yang pernah dizalimi itu lalu dibebankan kepadanya, kemudian dia akan dilemparkan ke dalam neraka.”</strong></div>
                            <span class="source">Sumber: Shahih Muslim</span>
                        </div>
                        <div style="background:#f5f0e6; border-radius:12px; padding:18px 22px; margin:12px 0 24px; border-left:4px solid var(--gold);">
                            <p style="font-size:0.95rem; color:#2d3f54;"><strong><i class="fas fa-bullhorn" style="color:var(--primary);"></i> Pesan Utama:</strong> Salah satu dampak paling mengerikan dari catcalling dan penghinaan adalah hilangnya pahala kebaikan di akhirat. Pelaku catcalling yang mencela atau menuduh orang lain akan kehilangan amal shalihnya, dan jika tidak cukup, dosa orang yang dizalimi akan dipikulnya. Ini adalah kebangkrutan hakiki.</p>
                        </div>
                    `
                }]
            }];

            // ===== TOP MENU & EXTRA MENU DATA =====
            const topMenuData = [{
                id: 'home',
                label: 'Home',
                icon: 'fa-house',
                content: `
                    <h2 class="panel-title">Ebook Digital</h2>
                    <h3 style="font-family:'Playfair Display',serif; font-size:1.8rem; color:var(--primary); margin:0.5rem 0 1.5rem;">📖 Catcalling dalam Perspektif Hadis</h3>
                    <div style="background:var(--bg-card); border-radius:var(--radius); padding:2rem; box-shadow:var(--shadow);">
                        <p style="font-size:1.1rem; line-height:1.8; color:#2d3f54;">Mengupas tuntunan Nabi ﷺ dalam menjaga lisan, menghindari ucapan keji, dan menghormati kehormatan sesama muslim. Ebook ini mengkaji berbagai hadis tentang larangan catcalling, body shaming, dan dampak buruknya.</p>
                        <div style="margin-top:1.5rem; display:flex; gap:1rem; flex-wrap:wrap;">
                            <span style="background:#e8edf5; padding:0.5rem 1rem; border-radius:30px;"><i class="fas fa-shield-halved" style="color:var(--primary);"></i> Anti Catcalling</span>
                            <span style="background:#e8edf5; padding:0.5rem 1rem; border-radius:30px;"><i class="fas fa-list" style="color:var(--primary);"></i> Jenis Catcalling</span>
                            <span style="background:#e8edf5; padding:0.5rem 1rem; border-radius:30px;"><i class="fas fa-triangle-exclamation" style="color:var(--primary);"></i> Dampak Catcalling</span>
                        </div>
                        <p style="margin-top:1.5rem; color:#6b7280;"><i class="fas fa-user-graduate" style="color:var(--gold);"></i> Penyusun: Irfan Padlian Syah & Muhammad Alif</p>
                    </div>
                `
            }];

            const extraData = [{
                id: 'daftar-pustaka',
                label: 'Daftar Pustaka',
                icon: 'fa-book',
                content: `
                    <h2 class="panel-title">Daftar Pustaka</h2>
                    <div class="bibliography">
                        <ul>
                            <li>Al-Bukhāriy, Abū ‘Abdillāh Muḥammad ibn Ismā‘īl. <em>Al-Jāmi‘ Al-Musnad Al-Ṣaḥīḥ</em>. Dār Ṭauq al-Najāt.</li>
                            <li>Muslim ibn Al-Ḥajjāj. <em>Al-Musnad Al-Ṣaḥīḥ Al-Mukhtaṣar</em>. Dār Iḥyā’ al-Turāṡ al-‘Arabiy.</li>
                            <li>Abū Dāwud, Sulaimān ibn Al-Asy‘aṡ. <em>Sunan Abī Dāwud</em>.</li>
                            <li>Al-Tirmīziy, Abū ‘Īsā. <em>Al-Jāmi‘ Al-Kabīr (Sunan Al-Tirmīziy)</em>.</li>
                            <li>Ibn Ḥanbal, Aḥmad. <em>Musnad Al-Imām Aḥmad</em>.</li>
                            <li>An-Nasā’iy, Aḥmad ibn Shu‘ayb. <em>Sunan An-Nasā’iy</em>.</li>
                        </ul>
                    </div>
                `
            }];

            // ===== RENDER =====
            const topMenuContainer = document.getElementById('topMenu');
            const menuContainer = document.getElementById('menuContainer');
            const extraMenuContainer = document.getElementById('extraMenu');
            const panelContainer = document.getElementById('panelContainer');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const hamburger = document.getElementById('hamburgerBtn');

            function renderTopMenu() {
                let html = '';
                topMenuData.forEach(item => {
                    html += `<div style="margin-bottom:12px; padding-bottom:12px; border-bottom:2px solid rgba(43,79,140,0.08);">`;
                    html += `<button class="extra-link" data-panel="${item.id}">
                        <span class="icon"><i class="fas ${item.icon}"></i></span> ${item.label}
                    </button>`;
                    html += `</div>`;
                });
                topMenuContainer.innerHTML = html;
            }

            function renderMenu() {
                let html = '';
                menuData.forEach(item => {
                    html += `<div class="menu-section">`;
                    html += `<button class="menu-head open" data-toggle="${item.id}" aria-expanded="true">
                        <span class="icon"><i class="fas ${item.icon || 'fa-folder'}"></i></span> ${item.label}
                        <span class="arrow">▶</span>
                    </button>`;
                    html += `<ul class="sub-menu open">`;
                    item.children.forEach(child => {
                        html += `<li><button class="sub-link" data-panel="${child.id}">
                            <span class="sub-icon"><i class="fas ${child.icon || 'fa-chevron-right'}"></i></span> ${child.label}
                        </button></li>`;
                    });
                    html += `</ul></div>`;
                });
                menuContainer.innerHTML = html;
            }

            function renderExtraMenu() {
                let html = '';
                extraData.forEach(item => {
                    html += `<button class="extra-link" data-panel="${item.id}">
                        <span class="icon"><i class="fas ${item.icon}"></i></span> ${item.label}
                    </button>`;
                });
                extraMenuContainer.innerHTML = html;
            }

            function renderPanels() {
                let html = '';
                topMenuData.forEach(item => {
                    html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                });
                menuData.forEach(section => {
                    section.children.forEach(child => {
                        html += `<div class="content-panel" id="panel-${child.id}">${child.content}</div>`;
                    });
                });
                extraData.forEach(item => {
                    html += `<div class="content-panel" id="panel-${item.id}">${item.content}</div>`;
                });
                panelContainer.innerHTML = html;
            }

            function showPanel(panelId, fromSubLink = true) {
                document.querySelectorAll('.content-panel').forEach(el => el.classList.remove('active'));
                const panel = document.getElementById('panel-' + panelId);
                if (panel) panel.classList.add('active');
                
                document.querySelectorAll('.sub-link, .extra-link').forEach(el => el.classList.remove('active'));
                const links = document.querySelectorAll(`[data-panel="${panelId}"]`);
                links.forEach(link => link.classList.add('active'));

                if (window.innerWidth <= 991 && fromSubLink) closeSidebar();
            }

            function toggleSection(btn) {
                const sub = btn.nextElementSibling;
                if (!sub) return;
                const isOpen = sub.classList.contains('open');
                if (isOpen) {
                    sub.classList.remove('open');
                    btn.classList.remove('open');
                    btn.setAttribute('aria-expanded', 'false');
                } else {
                    sub.classList.add('open');
                    btn.classList.add('open');
                    btn.setAttribute('aria-expanded', 'true');
                }
            }

            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function toggleSidebar() {
                if (sidebar.classList.contains('open')) closeSidebar();
                else openSidebar();
            }

            function init() {
                renderPanels();
                renderTopMenu();
                renderMenu();
                renderExtraMenu();

                // Delegasi event untuk sidebar secara global agar aman dan responsif
                sidebar.addEventListener('click', function(e) {
                    const menuHead = e.target.closest('.menu-head');
                    if (menuHead) {
                        e.stopPropagation();
                        toggleSection(menuHead);
                        return;
                    }

                    const clickable = e.target.closest('[data-panel]');
                    if (clickable) {
                        const panelId = clickable.dataset.panel;
                        if (panelId) {
                            showPanel(panelId, true);
                        }
                    }
                });

                // Default: tampilkan home
                if (topMenuData.length > 0) {
                    showPanel(topMenuData[0].id, false);
                }

                hamburger.addEventListener('click', toggleSidebar);
                overlay.addEventListener('click', closeSidebar);
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 991) closeSidebar();
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
                });
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
</body>
</html>
