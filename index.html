              <div class="container">
                <img src="logo-pshd.jpg" alt="Logo PSHD" class="welcome-logo" />
                <h1>Pusat Studi Hadis Digital</h1>
                <div class="subtitle">UIN Sultan Maulana Hasanuddin Banten</div>
                <p><strong>Selamat datang</strong> di portal hadis tematik berbasis <strong>Analisis Tematik Terstruktur (ATT)</strong> dengan pendekatan adaptasi <strong>Constructive Grounded Theory for Fixed Corpus</strong>.</p>
                <div class="highlight"><strong>⚡ Revitalisasi Tacit Knowledge Tematisasi Hadis</strong><br>Kajian ini merupakan upaya menghidupkan kembali <em>tacit knowledge</em> muḥaddiṡṡīn dalam <em>captioning</em> hadis sesuai kebutuhan kontemporer—sebuah mata rantai keilmuan yang telah lama terhenti sejak Ibnu Qayyim, dan sebenarnya telah mulai diupayakan untuk dihidupkan kembali oleh Kemenag, sebagaimana yang terlihat pada Silabus Hadis Sosial pada tahun 1980-an semisal Hadis Tematik Etos Kerja, Peduli Lingkungan, Kepemimpinan, Kesenian dan lain-lain.</div>
                <p>Beberapa pilar metodologis yang menjadi fondasi kajian ini:</p>
                <ul>
                  <li><strong>Analisis Tematik Terstruktur (ATT)</strong> — adalah metode studi tematik yang mengolah data teks (Al-Qur'an dan Hadis) secara sistematis melalui alur: ekstraksi substansi fenomena kontemporer → pencarian ayat/hadis berbasis kriteria inklusi → open-axial-selective coding dengan panduan sensitizing concept → output berupa prototipe klasifikasi dan abstraksi tematik ala Bulūgul-Marām. Metode ini terinspirasi oleh inversi double movement Fazlur Rahman [→ mengamati dan mendedah fenomena kontemporer hingga ke basiknya → mencari <em>aṣālah</em> atas basik fenomena kontemporer tersebut pada hadis → membawa pemahaman hadis dalam konteks kontemporer] dan dirancang untuk mengeksplisitkan tacit knowledge pakar hadis agar dapat dipraktikkan oleh peneliti pemula dengan pengakuan atas saturasi relatif sebagai keterbatasan wawasan peneliti.</li>
                  <li><strong>Sampling Theory</strong> — berbasis <em>concept driven coding</em> (bukan <em>data driven</em>), bertumpu pada <em>sensitizing concept</em> dari <em>preliminary research</em> yang menunjukkan <em>wiḥdatul-gāyah</em> tema dalam perspektif umum-kontemporer. Konsep awal ini menjadi kerangka seleksi korpus dan kodifikasi, memastikan arah tematik tetap utuh dan koheren. Prosesnya <em>a posteriori</em>: induktif dari data, namun dalam bingkai konseptual yang telah dirumuskan.</li>
                  <li><strong>Saturasi Relatif</strong> — pengakuan jujur bahwa kejenuhan data sangat bergantung pada wawasan, kapabilitas, dan keterbatasan subjektif peneliti, dalam menjaring dan memetakan tematisasi hadis, bukan klaim absolut atas hasil olah data.</li>
                  <li><strong>Refleksivitas Peneliti</strong> — pernyataan eksplisit bahwa temuan ini adalah hasil usaha maksimal sesuai kemampuan, bukan klaim final atau lengkap.</li>
                  <li><strong>Peer Briefing &amp; Audit Trail</strong> — setiap langkah analisis didokumentasikan secara transparan dan didiskusikan dengan rekan sejawat untuk menjaga kredibilitas ilmiah.</li>
                </ul>
                <blockquote><p><strong>“Sebaik-baik ilmu adalah yang bermanfaat, dan sebaik-baik manfaat adalah yang dapat dipertanggungjawabkan.”</strong></p></blockquote>
                <p><strong>Catatan Prototipe</strong> — sebagai prototipe hadis tematik, tematisasi hadis di sini lebih memerlukan penjelasan ketimbang sekadar dipahami dari hasil membaca dan mengkaitkannya dengan <em>caption</em>. Prototipe ini dapat dikembangkan dalam tiga jalur: (1) <em>tafsīr/syarah ijāzī</em> berupa artikel jurnal, (2) <em>tafsīr/syarah mutawassiṭ/musāwi</em> berupa skripsi, dan (3) <em>tafsīr/syarah iṭnābī</em> berupa tafsir/syarah hadis tematik utuh.</p>
                <p>☕ <strong>Undangan Kolaborasi Ilmiah</strong> — Penelitian ini tidak berpretensi sebagai otoritas tunggal. Pembaca dan peneliti lain yang lebih mumpuni diundang untuk merevisi, menambah, atau menggugat temuan ini. Inilah semangat <strong>open science</strong> dan <strong>audit trail</strong> yang kami anut.</p>
                <p style="margin-top:8px;">Pilih menu di samping untuk mulai menjelajahi hadis-hadis tematik yang telah dianalisis.</p>
                <div class="footer-welcome">— Tim Pusat Studi Hadis Digital<br>Banten, 2026</div>
              </div>
            </body>
            </html>`;
            iframe.srcdoc = welcomeHTML;
        }

        // ================================================================
        //  4.  BANGUN MENU (dengan 3 ikon PDF dan 2 urutan)
        // ================================================================
        function buildMenuFromData(items) {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            // Kelompokkan berdasarkan kategori
            const groups = {};
            items.forEach(item => {
                const cat = item.kategori || 'Umum';
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(item);
            });

            // Urutkan item dalam setiap kategori berdasarkan urutan1 lalu urutan2
            for (let cat in groups) {
                groups[cat].sort((a, b) => {
                    const u1 = (parseInt(a.urutan1) || 0) - (parseInt(b.urutan1) || 0);
                    if (u1 !== 0) return u1;
                    return (parseInt(a.urutan2) || 0) - (parseInt(b.urutan2) || 0);
                });
            }

            // Urutkan kategori berdasarkan urutan1 dari item pertama (opsional)
            const sortedCats = Object.keys(groups).sort((catA, catB) => {
                const aFirst = groups[catA][0]?.urutan1 || 0;
                const bFirst = groups[catB][0]?.urutan1 || 0;
                return aFirst - bFirst;
            });

            const ul = document.createElement('ul');

            sortedCats.forEach(cat => {
                const li = document.createElement('li');
                const details = document.createElement('details');
                details.open = true;

                const summary = document.createElement('summary');
                summary.textContent = cat;
                details.appendChild(summary);

                const subUl = document.createElement('ul');
                groups[cat].forEach(item => {
                    const subLi = document.createElement('li');

                    // Link utama
                    const a = document.createElement('a');
                    a.href = item.file;
                    a.textContent = item.judul;
                    a.target = 'contentFrame';
                    a.addEventListener('click', function(e) {
                        closeDrawer();
                    });
                    subLi.appendChild(a);

                    // Ikon PDF1 (olahdata1)
                    if (item.pdf1 && item.pdf1.trim() !== '') {
                        const icon1 = document.createElement('span');
                        icon1.className = 'pdf-icon';
                        icon1.innerHTML = pdfIcon('1', '#ffd966');
                        icon1.title = 'Olah Data 1';
                        icon1.addEventListener('click', function(e) {
                            e.stopPropagation();
                            window.open(item.pdf1, '_blank');
                            closeDrawer();
                        });
                        subLi.appendChild(icon1);
                    }

                    // Ikon PDF2 (olahdata2)
                    if (item.pdf2 && item.pdf2.trim() !== '') {
                        const icon2 = document.createElement('span');
                        icon2.className = 'pdf-icon';
                        icon2.innerHTML = pdfIcon('2', '#ffaa66');
                        icon2.title = 'Olah Data 2';
                        icon2.addEventListener('click', function(e) {
                            e.stopPropagation();
                            window.open(item.pdf2, '_blank');
                            closeDrawer();
                        });
                        subLi.appendChild(icon2);
                    }

                    // Ikon PDF3 (ebook)
                    if (item.pdf3 && item.pdf3.trim() !== '') {
                        const icon3 = document.createElement('span');
                        icon3.className = 'pdf-icon';
                        icon3.innerHTML = pdfIcon('E', '#66ccff');
                        icon3.title = 'Ebook';
                        icon3.addEventListener('click', function(e) {
                            e.stopPropagation();
                            window.open(item.pdf3, '_blank');
                            closeDrawer();
                        });
                        subLi.appendChild(icon3);
                    }

                    subUl.appendChild(subLi);
                });
                details.appendChild(subUl);
                li.appendChild(details);
                ul.appendChild(li);
            });

            container.appendChild(ul);

            const firstLink = container.querySelector('ul li:first-child details ul li a');
            if (firstLink) {
                // biarkan user klik sendiri
            } else {
                showWelcome();
            }
        }

        // ================================================================
        //  5.  FETCH DATA
        // ================================================================
        async function fetchMenu() {
            const container = document.getElementById('menuContainer');
            try {
                container.innerHTML = `<p class="menu-status loading">${Icons.spinner} Mengambil data dari server...</p>`;
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error(`Respons bukan JSON (${contentType})`);
                }
                const data = await response.json();
                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = `<p class="menu-status warning">${Icons.warning} Data kosong. Gunakan fallback.</p>`;
                    buildMenuFromData(FALLBACK_DATA);
                    return;
                }
                buildMenuFromData(data);
            } catch (err) {
                container.innerHTML = `
                <p class="menu-status error">${Icons.error} Gagal ambil data:<br><span style="font-size:0.9rem;">${err.message}</span></p>
                <p style="color:#aac3e0; margin-top:10px;">→ Menggunakan fallback.</p>`;
                console.error(err);
                buildMenuFromData(FALLBACK_DATA);
            }
        }

        // ================================================================
        //  6.  DRAWER TOGGLE
        // ================================================================
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('drawerOverlay');
        const burgerBtn = document.getElementById('burgerBtn');

        function openDrawer() {
            drawer.classList.add('open');
            overlay.classList.add('active');
            burgerBtn.innerHTML = Icons.close;
        }

        function closeDrawer() {
            drawer.classList.remove('open');
            overlay.classList.remove('active');
            burgerBtn.innerHTML = `
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>`;
        }

        burgerBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (drawer.classList.contains('open')) closeDrawer();
            else openDrawer();
        });
        overlay.addEventListener('click', closeDrawer);

        // ================================================================
        //  7.  INISIALISASI
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            showWelcome();
            fetchMenu();
        });
        // ================================================================
        //  8.  LOGO KLIK → SHOW WELCOME
        // ================================================================
        const logoImg = document.querySelector('.logo-wrap img');
        if (logoImg) {
            logoImg.addEventListener('click', function() {
                showWelcome();
                closeDrawer(); // tutup drawer jika terbuka
            });
        }
    </script>
</body>
